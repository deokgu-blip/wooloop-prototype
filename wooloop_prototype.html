/* =========================================================================
 *  Asset Loading
 * ========================================================================= */
const ASSET_PATHS = {
  // Hoop frame and brush are now SEPARATE images so each can be positioned
  // independently. The legacy `rail` (whole composite) is kept as a fallback
  // for environments where the split assets are missing.
  railHoop:   '2D_asset/image 232.png',
  railBrush:  '2D_asset/image 231.png',
  rail:       '2D_asset/rail.png',
  railArrow:  '2D_asset/rail_arrow.png',
  woolKnot:   '2D_asset/grid_wool.png',
  threadRope: '2D_asset/wool_texture.png',
};

async function loadAll2DAssets() {
  const tex = {};
  for (const [key, url] of Object.entries(ASSET_PATHS)) {
    // Encode spaces (and any other URL-sensitive chars in the segment) so
    // filenames like "image 231.png" resolve correctly through PIXI/Assets.
    const encoded = url.split('/').map(encodeURIComponent).join('/');
    try {
      tex[key] = await PIXI.Assets.load(encoded);
    } catch (e) {
      console.warn(`[asset] failed to load ${url}: ${e?.message || e}`);
      tex[key] = null;
    }
  }
  return tex;
}

/* Pre-render 3D bobbin (11 stages) and carrier tray via Three.js.
 * Result: PIXI textures stored in Game.tex.bobbinStages[0..10] and Game.tex.tray */
async function preRender3DAssets() {
  const RENDER_SIZE = 512;
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(RENDER_SIZE, RENDER_SIZE);
  renderer.setPixelRatio(2);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setClearColor(0x000000, 0);
  // Shadow mapping: soft penumbra so the bobbin reads as having a gentle
  // drop shadow underneath, not a hard-edged directional cast that looks
  // pasted-on at sprite sizes.
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  // Two cameras:
  //   camLying — high oblique view for bobbins/trays lying on rail
  //   camUpright — top-oblique view for upright bobbins in queue/slot
  const camLying = new THREE.OrthographicCamera(-1.32, 1.32, 1.32, -1.32, 0.1, 100);
  camLying.position.set(0, 4.2, 1.55);
  camLying.lookAt(0, 0, 0);

  // Separate tray cameras (upright + lying) sized so the tray fills the
  // captured texture at any reasonable trayTiltDeg between ~50 and 90.
  // At the previously-used ±0.82 lying bounds, a partially-upright tray
  // (tilt < 80°) exceeded the camera height and got clipped. Matching
  // ±1.05 bounds on both cameras keeps the tray unclipped AND gives the
  // dump tray and rail tray nearly the same visible size for any
  // trayIdleScale, so the two states no longer look inconsistent.
  const TRAY_CAM_HALF = 1.05;
  const camTrayLying = new THREE.OrthographicCamera(-TRAY_CAM_HALF, TRAY_CAM_HALF, TRAY_CAM_HALF, -TRAY_CAM_HALF, 0.1, 100);
  camTrayLying.position.set(0, 4.2, 1.55);
  camTrayLying.lookAt(0, 0, 0);

  const camUpright = new THREE.OrthographicCamera(-1.25, 1.25, 1.25, -1.25, 0.1, 100);
  camUpright.position.set(0, 1.08, 4.35);
  camUpright.lookAt(0, 0.04, 0);

  const camTrayUpright = new THREE.OrthographicCamera(-TRAY_CAM_HALF, TRAY_CAM_HALF, TRAY_CAM_HALF, -TRAY_CAM_HALF, 0.1, 100);
  camTrayUpright.position.set(0, 1.08, 4.35);
  camTrayUpright.lookAt(0, 0.04, 0);

  const scene = new THREE.Scene();
  const ambient = new THREE.AmbientLight(0xffffff, 0.72);
  scene.add(ambient);
  // Visual key + fill lights — these only handle colour/highlights, they
  // do NOT cast shadow. Shadow comes from a separate near-overhead light
  // (below) so the cast shadow sits gently under each bobbin instead of
  // smearing far to one side.
  const dir1 = new THREE.DirectionalLight(0xffffff, 1.05);
  dir1.position.set(-2.5, 4.0, 3.0);
  scene.add(dir1);
  const dir2 = new THREE.DirectionalLight(0x9fd3ff, 0.32);
  dir2.position.set(2, 1.2, -2);
  scene.add(dir2);

  // Dedicated shadow-caster: low-intensity (= no light contribution), the
  // position is reset per-render to match the orientation's editor knobs.
  const shadowLight = new THREE.DirectionalLight(0xffffff, 0);
  shadowLight.castShadow = true;
  shadowLight.shadow.camera.near = 0.5;
  shadowLight.shadow.camera.far  = 14;
  shadowLight.shadow.camera.left   = -1.8;
  shadowLight.shadow.camera.right  =  1.8;
  shadowLight.shadow.camera.top    =  1.8;
  shadowLight.shadow.camera.bottom = -1.8;
  shadowLight.shadow.mapSize.set(2048, 2048);
  shadowLight.shadow.radius = 4;        // soft penumbra
  shadowLight.shadow.bias = -0.0005;
  scene.add(shadowLight);

  // Per-orientation shadow update. Called before each bobbin stage render
  // so the same `shadowLight` casts a different-looking shadow for idle
  // vs rail (matches each state's editor knobs).
  const configureShadow = (orientation) => {
    const isRail = orientation === 'lying';
    const angleDeg = isRail
      ? (EditorTune.bobbinShadowRailAngle ?? 30)
      : (EditorTune.bobbinShadowIdleAngle ?? 30);
    const sizeMul = isRail
      ? (EditorTune.bobbinShadowRailSize ?? 1)
      : (EditorTune.bobbinShadowIdleSize ?? 1);
    // Larger sizeMul → light closer to ground → bigger softer shadow.
    const lightY = 6.0 / Math.max(0.3, sizeMul);
    const radius = 0.5 * sizeMul;
    const a = deg2rad(angleDeg);
    shadowLight.position.set(Math.sin(a) * radius, lightY, Math.cos(a) * radius);
    shadowLight.shadow.radius = 3 * sizeMul;
  };
  const configureShadowGround = (groundMesh, orientation) => {
    const isRail = (orientation === 'lying');
    const op = isRail
      ? (EditorTune.bobbinShadowRailOpacity ?? 0.38)
      : (EditorTune.bobbinShadowIdleOpacity ?? 0.38);
    const ox = isRail
      ? (EditorTune.bobbinShadowRailOffsetX ?? 0)
      : (EditorTune.bobbinShadowIdleOffsetX ?? 0);
    const oy = isRail
      ? (EditorTune.bobbinShadowRailOffsetY ?? 0)
      : (EditorTune.bobbinShadowIdleOffsetY ?? 0);
    groundMesh.material.opacity = Math.max(0, Math.min(1, op));
    groundMesh.visible = op > 0.001;
    // Shift the cast surface in world XZ. After the -π/2 X rotation that
    // lays the plane flat, world X = horizontal in the captured texture
    // and world Z = vertical (≈ screen Y for both upright + lying cameras
    // which look roughly head-on at the bobbin). makeShadowGround sets the
    // Y to -0.78; offsets are added on top, leaving the floor distance
    // untouched so the shadow stays attached to the bobbin's footprint.
    groundMesh.position.x = ox;
    groundMesh.position.z = oy;
  };

  const makeMaterial = (kind = 'bobbin') => {
    if (kind === 'tray') {
      return new THREE.MeshStandardMaterial({
        color: 0x9fb2b8,
        roughness: 0.58,
        metalness: 0.08,
      });
    }
    return new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.42,
      metalness: 0.02,
    });
  };

  // Override source materials.
  //  - Bobbins stay white so PIXI can tint them per color.
  //  - Tray: KEEP the GLB's authored material if it has a baked texture map
  //    (so model_optimized.glb's hand-painted look shows). Otherwise apply
  //    the generic pale-metal tint used for the legacy untextured tray model.
  const applyAssetMaterial = (root, kind = 'bobbin') => {
    root.traverse(c => {
      if (c.isMesh) {
        if (kind === 'tray' && c.material && c.material.map) {
          // Preserve textured material as-is.
        } else {
          c.material = makeMaterial(kind);
        }
        // Bobbins cast a real shadow onto the ground plane added below;
        // trays don't need to (they already have a ground-shadow plane of
        // their own in the carrier scene).
        c.castShadow = (kind === 'bobbin');
        c.receiveShadow = false;
      }
    });
  };

  const loader = new THREE.GLTFLoader();
  // Wire DRACO decoder (CDN, matches three@0.137.5). Required for the
  // user-supplied Draco-compressed tray model.
  if (typeof THREE.DRACOLoader !== 'undefined') {
    const dracoLoader = new THREE.DRACOLoader();
    dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.137.5/examples/js/libs/draco/');
    loader.setDRACOLoader(dracoLoader);
  }
  const [bobbinGLB, trayGLB] = await Promise.all([
    loader.loadAsync('3D_asset/bobin.glb'),
    loader.loadAsync('3D_asset/model_optimized.glb'),
  ]);

  const captureToPixiTex = async (camera) => {
    renderer.render(scene, camera);
    const bitmap = await createImageBitmap(renderer.domElement);
    return PIXI.Texture.from(bitmap);
  };

  const clearAddedMeshes = () => {
    for (let i = scene.children.length - 1; i >= 0; i--) {
      const c = scene.children[i];
      if (!c.isLight) scene.remove(c);
    }
  };

  // Three brightness tiers so Pixi tinting (multiply) yields three distinct
  // shades of the same color: shell (darker), wool (brightest), stripes (dark).
  const bobbinShellMat = new THREE.MeshStandardMaterial({
    color: 0xb0b0b0,    // shell flanges/barrel → mid-dark after tint
    roughness: 0.42,
    metalness: 0.02,
  });
  const bobbinWoolMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,    // wool wrap → brightest after tint (clearly visible)
    roughness: 0.52,
    metalness: 0.00,
  });
  const bobbinLineMat = new THREE.MeshStandardMaterial({
    color: 0x4a4a4a,    // winding stripes → dark bands on the wool surface
    roughness: 0.70,
    metalness: 0.01,
  });

  const addReferenceBobbinShell = (group, rings, orientation /* 'upright' | 'lying' */) => {
    // `rings` is the pre-render stage index (0..10). In _updateStage:
    //   full bobbin  (count = initialCount, ratio=0) → idx=1 → rings=1
    //   empty bobbin (count = 0,            ratio=1) → idx=10 → rings=10
    // GAME VISUAL: wool wraps ACCUMULATE on the bobbin as it gets used.
    //   consumed ≈ 0 (fresh bobbin) → bare spool, no visible wool
    //   consumed = 1 (fully used)   → thick wool wrap with many stripes
    const consumed = clamp(rings / 10, 0, 1);

    // Reference bobbin: longer central barrel + slightly thinner flanges.
    // EditorTune multipliers (default 1.0) let the user tune each piece
    // independently without touching the source geometry.
    const FLANGE_R_TOP = 0.88;
    const FLANGE_R_BOTTOM = 0.92;
    // Pick the orientation-specific tune set so rail and idle bobbins can
    // be shaped differently without re-rendering both.
    const isRail = orientation === 'lying';
    const topMul   = (isRail ? EditorTune.bobbinRailFlangeTopH    : EditorTune.bobbinFlangeTopH)    ?? 1.0;
    const botMul   = (isRail ? EditorTune.bobbinRailFlangeBottomH : EditorTune.bobbinFlangeBottomH) ?? 1.0;
    const barrelMul = (isRail ? EditorTune.bobbinRailBarrelR      : EditorTune.bobbinBarrelR)       ?? 1.0;
    const TOP_H = 0.15 * topMul;
    const BOT_H = 0.15 * botMul;
    const BARREL_H = 1.18;           // was 0.84 — extended per reference
    const BARREL_R = 0.34 * barrelMul;

    const topFlangeGeo = new THREE.CylinderGeometry(FLANGE_R_TOP, FLANGE_R_BOTTOM, TOP_H, 72);
    const botFlangeGeo = new THREE.CylinderGeometry(FLANGE_R_TOP, FLANGE_R_BOTTOM, BOT_H, 72);
    const barrelGeo = new THREE.CylinderGeometry(BARREL_R, BARREL_R * 1.04, BARREL_H, 64);

    // Wool grows out from the barrel surface as the bobbin is used.
    const WOOL_MAX_R = 0.80;
    const WOOL_MIN_R = BARREL_R;     // starts flush with the barrel → invisible
    const woolR = lerp(WOOL_MIN_R, WOOL_MAX_R, consumed);
    const woolH = BARREL_H * 0.92;
    const woolGeo = new THREE.CylinderGeometry(woolR, woolR * 0.98, woolH, 72);

    const bottom = new THREE.Mesh(botFlangeGeo, bobbinShellMat);
    bottom.position.y = -(BARREL_H / 2 + BOT_H / 2);
    group.add(bottom);

    const barrel = new THREE.Mesh(barrelGeo, bobbinShellMat);
    barrel.position.y = 0;
    group.add(barrel);

    // Render wool + stripes only after a meaningful amount has accumulated,
    // so the DEFAULT state reads as a bare spool (per game design).
    if (woolR > BARREL_R * 1.15) {
      const wool = new THREE.Mesh(woolGeo, bobbinWoolMat);
      wool.position.y = 0;
      group.add(wool);

      // Stripe count scales with how much has accumulated: more used → more wraps.
      const grooveCount = 3 + Math.round(consumed * 7);   // 3..10 stripes
      const stripeR = woolR * 1.01;
      for (let i = 0; i < grooveCount; i++) {
        const tor = new THREE.Mesh(
          new THREE.TorusGeometry(stripeR, 0.024, 8, 72),
          bobbinLineMat
        );
        tor.rotation.x = Math.PI / 2;
        tor.position.y = lerp(
          -woolH * 0.42, woolH * 0.42,
          grooveCount === 1 ? 0.5 : i / (grooveCount - 1)
        );
        tor.rotation.z = i * 0.52;
        group.add(tor);
      }
    }

    const top = new THREE.Mesh(topFlangeGeo, bobbinShellMat);
    top.position.y = BARREL_H / 2 + TOP_H / 2;
    group.add(top);
  };

  // Helper to build a bobbin plus procedural wound-thread volume.
  // External wool-ring GLB files are intentionally not used.
  const buildBobbinGroup = (rings, orientation) => {
    const group = new THREE.Group();
    const bobbin = bobbinGLB.scene.clone();
    applyAssetMaterial(bobbin, 'bobbin');
    bobbin.scale.set(0.34, 0.34, 0.34);
    group.add(bobbin);
    addReferenceBobbinShell(group, rings, orientation);
    // Procedural shell meshes were just added; flag them as shadow casters.
    group.traverse(c => { if (c.isMesh) c.castShadow = true; });
    return group;
  };

  // Build a ShadowMaterial ground plane in WORLD space (NOT parented to
  // the bobbin group — otherwise the lying outer rotation flips the plane
  // upside-down and the shadow falls on the unseen back face). Opacity
  // tuned to read as a gentle drop shadow, not a hard-edged silhouette.
  const makeShadowGround = () => {
    const geo = new THREE.PlaneGeometry(4.5, 4.5);
    const mat = new THREE.ShadowMaterial({ opacity: 0.38 });
    const m = new THREE.Mesh(geo, mat);
    m.rotation.x = -Math.PI / 2;   // lying flat on XZ
    m.position.y = -0.78;          // just below the bobbin's bottom flange
    m.receiveShadow = true;
    return m;
  };

  // Re-render bobbin stages with Y-axis rotation applied.
  // Upright and lying stages are intentionally separate so waiting bobbins can
  // be tuned independently from rail bobbins.
  const renderBobbinStagesAt = async (yDeg, orientation /* 'upright' | 'lying' */) => {
    const newStages = [];
    const xDeg = orientation === 'lying'
      ? (EditorTune.bobbinXRotationDeg ?? -6)
      : (EditorTune.bobbinIdleXRotationDeg ?? 0);
    // Configure the shadow light + ground for this orientation once per
    // stage batch (ortho/angle/size only depends on orientation, not on
    // the ring count).
    configureShadow(orientation);
    for (let rings = 0; rings <= 10; rings++) {
      clearAddedMeshes();
      // Ground plane lives in world space (separate from the rotated outer)
      // so the cast shadow always lands on its UP-facing side regardless of
      // upright vs lying bobbin orientation.
      const ground = makeShadowGround();
      configureShadowGround(ground, orientation);
      scene.add(ground);
      const outer = new THREE.Group();
      if (orientation === 'lying') {
        outer.rotation.z = Math.PI / 2;
      }
      outer.rotation.x = deg2rad(orientation === 'lying' ? -xDeg : xDeg);
      outer.rotation.y = deg2rad(yDeg);
      scene.add(outer);
      outer.add(buildBobbinGroup(rings, orientation));
      newStages.push(await captureToPixiTex(orientation === 'lying' ? camLying : camUpright));
    }
    return newStages;
  };

  const bobbinStages = await renderBobbinStagesAt(EditorTune.bobbinYRotationDeg || 0, 'lying');
  const bobbinStagesUpright = await renderBobbinStagesAt(
    EditorTune.bobbinIdleYRotationDeg ?? EditorTune.bobbinYRotationDeg ?? 0,
    'upright'
  );

  // Render the tray in one of two orientations.
  //   "lying"   → flat plate seen top-down (wide silhouette, used on rail)
  //   "upright" → plate stood on its edge (tall silhouette, used in dump stack)
  // tiltDeg only applies to the lying case so the editor can tweak the lie-down angle.
  const renderTrayAt = async (yDeg, tiltDeg, orientation = 'lying') => {
    clearAddedMeshes();
    const trayGroup = new THREE.Group();
    if (orientation === 'upright') {
      // model_optimized.glb is already authored as a tall, vertical tray
      // (white grip pad on top, blue body below). Use yDeg as-is so the
      // editor controls direct Y rotation without an implicit +90° offset.
      trayGroup.rotation.y = deg2rad(yDeg || 0);
      trayGroup.rotation.x = deg2rad(EditorTune.trayIdleXRotationDeg || 0);
      trayGroup.rotation.z = deg2rad(EditorTune.trayIdleZRotationDeg3D || 0);
    } else {
      // Force fully-flat (90° X) tilt when trayRailFlat is on — keeps the
      // rail tray horizontal from the first frame of the launch slide.
      const flatOverride = (EditorTune.trayRailFlat ?? 1) >= 0.5;
      const tilt = flatOverride
        ? 90
        : (tiltDeg !== undefined ? tiltDeg : EditorTune.trayTiltDeg);
      trayGroup.rotation.x = -deg2rad(tilt);
      trayGroup.rotation.y = deg2rad(yDeg);
      // Rail-state tray shares the idle tray's 3D-Z rotation key.
      trayGroup.rotation.z = deg2rad(EditorTune.trayIdleZRotationDeg3D || 0);
    }
    // Tray thickness: scale the model's Z axis (the shortest dimension) so
    // the tray reads as thicker or thinner without affecting width/height.
    const tk = (typeof EditorTune.trayThickness === 'number') ? EditorTune.trayThickness : 1.0;
    trayGroup.scale.set(1, 1, Math.max(0.05, tk));
    scene.add(trayGroup);
    const tray = trayGLB.scene.clone();
    applyAssetMaterial(tray, 'tray');
    trayGroup.add(tray);
    // Tray gets its own tighter cameras for BOTH upright (dump) and lying
    // (rail) so the rendered sprite has minimal transparent padding in
    // either state — keeps trayIdleScale honest AND keeps the visible
    // tray size consistent between dump and rail.
    const cam = (orientation === 'upright') ? camTrayUpright : camTrayLying;
    return await captureToPixiTex(cam);
  };
  const trayLying   = await renderTrayAt(EditorTune.trayYRotationDeg || 0, EditorTune.trayTiltDeg, 'lying');
  const trayUpright = await renderTrayAt(EditorTune.trayIdleYRotationDeg || 0, 0, 'upright');
  const trayTex = trayLying;

  // Keep the Three.js renderer/scene alive globally so we can re-render
  // tray (and bobbin) at different Y rotations when the editor changes them.
  window.Three3D = {
    renderer, scene, camLying, camTrayLying, camUpright, camTrayUpright,
    trayGLB, bobbinGLB,
    buildBobbinGroup, applyAssetMaterial, captureToPixiTex,
    clearAddedMeshes,
    renderTrayAt,
    renderBobbinStagesAt,
  };

  return { bobbinStages, bobbinStagesUpright, tray: trayTex, trayUpright, trayLying };
}

/* =========================================================================
 *  Boot
 * ========================================================================= */
async function boot() {
  GameBridge.init();
  // Pull committed editor values from the repo BEFORE building the layout so
  // the first frame already uses them. Falls through silently if the file
  // isn't there.
  await loadEditorTuneFromFile();

  // Wait for the Luckiest Guy webfont so the very first PIXI.Text glyph
  // caches use it (PIXI snapshots glyph metrics at construction time).
  // 1.2s cap so a slow CDN can never block the whole boot.
  if (document.fonts?.load) {
    try {
      await Promise.race([
        document.fonts.load('900 32px "Luckiest Guy"'),
        new Promise(r => setTimeout(r, 1200)),
      ]);
    } catch (_) { /* fall through to fallback fonts */ }
  }

  const app = new PIXI.Application({
    resizeTo: window,
    backgroundAlpha: 0,
    antialias: true,
    resolution: Math.min(window.devicePixelRatio, 2),
    autoDensity: true,
  });
  document.body.appendChild(app.view);
  Game.app = app;

  // Load 2D + 3D assets
  Game.tex = await loadAll2DAssets();
  try {
    const tex3D = await preRender3DAssets();
    Game.tex.bobbinStages = tex3D.bobbinStages;
    Game.tex.bobbinStagesUpright = tex3D.bobbinStagesUpright;
    Game.tex.tray = tex3D.tray;
    Game.tex.trayUpright = tex3D.trayUpright;
    Game.tex.trayLying = tex3D.trayLying;
  } catch (e) {
    console.warn('3D pre-render failed, falling back to procedural', e);
    Game.tex.bobbinStages = null;
    Game.tex.tray = null;
    Game.tex.trayUpright = null;
    Game.tex.trayLying = null;
  }

  Layout.compute(window.innerWidth, window.innerHeight);
  RailPath.init(Layout.hoop.cx, Layout.hoop.cy, Layout.ringHalfX, Layout.ringHalfY, Layout.hoop.cornerRadius);

  // Layer setup
  Game.layers.bg      = new PIXI.Container();
  Game.layers.hoop    = new PIXI.Container();
  Game.layers.wool    = new PIXI.Container();
  Game.layers.thread  = new PIXI.Container();
  Game.layers.carrier = new PIXI.Container();  // carriers below bobbins
  Game.layers.slotBg  = new PIXI.Container();  // slot squares — under bobbins so a slot bobbin sits on top
  Game.layers.bobbin  = new PIXI.Container();
  Game.layers.ui      = new PIXI.Container();
  Game.layers.fx      = new PIXI.Container();
  app.stage.addChild(Game.layers.bg);
  app.stage.addChild(Game.layers.hoop);
  app.stage.addChild(Game.layers.wool);
  app.stage.addChild(Game.layers.thread);
  app.stage.addChild(Game.layers.carrier);
  app.stage.addChild(Game.layers.slotBg);
  app.stage.addChild(Game.layers.bobbin);
  app.stage.addChild(Game.layers.fx);
  app.stage.addChild(Game.layers.ui);

  // Apply any user-saved layer ordering (from EditorTune.layerOrder).
  applyLayerOrder();

  drawBackground();
  drawHoop();
  drawDump();
  drawSlots();
  drawGridBg();
  Game.woolGrid = new WoolGrid(Game.layers.wool);

  // Queue (initial bobbins)
  buildQueue();

  // Counter
  buildCounter();

  // Main loop
  app.ticker.add(tick);

  // Expose for debugging
  window.Game = Game;
  window.GameTune = GameTune;
  window.EditorTune = EditorTune;
  window.Layout = Layout;
  window.RailPath = RailPath;
  window.render_game_to_text = renderGameToText;
  window.advanceTime = advanceTime;
  window.addEventListener('keydown', onKeyDown);

  // Initialize editor panel
  initEditor();

  // Pause/Resume support: per CLAUDE.md, do NOT wait — call Game.start() then notifyReady
  startGame();
  GameBridge.notifyReady();
  Game.ready = true;

  // dev: auto-resume if no native bridge
  if (!window.FlutterChannel && !window.webkit?.messageHandlers && !window.AndroidBridge && !window.flutter_inappwebview) {
    Game.paused = false;
  }

  window.addEventListener('resize', onResize);
}

function startGame() {
  Game.started = true;
  // Game.paused stays true per CLAUDE.md invariant
}

function onResize() {
  // For prototype simplicity, just clear & rebuild on resize
  // (production would reflow without recreating sprites)
  Layout.compute(window.innerWidth, window.innerHeight);
  RailPath.init(Layout.hoop.cx, Layout.hoop.cy, Layout.ringHalfX, Layout.ringHalfY, Layout.hoop.cornerRadius);
  redrawAll();
}

/* Full rebuild of all visuals that depend on Layout, called after a window
 * resize (or any structural change). Ensures rail.png, arrows, wool grid,
 * slots and every sprite resize together so nothing falls out of alignment
 * at different screen sizes. */
function redrawAll() {
  // 0. Background (sized off Layout.W/H).
  if (Game.layers?.bg) {
    Game.layers.bg.removeChildren();
    drawBackground();
  }

  // 1. Rail.png hoop sprite + arrows (setupRailArrows runs inside drawHoop).
  if (Game.hoopGfx) {
    if (Game.hoopGfx.parent) Game.hoopGfx.parent.removeChild(Game.hoopGfx);
    if (!Game.hoopGfx.destroyed) Game.hoopGfx.destroy({ children: true });
    Game.hoopGfx = null;
  }
  drawHoop();

  // 2. Wool grid — cellSize / gridOffset depend on the new innerSize.
  if (Game.woolGrid) {
    Game.layers.wool.removeChildren();
    Game.gridBgGfx = null;  // dropped along with the layer children above
    drawGridBg();
    Game.woolGrid = new WoolGrid(Game.layers.wool);
  }

  // 3. Slot graphics — drawSlots rebuilds; clear existing first.
  for (const g of Game.slotGfxs) {
    if (g.parent) g.parent.removeChild(g);
    if (!g.destroyed) g.destroy();
  }
  Game.slotGfxs = [];
  drawSlots();

  // 4. Dump container — just reposition (children get rebuilt via redrawDump).
  if (Game.dumpGfx) {
    Game.dumpGfx.x = Layout.dump.x;
    Game.dumpGfx.y = Layout.dump.y;
    redrawDump();
  }

  // 5. Counter text. Reposition the CONTAINER; the text sits at (0,0) inside.
  if (Game.counterContainer) {
    Game.counterContainer.x = Layout.counter.x;
    Game.counterContainer.y = Layout.counter.y;
  }
  if (Game.counterText) {
    Game.counterText.x = 0;
    Game.counterText.y = 0;
    Game.counterText.style.fontSize = EditorTune.counterFontSize;
  }

  // 6. Every bobbin: resize sprite + redraw label (label scales with bobbinSize).
  const allBobbins = [];
  for (const e of Game.queue) allBobbins.push(e.bobbin);
  for (const s of Game.slots) if (s) allBobbins.push(s.bobbin);
  for (const e of Game.rail) allBobbins.push(e.bobbin);
  for (const f of Game.inFlightCarriers) if (f.bobbin) allBobbins.push(f.bobbin);
  for (const b of allBobbins) {
    if (b.updateVisualStyle) b.updateVisualStyle();
  }

  // 7. Carriers (rail trays).
  for (const e of Game.rail) e.carrier?.updateVisualStyle?.();
  for (const f of Game.inFlightCarriers) f.carrier?.updateVisualStyle?.();

  // 8. Reposition queue + slot bobbins (rail bobbins move via tickRail).
  if (Game.queue) refreshQueueLayout(0);
  for (let i = 0; i < Game.slots.length; i++) {
    const s = Game.slots[i];
    if (s && s.bobbin?.gfx) {
      const p = Layout.slotBobbinPos(i);
      s.bobbin.gfx.x = p.x;
      s.bobbin.gfx.y = p.y;
    }
  }
}

/* =========================================================================
 *  Drawing helpers
 * ========================================================================= */

/* Re-order Game.layers on the stage to match EditorTune.layerOrder.
 * The order array lists layer keys from bottom → top. Layers not listed
 * (e.g. after a default reset) are appended at the end so they stay visible. */
function applyLayerOrder() {
  if (!Game.app?.stage || !Game.layers) return;
  const order = (Array.isArray(EditorTune.layerOrder) && EditorTune.layerOrder.length)
    ? EditorTune.layerOrder
    : DEFAULT_LAYER_ORDER;
  const seen = new Set();
  for (const key of order) {
    const layer = Game.layers[key];
    if (layer && layer.parent === Game.app.stage) {
      Game.app.stage.addChild(layer);  // re-adding promotes to top.
      seen.add(key);
    }
  }
  // Catch any default layers missing from the saved order so they don't vanish.
  for (const key of DEFAULT_LAYER_ORDER) {
    if (seen.has(key)) continue;
    const layer = Game.layers[key];
    if (layer && layer.parent === Game.app.stage) Game.app.stage.addChild(layer);
  }
}

/* Inset background behind the pixel art. Two layers:
 *   1) Solid rounded rect (gridBg) — fills the entire inner area.
 *   2) Optional fabric grid — wool-knot sprites tiled across the entire
 *      inner area, aligned with the pattern grid so pattern knots and
 *      fabric knots share a single grid (no seam where they meet).
 * Sits at index 0 of Game.layers.wool so WoolGrid's pattern knots draw
 * on top. Use a rounded-rect mask so fabric knots don't bleed past the
 * inner-area border into the hoop frame. */
function drawGridBg() {
  if (!Game.layers?.wool) return;
  if (Game.gridBgGfx) {
    if (Game.gridBgGfx.parent) Game.gridBgGfx.parent.removeChild(Game.gridBgGfx);
    if (!Game.gridBgGfx.destroyed) Game.gridBgGfx.destroy({ children: true });
    Game.gridBgGfx = null;
  }

  const bgAlpha     = (typeof EditorTune.gridBgAlpha     === 'number') ? EditorTune.gridBgAlpha     : 1;
  const fabricAlpha = (typeof EditorTune.gridFabricAlpha === 'number') ? EditorTune.gridFabricAlpha : 0;
  if (bgAlpha <= 0 && fabricAlpha <= 0) return;

  const L = Layout.hoop;
  // Expand the bg/fabric rect outward by pad × rim on each axis. Per-axis
  // pads let the inset stretch independently horizontally vs vertically;
  // fall back to the unified gridBgPad for older saved tunes.
  const padFallback = EditorTune.gridBgPad ?? 0;
  const padX = (EditorTune.gridBgPadX ?? padFallback) * (L.rim || 0);
  const padY = (EditorTune.gridBgPadY ?? padFallback) * (L.rim || 0);
  const bgHalfX = L.innerHalf + padX;
  const bgHalfY = L.innerHalf + padY;
  // Corner radius as a fraction of the smaller half so a circle is still
  // achievable when the rect is non-square. Clamped to [0, 0.5].
  const cornerFrac = Math.max(0, Math.min(0.5, EditorTune.gridBgCornerRadius ?? 0.06));
  const corner = cornerFrac * Math.min(bgHalfX, bgHalfY);
  const innerLeft   = L.cx - bgHalfX;
  const innerTop    = L.cy - bgHalfY;
  const innerRight  = L.cx + bgHalfX;
  const innerBottom = L.cy + bgHalfY;

  const container = new PIXI.Container();

  // 1) Solid color underneath (shows through when fabric alpha < 1, or
  //    in the corners if the fabric mask trims something).
  if (bgAlpha > 0) {
    const g = new PIXI.Graphics();
    g.beginFill(EditorTune.gridBgColor ?? 0x1e2f5c, bgAlpha);
    g.drawRoundedRect(innerLeft, innerTop, bgHalfX * 2, bgHalfY * 2, corner);
    g.endFill();
    container.addChild(g);
  }

  // 2) Fabric knots tiled across the entire inner area (matches reference).
  if (fabricAlpha > 0 && Game.tex?.woolKnot && Layout.cellSize > 0) {
    const cellSize = Layout.cellSize;
    // Anchor the fabric grid on the same lattice as the pattern grid so
    // pattern cells and fabric cells line up perfectly. The first pattern
    // cell's center is at innerLeft + gridOffsetX + 0.5*cellSize.
    const baseX = innerLeft + Layout.gridOffsetX + 0.5 * cellSize;
    const baseY = innerTop  + Layout.gridOffsetY + 0.5 * cellSize;
    // Range of integer steps that covers the inner area (plus a 1-cell
    // pad so the knots' rendered footprint extends fully to the border).
    const minNX = Math.floor((innerLeft   - baseX) / cellSize) - 1;
    const maxNX = Math.ceil ((innerRight  - baseX) / cellSize) + 1;
    const minNY = Math.floor((innerTop    - baseY) / cellSize) - 1;
    const maxNY = Math.ceil ((innerBottom - baseY) / cellSize) + 1;

    const tint  = EditorTune.gridFabricColor ?? 0x1f70e6;
    const tiles = new PIXI.Container();
    for (let ny = minNY; ny <= maxNY; ny++) {
      for (let nx = minNX; nx <= maxNX; nx++) {
        const sp = new PIXI.Sprite(Game.tex.woolKnot);
        sp.anchor.set(0.5);
        sp.width = sp.height = cellSize * GRID_WOOL_SPRITE_MULT;
        sp.x = baseX + nx * cellSize;
        sp.y = baseY + ny * cellSize;
        sp.tint = tint;
        sp.alpha = fabricAlpha;
        tiles.addChild(sp);
      }
    }
    // Clip the tiled fabric to the rounded inner-area shape so the rect
    // edges don't poke past the hoop frame's rounded corners.
    const mask = new PIXI.Graphics();
    mask.beginFill(0xffffff);
    mask.drawRoundedRect(innerLeft, innerTop, bgHalfX * 2, bgHalfY * 2, corner);
    mask.endFill();
    container.addChild(mask);
    tiles.mask = mask;
    container.addChild(tiles);
  }

  Game.layers.wool.addChildAt(container, 0);
  Game.gridBgGfx = container;
}

function drawBackground() {
  const g = new PIXI.Graphics();
  g.beginFill(COLOR.bg);
  g.drawRect(0, 0, Layout.W, Layout.H);
  g.endFill();
  // Soft woven-paper texture: deterministic flecks and faint diamonds.
  g.beginFill(0xffffff, 0.06);
  for (let y = 28; y < Layout.H; y += 72) {
    for (let x = 24; x < Layout.W; x += 76) {
      const wobble = Math.sin(x * 0.037 + y * 0.021) * 7;
      g.drawCircle(x + wobble, y, 1.3);
    }
  }
  g.endFill();
  g.lineStyle(1.2, 0xffffff, 0.045);
  for (let i = 0; i < 42; i++) {
    const x = (i * 73) % Math.max(1, Layout.W);
    const y = 80 + ((i * 131) % Math.max(1, Layout.H - 120));
    const s = 7 + (i % 3) * 2;
    g.moveTo(x, y - s);
    g.lineTo(x + s, y);
    g.lineTo(x, y + s);
    g.lineTo(x - s, y);
    g.lineTo(x, y - s);
  }
  g.lineStyle(0);
  g.beginFill(COLOR.bgDeep, 0.16);
  g.drawRect(0, Layout.H * 0.58, Layout.W, Layout.H * 0.42);
  g.endFill();
  Game.layers.bg.addChild(g);
}

function drawHoop() {
  const L = Layout.hoop;

  // Container groups the hoop frame + brush so they can be destroyed as one.
  const container = new PIXI.Container();

  if (Game.tex?.railHoop && Game.tex?.railBrush) {
    // SPLIT version: separate hoop-frame and brush sprites, each tunable.
    const scale = (L.outerHalf * 2) / Game.tex.railHoop.width;

    const hoopSprite = new PIXI.Sprite(Game.tex.railHoop);
    hoopSprite.anchor.set(0.5);
    hoopSprite.scale.set(scale);
    hoopSprite.x = L.cx;
    hoopSprite.y = L.cy;
    container.addChild(hoopSprite);

    // Brush: re-creates the bottom-left protrusion of the original rail.png.
    // Offsets are in fractions of L.outerHalf so they scale with the hoop;
    // exposed via EditorTune for visual tuning.
    const brushSprite = new PIXI.Sprite(Game.tex.railBrush);
    brushSprite.anchor.set(0.5);
    brushSprite.scale.set(scale * (EditorTune.brushScale ?? 1.0));
    brushSprite.x = L.cx + L.outerHalf * (EditorTune.brushOffsetX ?? -0.78);
    brushSprite.y = L.cy + L.outerHalf * (EditorTune.brushOffsetY ?? 0.75);
    container.addChild(brushSprite);
    Game.brushGfx = brushSprite;

    Game.layers.hoop.addChild(container);
    Game.hoopGfx = container;
  } else if (Game.tex?.rail) {
    // Legacy single-image fallback (rail.png with brush baked in).
    const sprite = new PIXI.Sprite(Game.tex.rail);
    sprite.anchor.set(0.5);
    const RAIL_HOOP_WIDTH_FRACTION = 0.85;
    const scale = (L.outerHalf * 2) / (Game.tex.rail.width * RAIL_HOOP_WIDTH_FRACTION);
    sprite.scale.set(scale);
    const HOOP_BODY_OFFSET_X = 0.03;
    const HOOP_BODY_OFFSET_Y = -0.05;
    sprite.x = L.cx - HOOP_BODY_OFFSET_X * Game.tex.rail.width * scale;
    sprite.y = L.cy - HOOP_BODY_OFFSET_Y * Game.tex.rail.height * scale;
    container.addChild(sprite);

    Game.layers.hoop.addChild(container);
    Game.hoopGfx = container;
  } else {
    // Procedural fallback when no asset is available.
    const g = new PIXI.Graphics();
    g.beginFill(COLOR.hoopRim);
    g.drawRoundedRect(L.cx - L.outerHalf, L.cy - L.outerHalf, L.outerHalf * 2, L.outerHalf * 2, L.cornerRadius);
    g.endFill();
    g.beginFill(COLOR.hoopInnerBg);
    g.drawRoundedRect(L.cx - L.innerHalf, L.cy - L.innerHalf, L.innerHalf * 2, L.innerHalf * 2, L.cornerRadius * 0.4);
    g.endFill();
    Game.layers.hoop.addChild(g);
    Game.hoopGfx = g;
  }

  // Animated rail arrows moving CCW around the rail
  setupRailArrows();
}

function drawChevrons(g) {
  // (legacy procedural chevron drawing; kept for fallback, not used when rail.png is loaded)
  const N = 44;
  for (let i = 0; i < N; i++) {
    const t = i / N + 0.5 / N;
    const p = RailPath.position(t);
    const s = Layout.hoop.rim * 0.23;
    const a = p.angle;
    const px = Math.cos(a), py = Math.sin(a);
    const nx = -py, ny = px;
    g.lineStyle(Math.max(2, Layout.hoop.rim * 0.035), 0xcce1e6, 0.28);
    g.moveTo(p.x - px * s - nx * s, p.y - py * s - ny * s);
    g.lineTo(p.x + px * s, p.y + py * s);
    g.lineTo(p.x - px * s + nx * s, p.y - py * s + ny * s);
  }
}

/* Animated rail arrows flowing CCW around the rail */
function setupRailArrows() {
  if (!Game.tex?.railArrow) return;
  if (Game.railArrows) {
    for (const a of Game.railArrows) { if (a.parent) a.parent.removeChild(a); }
  }
  const N_ARROWS = Math.round(EditorTune.arrowCount);
  const size = Layout.hoop.rim * EditorTune.arrowSize;
  Game.railArrows = [];
  for (let i = 0; i < N_ARROWS; i++) {
    const sp = new PIXI.Sprite(Game.tex.railArrow);
    sp.anchor.set(0.5);
    sp.width = size;
    sp.height = size;
    sp.alpha = 0.45;
    sp.tOffset = i / N_ARROWS;
    Game.layers.hoop.addChild(sp);
    Game.railArrows.push(sp);
  }
}

// Compute a position on a rounded-rectangle path with INDEPENDENT X/Y half-extents.
// (Used for chevron arrows — allows tuning width and height separately.)
function arrowPathPosition(t) {
  const offsetX = Layout.hoop.outerHalf * EditorTune.arrowOffsetX;
  const offsetY = Layout.hoop.outerHalf * EditorTune.arrowOffsetY;
  const cx = Layout.hoop.cx + offsetX, cy = Layout.hoop.cy + offsetY;
  const halfX = Layout.hoop.innerHalf + Layout.hoop.rim * EditorTune.arrowRadiusX;
  const halfY = Layout.hoop.innerHalf + Layout.hoop.rim * EditorTune.arrowRadiusY;
  // Corner radius capped so it never exceeds half of the shorter side
  const cr = Math.min(Layout.hoop.cornerRadius, Math.min(halfX, halfY) * 0.5);
  const segH = 2 * halfX - 2 * cr;  // horizontal (top/bottom) segment length
  const segV = 2 * halfY - 2 * cr;  // vertical (left/right) segment length
  const arcL = Math.PI * cr / 2;
  const totalLength = 2 * segH + 2 * segV + 4 * arcL;
  let d = ((t % 1) + 1) % 1 * totalLength;
  // CCW from 7 o'clock: bottom → BR corner → right → TR → top → TL → left → BL
  const segments = [
    {kind:'s', length: segH, x0: cx - halfX + cr, y0: cy + halfY, x1: cx + halfX - cr, y1: cy + halfY, dir: 0},
    {kind:'a', length: arcL, ccx: cx + halfX - cr, ccy: cy + halfY - cr, r: cr, a0: Math.PI/2, a1: 0},
    {kind:'s', length: segV, x0: cx + halfX, y0: cy + halfY - cr, x1: cx + halfX, y1: cy - halfY + cr, dir: -Math.PI/2},
    {kind:'a', length: arcL, ccx: cx + halfX - cr, ccy: cy - halfY + cr, r: cr, a0: 0, a1: -Math.PI/2},
    {kind:'s', length: segH, x0: cx + halfX - cr, y0: cy - halfY, x1: cx - halfX + cr, y1: cy - halfY, dir: Math.PI},
    {kind:'a', length: arcL, ccx: cx - halfX + cr, ccy: cy - halfY + cr, r: cr, a0: -Math.PI/2, a1: -Math.PI},
    {kind:'s', length: segV, x0: cx - halfX, y0: cy - halfY + cr, x1: cx - halfX, y1: cy + halfY - cr, dir: Math.PI/2},
    {kind:'a', length: arcL, ccx: cx - halfX + cr, ccy: cy + halfY - cr, r: cr, a0: Math.PI, a1: Math.PI/2},
  ];
  for (const seg of segments) {
    if (d < seg.length) {
      const u = d / seg.length;
      if (seg.kind === 's') {
        return { x: seg.x0 + u*(seg.x1-seg.x0), y: seg.y0 + u*(seg.y1-seg.y0), angle: seg.dir };
      } else {
        const theta = seg.a0 + u*(seg.a1-seg.a0);
        return {
          x: seg.ccx + seg.r * Math.cos(theta),
          y: seg.ccy + seg.r * Math.sin(theta),
          angle: theta - Math.PI/2,
        };
      }
    }
    d -= seg.length;
  }
  return { x: cx, y: cy, angle: 0 };
}

function tickRailArrows(dt) {
  if (!Game.railArrows) return;
  const ARROW_FLOW_SPEED = 1 / EditorTune.arrowSecPerLap;
  Game.arrowGlobalT = (Game.arrowGlobalT || 0) + dt * ARROW_FLOW_SPEED;
  const hideStart = norm(EditorTune.arrowHideStart || 0);
  const hideEnd   = norm(EditorTune.arrowHideEnd   || 0);
  const hideActive = hideEnd !== hideStart;
  for (const sp of Game.railArrows) {
    const t = norm(sp.tOffset + Game.arrowGlobalT);
    const p = arrowPathPosition(t);
    sp.x = p.x;
    sp.y = p.y;
    sp.rotation = p.angle;
    if (hideActive) {
      // Hide arrows whose t falls inside [start, end), wrapping around 1.
      const inRange = (hideStart < hideEnd)
        ? (t >= hideStart && t < hideEnd)
        : (t >= hideStart || t < hideEnd);  // wraps past 1
      sp.visible = !inRange;
    } else {
      sp.visible = true;
    }
  }
}

function drawDump() {

function buildCounter() {

function drawSlots() {

function buildQueue() {
  Game.deck = INITIAL_BOBBINS.map(spec => ({ ...spec }));
  refillQueue(true);
}

/* Pick the column with the fewest current entries (ties → smallest col index). */
function pickQueueColumnForNewEntry() {
  const cols = Layout.queue.cols;
  const counts = new Array(cols).fill(0);
  for (const e of Game.queue) counts[e.col]++;
  let chosen = 0, min = Infinity;
  for (let c = 0; c < cols; c++) {
    if (counts[c] < min) { min = counts[c]; chosen = c; }
  }
  return chosen;
}

/* Pick the next deck index to dispense, weighted toward colors currently pullable.
 * Selection only considers the FRONT WINDOW of the deck so we don't reorder the
 * whole sequence — just gently prefer useful colors over the next few entries.
 * Weight: pullable=PULLABLE_WEIGHT, others=1. */
const QUEUE_WEIGHT_PULLABLE = 2.5;   // mild bias, not overwhelming
const QUEUE_WEIGHT_WINDOW   = 4;     // look at next 4 entries when refilling
function pickWeightedDeckIndex() {
  if (Game.deck.length === 0) return -1;
  if (Game.deck.length === 1) return 0;
  const pullable = Game.woolGrid?.pullableColors?.() || new Set();
  const N = Math.min(QUEUE_WEIGHT_WINDOW, Game.deck.length);
  const weights = [];
  let total = 0;
  for (let i = 0; i < N; i++) {
    const w = pullable.has(Game.deck[i].color) ? QUEUE_WEIGHT_PULLABLE : 1;
    weights.push(w);
    total += w;
  }
  let pick = Math.random() * total;
  for (let i = 0; i < N; i++) {
    pick -= weights[i];
    if (pick <= 0) return i;
  }
  return 0;
}

function refillQueue(skipAnim = false) {
  while (Game.queue.length < QUEUE_VISIBLE_MAX && Game.deck.length > 0) {
    const idx = pickWeightedDeckIndex();
    const [spec] = Game.deck.splice(idx, 1);
    const b = new Bobbin(spec.color, spec.count);
    const col = pickQueueColumnForNewEntry();
    const entry = { bobbin: b, col };
    Game.queue.push(entry);
    Game.layers.bobbin.addChild(b.gfx);
    if (!skipAnim) {
      // Will be positioned by refreshQueueLayout; start off-screen for entry anim
      b.gfx.x = Layout.queuePos(col, 99).x;
      b.gfx.y = Layout.H + Layout.queue.size;
      b.gfx._queueEntering = true;
      b.gfx.alpha = 0;
      // Final position depends on its row, computed in refreshQueueLayout. We snapshot here.
      const finalPos = Layout.queuePos(col, currentRowInCol(col, entry));
      addAnim(0.24, (eu) => {
        b.gfx.alpha = eu;
        b.gfx.y = lerp(Layout.H + Layout.queue.size, finalPos.y, eu);
      }, () => {
        b.gfx._queueEntering = false;
        b.gfx.y = finalPos.y;
      });
    }
  }
  refreshQueueLayout(skipAnim ? 0 : 0.22);
}

/* Find the row this entry occupies within its column (0 = top). */
function currentRowInCol(col, targetEntry) {
  let row = 0;
  for (const e of Game.queue) {
    if (e.col !== col) continue;
    if (e === targetEntry) return row;
    row++;
  }
  return row;
}

function refreshQueueLayout(duration = 0.18) {
  // Each column maintains an independent stack. Row = position within column.
  const cols = Layout.queue.cols;
  const colCounters = new Array(cols).fill(0);
  for (let k = 0; k < Game.queue.length; k++) {
    const entry = Game.queue[k];
    const col = entry.col;
    const row = colCounters[col]++;
    entry.row = row;
    const p = Layout.queuePos(col, row);
    const b = entry.bobbin;
    b.gfx.removeAllListeners('pointerdown');
    const idxAtBind = k;
    b.gfx.on('pointerdown', () => onClickQueue(idxAtBind));
    if (b.gfx._queueEntering) continue;
    if (duration > 0) tweenTo(b.gfx, p.x, p.y, duration);
    else { b.gfx.x = p.x; b.gfx.y = p.y; }
  }
}

/* =========================================================================
 *  Game logic
 * ========================================================================= */
function totalRemainingBobbins() {
  let n = 0;
  n += Game.deck.length;
  n += Game.queue.length;
  for (const s of Game.slots) if (s) n++;
  n += Game.rail.length;
  // also pending-launch (in flight)
  for (const c of Game.inFlightCarriers) if (c.phase === 'launching' && c.bobbin) n++;
  return n;
}

function isBoostActive() {
  return totalRemainingBobbins() <= GameTune.boost.triggerThreshold;
}

function speedMul() {
  return isBoostActive() ? GameTune.rail.boostMultiplier : 1.0;
}

function onClickQueue(i) {
  if (Game.paused || Game.ended) return;
  if (window.EditorTool && EditorTool.mode === 'edit') return;
  if (Game.clickCooldownT > 0) return;
  if (Game.dumpCount <= 0) return;
  if (i < 0 || i >= Game.queue.length) return;
  const entry = Game.queue[i];
  if (!entry) return;
  AudioSystem.unlock();
  // Remove from queue
  Game.queue.splice(i, 1);
  refreshQueueLayout(0.2);
  launchBobbin(entry.bobbin);
  refillQueue(false);
}

function onClickSlot(i) {
  if (Game.paused || Game.ended) return;
  if (window.EditorTool && EditorTool.mode === 'edit') return;
  if (Game.clickCooldownT > 0) return;
  if (Game.dumpCount <= 0) return;
  const slot = Game.slots[i];
  if (!slot) return;
  AudioSystem.unlock();
  Game.slots[i] = null;
  launchBobbin(slot.bobbin);
}

function launchBobbin(bobbin) {
  Game.clickCooldownT = GameTune.rail.clickCooldown;
  Game.dumpCount -= 1;
  updateCounter();
  redrawDump();
  AudioSystem.launch(bobbin.color);

  // Phase 1: spawn carrier from dump — already in the LYING (flat) form so
  // the launching tray reads as a single piece sliding cleanly forward
  // (reference behaviour). The dump's upright "card" sprites are separate
  // and stay in the stack; only the in-flight tray uses the lying art.
  // landingT controls how far past the rail entry the launch ends — past
  // ~0.04 puts the landed bobbin clear of the brush sprite.
  const carrier = new Carrier('lying');
  carrier.gfx.x = Layout.dump.x;
  carrier.gfx.y = Layout.dump.y;
  Game.layers.carrier.addChild(carrier.gfx);

  const landingT = clamp(EditorTune.launchEndT ?? 0.05, 0, 0.95);
  const startPos = RailPath.position(landingT);
  spawnLaunchGlow(startPos.x, startPos.y, bobbin.color);

  // Bobbin: float up to carrier
  bobbin.gfx.removeAllListeners('pointerdown');
  // re-parent bobbin if needed
  if (bobbin.gfx.parent !== Game.layers.bobbin) Game.layers.bobbin.addChild(bobbin.gfx);
  const bobbinStart = { x: bobbin.gfx.x, y: bobbin.gfx.y };

  const flight = {
    phase: 'launching',
    t: 0,
    duration: GameTune.visual.bobbinEnterRail,
    carrier,
    bobbin,
    fromCarrierPos: { x: Layout.dump.x, y: Layout.dump.y },
    // Via-point the tray must pass THROUGH at u=0.5 (not just curve toward).
    // Bigger X offset = more visible slide out of the brush.
    trayBoardPos: {
      x: Layout.dump.x + Layout.bobbinSize * 1.05,
      y: Layout.dump.y + Layout.bobbinSize * 0.38,
    },
    landingT,
    bobbinFrom: bobbinStart,
    railStart: startPos,
    bobbinLaid: false,
  };
  Game.inFlightCarriers.push(flight);
}

/* Animation system: register an anim with onUpdate(easedU, rawU) + optional onDone */
function addAnim(duration, onUpdate, onDone) {
  Game.anims.push({ t: 0, dur: duration, onUpdate, onDone, finished: false });
}
function tickAnims(dt) {
  for (let i = Game.anims.length - 1; i >= 0; i--) {
    const a = Game.anims[i];
    if (a.finished) { Game.anims.splice(i, 1); continue; }
    a.t += dt;
    const u = clamp(a.t / a.dur, 0, 1);
    const eu = easeOutCubic(u);
    try { a.onUpdate?.(eu, u); } catch (e) { console.warn('anim onUpdate error', e); }
    if (u >= 1) {
      a.finished = true;
      try { a.onDone?.(); } catch (e) { console.warn('anim onDone error', e); }
      Game.anims.splice(i, 1);
    }
  }
}

function tweenTo(obj, x, y, duration) {
  const sx = obj.x, sy = obj.y;
  addAnim(duration, (eu) => {
    obj.x = lerp(sx, x, eu);
    obj.y = lerp(sy, y, eu);
  });
}

function easeOutCubic(u) { return 1 - Math.pow(1 - u, 3); }
function easeInOutQuad(u) { return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; }
function phaseEase(u, start, end) {
  return easeInOutQuad(clamp((u - start) / Math.max(0.0001, end - start), 0, 1));
}

/* --- Rail entry handling --- */
function spawnRailEntry(carrier, bobbin, initialT = 0) {
  const startT = clamp(initialT, 0, 0.95);
  // Bobbin switches to LYING orientation when placed on rail
  if (bobbin.setOrientation) bobbin.setOrientation('lying');
  // Ensure carrier is fully laid down by the time it joins the rail.
  if (carrier.setOrientation) carrier.setOrientation('lying', true);
  const entry = {
    bobbin, carrier,
    t: startT,
    lapsCompleted: 0,
    lastPullKey: null,
    persistent: false,
    finished: false,
  };
  Game.rail.push(entry);
  // Place carrier and bobbin on rail
  const pos = RailPath.position(startT);
  const onTopY = EditorTune.bobbinOnTrayOffsetY || 0;
  carrier.gfx.x = pos.x;
  carrier.gfx.y = pos.y;
  carrier.gfx.rotation = pos.angle;
  bobbin.gfx.x = pos.x;
  bobbin.gfx.y = pos.y + onTopY;
}

function tickRail(dt) {
  if (Game.rail.length === 0) return;
  const lap = GameTune.rail.lapDuration / speedMul();
  const dT = dt / lap;

  // Sort by t descending so removals don't break iteration
  for (let i = Game.rail.length - 1; i >= 0; i--) {
    const e = Game.rail[i];
    const newT = e.t + dT;
    const crossedLap = newT >= 1.0;
    if (crossedLap) {
      e.lapsCompleted += 1;
      // boost-mode persistence check
      if (isBoostActive()) {
        e.persistent = true;
      }
      if (!e.persistent) {
        // End of lap: handle return
        finishLap(e);
        continue;
      } else {
        // Keep going (boost mode loop)
        e.t = newT - 1.0;
      }
    } else {
      e.t = newT;
    }
    // Move bobbin + carrier
    const pos = RailPath.position(e.t);
    e.carrier.gfx.x = pos.x;
    e.carrier.gfx.y = pos.y;
    // trayRailFlat forces the carrier to align with the rail direction
    // ONLY (no extra trayLaunchedRotationDeg). Keeps the tray flat to
    // the rail at all times.
    const flatRail = (EditorTune.trayRailFlat ?? 1) >= 0.5;
    e.carrier.gfx.rotation = pos.angle + (flatRail ? 0 : deg2rad(EditorTune.trayLaunchedRotationDeg));
    e.bobbin.gfx.x = pos.x;
    e.bobbin.gfx.y = pos.y + (EditorTune.bobbinOnTrayOffsetY || 0);
    // Bobbin follows the carrier direction (+ optional tuneable offset)
    e.bobbin.gfx.rotation = pos.angle + deg2rad(EditorTune.bobbinRailRotationDeg);
    // Keep label upright (counter-rotate the bobbin's parent rotation)
    if (e.bobbin.badgeGroup) e.bobbin.badgeGroup.rotation = -(pos.angle + deg2rad(EditorTune.bobbinRailRotationDeg));

    // Pull check (only on straight side, when cell changes)
    if (pos.side !== 'corner') {
      const key = `${pos.side}:${pos.cellIndex}`;
      if (e.lastPullKey !== key) {
        e.lastPullKey = key;
        tryPull(e, pos);
      }
    } else {
      e.lastPullKey = null;
    }

    e.bobbin.update(dt);

    if (e.bobbin.count <= 0) {
      // Bobbin done — fly carrier back fast
      finishBobbinExhausted(e);
      continue;
    }
  }
}

function tryPull(entry, pos) {
  const grid = Game.woolGrid;
  const N = PATTERN.width;
  const cell = pos.cellIndex;
  if (cell == null) return;
  let target = null;
  // CCW direction mapping:
  switch (pos.side) {
    case 'bottom': {
      // Bottom goes left→right; cellIndex 0 = col 0
      const col = cell;
      target = grid.pullFromCol(entry.bobbin.color, col, 'bottom');
      break;
    }
    case 'right': {
      // Right goes bottom→top; cellIndex 0 = row (N-1)
      const row = (N - 1) - cell;
      target = grid.pullFromRow(entry.bobbin.color, row, 'right');
      break;
    }
    case 'top': {
      // Top goes right→left; cellIndex 0 = col (N-1)
      const col = (N - 1) - cell;
      target = grid.pullFromCol(entry.bobbin.color, col, 'top');
      break;
    }
    case 'left': {
      // Left goes top→bottom; cellIndex 0 = row 0
      const row = cell;
      target = grid.pullFromRow(entry.bobbin.color, row, 'left');
      break;
    }
  }
  if (target) {
    const pulledColor = entry.bobbin.color;
    entry.bobbin.decrement(1);
    entry.bobbin.pulse();
    HapticThrottle.light();
    AudioSystem.pull(pulledColor);
    // Curved-thread FX
    const cellPos = Layout.cellCenter(target.row, target.col);
    spawnPullThread(cellPos, entry);
    if (!Game.clearedColors.has(pulledColor) && grid.remainingByColor(pulledColor) === 0) {
      Game.clearedColors.add(pulledColor);
      spawnColorClearPulse(pulledColor);
      HapticThrottle.medium();
      AudioSystem.colorClear(pulledColor);
    }
    // win check
    if (grid.remainingTotal() === 0) doWin();
  }
}

/* Pull-thread fx — thin yarn strand drawn with PIXI.Graphics curves.
 * Matches reference: a thin colored line, slight sag, natural curve from cell
 * to the moving bobbin. No texture needed at this thin scale. */

function spawnPullThread(cellPos, entry) {
  const pal = WOOL[entry.bobbin.color];
  // Reuse the existing thread for this bobbin so only ONE strand is ever visible
  // at a time. Move its origin to the latest pulled cell and reset its life so
  // it fades fresh from that anchor.
  const existing = Game.pullFx.find(fx => fx.entry === entry);
  if (existing) {
    existing.start.x = cellPos.x;
    existing.start.y = cellPos.y;
    existing.pal = pal;
    existing.t = 0;
    existing.wobblePhase = Math.random() * Math.PI * 2;
    existing.sagSign = Math.random() < 0.5 ? -1 : 1;
    return;
  }
  const visual = new PIXI.Graphics();
  Game.layers.thread.addChild(visual);
  Game.pullFx.push({
    t: 0,
    dur: 0.55,
    g: visual,
    start: { x: cellPos.x, y: cellPos.y },
    entry,
    pal,
    wobblePhase: Math.random() * Math.PI * 2,
    sagSign: Math.random() < 0.5 ? -1 : 1,
  });
}

function tickPullFx(dt) {
  for (let i = Game.pullFx.length - 1; i >= 0; i--) {
    const fx = Game.pullFx[i];
    const bgfx = fx.entry.bobbin.gfx;
    if (!bgfx || bgfx.destroyed) {
      if (fx.g.parent) fx.g.parent.removeChild(fx.g);
      if (!fx.g.destroyed) fx.g.destroy();
      Game.pullFx.splice(i, 1);
      continue;
    }
    fx.t += dt;
    const u = clamp(fx.t / fx.dur, 0, 1);

    const sx = fx.start.x, sy = fx.start.y;
    // Bobbin end follows the bobbin (which keeps moving along the rail).
    const bx = bgfx.x, by = bgfx.y;

    // Sag direction (perpendicular to the line)
    const dx = bx - sx, dy = by - sy;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;

    // Sag amplitude — peak in middle of life, with subtle wobble
    const sagBase = Math.min(len * 0.18, 30);
    const sagEnv = Math.sin(u * Math.PI);  // 0 → peak at 0.5 → 0
    const wobble = Math.sin(fx.t * 14 + fx.wobblePhase) * 3;
    const sag = (sagBase * sagEnv + wobble) * fx.sagSign;

    const mx = (sx + bx) / 2 + nx * sag;
    const my = (sy + by) / 2 + ny * sag;

    // Fade in over first 10%, opaque mid-life, fade out over last 20%
    const fadeIn = clamp(u / 0.10, 0, 1);
    const fadeOut = u < 0.80 ? 1 : clamp(1 - (u - 0.80) / 0.20, 0, 1);
    const alpha = fadeIn * fadeOut;

    // Thin yarn strand — single colored line scaled to ~2-3 px
    const wMain = Math.max(2, Layout.cellSize * 0.18);
    const wShadow = wMain + 1.4;
    const wHighlight = Math.max(1, wMain * 0.45);

    fx.g.clear();
    // Soft shadow underneath
    fx.g.lineStyle({ width: wShadow, color: fx.pal.dark, alpha: alpha * 0.45, cap: PIXI.LINE_CAP.ROUND });
    fx.g.moveTo(sx, sy);
    fx.g.quadraticCurveTo(mx, my, bx, by);
    // Main yarn color
    fx.g.lineStyle({ width: wMain, color: fx.pal.fill, alpha: alpha, cap: PIXI.LINE_CAP.ROUND });
    fx.g.moveTo(sx, sy);
    fx.g.quadraticCurveTo(mx, my, bx, by);
    // Highlight (slightly offset)
    fx.g.lineStyle({ width: wHighlight, color: fx.pal.light, alpha: alpha * 0.85, cap: PIXI.LINE_CAP.ROUND });
    fx.g.moveTo(sx + nx * 0.4, sy + ny * 0.4);
    fx.g.quadraticCurveTo(mx + nx * 0.4, my + ny * 0.4, bx + nx * 0.4, by + ny * 0.4);

    if (u >= 1) {
      if (fx.g.parent) fx.g.parent.removeChild(fx.g);
      if (!fx.g.destroyed) fx.g.destroy();
      Game.pullFx.splice(i, 1);
    }
  }
}

function drawMiniKnot(g, x, y, r, pal, alpha = 1) {
  g.lineStyle({ width: Math.max(1.5, r * 0.52), color: pal.dark, alpha: alpha * 0.35, cap: PIXI.LINE_CAP.ROUND });
  g.moveTo(x - r, y - r * 0.58); g.lineTo(x + r, y + r * 0.58);
  g.moveTo(x + r, y - r * 0.58); g.lineTo(x - r, y + r * 0.58);
  g.lineStyle({ width: Math.max(1.2, r * 0.40), color: pal.fill, alpha, cap: PIXI.LINE_CAP.ROUND });
  g.moveTo(x - r, y - r * 0.58); g.lineTo(x + r, y + r * 0.58);
  g.moveTo(x + r, y - r * 0.58); g.lineTo(x - r, y + r * 0.58);
}

function drawFourPointSpark(g, x, y, r, color, alpha = 1, rot = 0) {
  g.beginFill(color, alpha);
  g.moveTo(x + Math.cos(rot) * r, y + Math.sin(rot) * r);
  for (let i = 1; i < 8; i++) {
    const a = rot + i * Math.PI / 4;
    const rr = i % 2 === 0 ? r : r * 0.28;
    g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  g.closePath();
  g.endFill();
}

/* --- Lap end behaviors --- */
function finishLap(entry) {
  if (entry.finished) return;
  entry.finished = true;
  // Bobbin still has count > 0 → seek free slot
  const idx = Game.rail.indexOf(entry);
  if (idx >= 0) Game.rail.splice(idx, 1);

  const freeSlot = Game.slots.findIndex(s => s === null);
  if (freeSlot < 0) {
    // GAME OVER
    doFail(entry);
    return;
  }
  // Move bobbin to slot — switch back to upright orientation
  const slotPos = Layout.slotBobbinPos(freeSlot);
  const bb = entry.bobbin;
  const sx = bb.gfx.x, sy = bb.gfx.y;
  const sr = bb.gfx.rotation;
  if (bb.setOrientation) bb.setOrientation('upright');
  const dur = GameTune.visual.bobbinJumpToSlot;
  addAnim(dur, (eu, u) => {
    const arc = Math.sin(u * Math.PI) * 40;
    bb.gfx.x = lerp(sx, slotPos.x, eu);
    bb.gfx.y = lerp(sy, slotPos.y, eu) - arc;
    // Smoothly rotate label/sprite back to 0 (upright)
    bb.gfx.rotation = lerp(sr, 0, eu);
    if (bb.badgeGroup) bb.badgeGroup.rotation = lerp(-sr, 0, eu);
  }, () => {
    bb.gfx.x = slotPos.x; bb.gfx.y = slotPos.y;
    bb.gfx.rotation = 0;
    if (bb.badgeGroup) bb.badgeGroup.rotation = 0;
    Game.slots[freeSlot] = { bobbin: bb };
    bb.gfx.on('pointerdown', () => onClickSlot(freeSlot));
    HapticThrottle.light();
    AudioSystem.slot();
  });

  // Carrier slides down through rail and returns to back of dump (slow)
  returnCarrierToDump(entry.carrier, GameTune.visual.carrierReturnSlow);
}

function finishBobbinExhausted(entry) {
  if (entry.finished) return;
  entry.finished = true;
  const idx = Game.rail.indexOf(entry);
  if (idx >= 0) Game.rail.splice(idx, 1);

  // Carrier is freed immediately (counter +1)
  Game.dumpCount += 1;
  updateCounter();
  redrawDump();

  // Sparkle at the spot where the bobbin exhausted
  const x = entry.bobbin.gfx.x;
  const y = entry.bobbin.gfx.y;
  spawnSparkle(x, y);
  AudioSystem.pop();

  // Fade out bobbin + carrier in place, slight scale-up, then destroy
  const bgfx = entry.bobbin.gfx;
  const cgfx = entry.carrier.gfx;
  addAnim(0.35, (eu) => {
    if (!bgfx.destroyed) { bgfx.alpha = 1 - eu; bgfx.scale.set(1 + eu * 0.25); }
    if (!cgfx.destroyed) { cgfx.alpha = 1 - eu; cgfx.scale.set(1 + eu * 0.25); }
  }, () => {
    if (bgfx.parent) bgfx.parent.removeChild(bgfx);
    if (!bgfx.destroyed) bgfx.destroy({ children: true });
    if (cgfx.parent) cgfx.parent.removeChild(cgfx);
    if (!cgfx.destroyed) cgfx.destroy({ children: true });
  });
}

function spawnLaunchGlow(x, y, color) {

    g.beginFill(pal.light, a * 0.16);
    g.drawCircle(0, 0, r);
    g.endFill();
    g.lineStyle(2, 0xffffff, a * 0.78);
    g.drawCircle(0, 0, r * 0.86);
    for (let i = 0; i < 7; i++) {
      const ang = i * 2.399 + u * 2.2;
      const rr = r * (0.35 + (i % 3) * 0.18);
      drawFourPointSpark(g, Math.cos(ang) * rr, Math.sin(ang) * rr, Layout.cellSize * 0.18, 0xffffff, a * 0.8, ang);
    }

}

function spawnBoostPulse() {

function spawnWinBurst() {
  const g = new PIXI.Graphics();
  Game.layers.fx.addChild(g);
  const L = Layout.hoop;
  const particles = Array.from({ length: 54 }, (_, i) => {
    const a = (i / 54) * Math.PI * 2;
    const speed = Layout.hoop.innerHalf * (0.25 + (i % 7) * 0.028);
    return {
      x: L.cx + Math.cos(a * 1.7) * L.innerHalf * 0.2,
      y: L.cy + Math.sin(a * 1.3) * L.innerHalf * 0.2,
      vx: Math.cos(a) * speed,
      vy: Math.sin(a) * speed - Layout.hoop.innerHalf * 0.12,
      r: Layout.cellSize * (0.16 + (i % 4) * 0.05),
      color: [0xffffff, WOOL.blue.light, WOOL.orange.light, WOOL.red.light][i % 4],
      rot: i * 0.61,
    };
  });
  addAnim(1.25, (eu, u) => {
    g.clear();
    for (const p of particles) {
      const x = p.x + p.vx * u;
      const y = p.y + p.vy * u + Layout.hoop.innerHalf * 0.75 * u * u;
      const a = Math.max(0, 1 - u);
      drawFourPointSpark(g, x, y, p.r * (1 + u * 0.6), p.color, a, p.rot + u * 4);
    }
  }, () => {
    if (g.parent) g.parent.removeChild(g);
    if (!g.destroyed) g.destroy();
  });
}

/* Sparkle / bubble effect at (x, y) — used when bobbin exhausts in place. */
function spawnSparkle(x, y) {
  const g = new PIXI.Graphics();
  Game.layers.fx.addChild(g);
  g.x = x; g.y = y;
  const dur = 0.55;
  addAnim(dur, (eu, u) => {
    g.clear();
    const r = lerp(Layout.bobbinSize * 0.4, Layout.bobbinSize * 1.6, eu);
    const a = 1 - eu;
    // outer translucent bubble
    g.beginFill(0xffffff, a * 0.30);
    g.drawCircle(0, 0, r);
    g.endFill();
    // inner rim
    g.lineStyle(2, 0xffffff, a * 0.85);
    g.drawCircle(0, 0, r * 0.95);
    // 4 sparkle spikes
    g.lineStyle(3, 0xffffff, a);
    const spikeLen = r * 0.5;
    for (let i = 0; i < 4; i++) {
      const ang = i * Math.PI / 2 + Math.PI / 4;
      g.moveTo(Math.cos(ang) * r * 0.4, Math.sin(ang) * r * 0.4);
      g.lineTo(Math.cos(ang) * (r * 0.4 + spikeLen), Math.sin(ang) * (r * 0.4 + spikeLen));
    }
    for (let i = 0; i < 9; i++) {
      const ang = i * 2.15 + u * 1.8;
      const rr = r * (0.52 + (i % 3) * 0.18);
      drawFourPointSpark(g, Math.cos(ang) * rr, Math.sin(ang) * rr, Layout.cellSize * 0.20, 0xffffff, a * 0.9, ang);
    }
  }, () => {
    if (g.parent) g.parent.removeChild(g);
    if (!g.destroyed) g.destroy();
  });
}

function returnCarrierToDump(carrier, duration) {
  const sx = carrier.gfx.x, sy = carrier.gfx.y;
  const sr = carrier.gfx.rotation;
  const tx = Layout.dump.x, ty = Layout.dump.y;
  addAnim(duration, (eu, u) => {
    carrier.gfx.x = lerp(sx, tx, eu);
    carrier.gfx.y = lerp(sy, ty, eu);
    carrier.gfx.rotation = lerp(sr, 0, eu);
    if (carrier.applyFade) carrier.applyFade('lying', 'upright', u);
  }, () => {
    if (carrier.gfx.parent) carrier.gfx.parent.removeChild(carrier.gfx);
    if (!carrier.gfx.destroyed) carrier.gfx.destroy({ children: true });
    Game.dumpCount += 1;
    updateCounter();
    redrawDump();
  });
}

/* --- Launch in-flight (queue→rail) --- */
function tickInFlight(dt) {
  for (let i = Game.inFlightCarriers.length - 1; i >= 0; i--) {
    const f = Game.inFlightCarriers[i];
    if (f.phase === 'launching') {
      f.t += dt;
      const u = clamp(f.t / f.duration, 0, 1);
      const sp = f.railStart || RailPath.position(f.landingT ?? 0);
      // Quadratic Bezier that PASSES THROUGH the via-point at trayU = 0.5,
      // not just curves toward it. Control = 2*via - 0.5*(start+end).
      const q = (a, b, c, t) => lerp(lerp(a, b, t), lerp(b, c, t), t);
      const trayMid = f.trayBoardPos || {
        x: lerp(f.fromCarrierPos.x, sp.x, 0.45),
        y: lerp(f.fromCarrierPos.y, sp.y, 0.45),
      };
      const ctrlX = 2 * trayMid.x - 0.5 * (f.fromCarrierPos.x + sp.x);
      const ctrlY = 2 * trayMid.y - 0.5 * (f.fromCarrierPos.y + sp.y);
      const trayU = phaseEase(u, 0.14, 0.92);
      f.carrier.gfx.x = q(f.fromCarrierPos.x, ctrlX, sp.x, trayU);
      f.carrier.gfx.y = q(f.fromCarrierPos.y, ctrlY, sp.y, trayU);
      // Carrier is already in lying form (see launchBobbin) — keep its 2D
      // rotation locked to the rail angle the whole time so the tray slides
      // cleanly without any "tilting up from the bottom" effect.
      f.carrier.gfx.rotation = sp.angle;

      if (!f.bobbinLaid && u > 0.48) {
        f.bobbinLaid = true;
        if (f.bobbin.setOrientation) f.bobbin.setOrientation('lying');
      }
      const bobbinU = phaseEase(u, 0.05, 0.95);
      const bxMid = Math.min(f.bobbinFrom.x, sp.x) - Layout.bobbinSize * 0.22;
      const byMid = lerp(f.bobbinFrom.y, sp.y, 0.54) + Layout.bobbinSize * 0.10;
      // Bobbin lands on top of the tray (negative Y = above in screen space).
      const onTopY = (EditorTune.bobbinOnTrayOffsetY || 0);
      f.bobbin.gfx.x = q(f.bobbinFrom.x, bxMid, sp.x, bobbinU);
      f.bobbin.gfx.y = q(f.bobbinFrom.y, byMid, sp.y + onTopY, bobbinU);
      const bobbinRot = lerp(0, sp.angle + deg2rad(EditorTune.bobbinRailRotationDeg), phaseEase(u, 0.48, 0.95));
      f.bobbin.gfx.rotation = bobbinRot;
      if (f.bobbin.badgeGroup) f.bobbin.badgeGroup.rotation = -bobbinRot;
      if (u >= 1) {
        Game.inFlightCarriers.splice(i, 1);
        // Hand off to the rail at the landing point — NOT t=0, so motion
        // continues smoothly from where the launch ended.
        spawnRailEntry(f.carrier, f.bobbin, f.landingT ?? 0);
      }
    }
  }
}

/* --- Win/Lose --- */
function doWin() {
  if (Game.ended) return;
  Game.ended = true;
  spawnWinBurst();
  showBanner('CLEAR!');
  HapticThrottle.medium();
  AudioSystem.win();
  GameBridge.notifySuccess();
}
function doFail(entry) {
  if (Game.ended) return;
  Game.ended = true;
  showBanner('GAME OVER');
  HapticThrottle.medium();
  GameBridge.notifyFail();
}
function showBanner(text) {
  const ov = document.getElementById('overlay');
  const b = document.getElementById('banner');
  b.textContent = text;
  ov.classList.add('show');
}

function onKeyDown(e) {
  if (e.key?.toLowerCase() === 'f') toggleFullscreen();
}

function toggleFullscreen() {
  const root = document.documentElement;
  if (!document.fullscreenElement) root.requestFullscreen?.();
  else document.exitFullscreen?.();
}

function renderGameToText() {
  const woolByColor = {};
  for (const color of Object.keys(WOOL)) woolByColor[color] = Game.woolGrid?.remainingByColor(color) || 0;
  const rail = Game.rail.map((entry) => {
    const pos = RailPath.position(entry.t);
    return {
      color: entry.bobbin.color,
      count: entry.bobbin.count,
      t: Number(entry.t.toFixed(3)),
      side: pos.side,
      cellIndex: pos.cellIndex,
      x: Math.round(pos.x),
      y: Math.round(pos.y),
    };
  });
  return JSON.stringify({
    coordinates: 'origin top-left, x right, y down, pixels',
    mode: Game.ended ? 'ended' : (Game.paused ? 'paused' : 'playing'),
    ended: Game.ended,
    boost: isBoostActive(),
    carriers: { available: Game.dumpCount, total: GameTune.carrier.total },
    wool: { remaining: Game.woolGrid?.remainingTotal() || 0, byColor: woolByColor },
    deckRemaining: Game.deck.length,
    queue: Game.queue.map((q, i) => ({ index: i, color: q.bobbin.color, count: q.bobbin.count, x: Math.round(q.bobbin.gfx.x), y: Math.round(q.bobbin.gfx.y) })),
    slots: Game.slots.map((s, i) => s ? ({ index: i, color: s.bobbin.color, count: s.bobbin.count }) : null),
    rail,
    inFlight: Game.inFlightCarriers.length,
  });
}

function advanceTime(ms) {
  const steps = Math.max(1, Math.round(ms / (1000 / 60)));
  const wasPaused = Game.paused;
  Game.paused = false;
  for (let i = 0; i < steps; i++) tick(1);
  Game.paused = wasPaused;
  Game.app?.renderer.render(Game.app.stage);
}

/* =========================================================================
 *  Editor (live-tune visual parameters)
 * ========================================================================= */
function initEditor() {
  // One-time migration: if a legacy `arrowRadius` value is present (from old saved
  // configs), copy it to both X and Y.
  if (typeof EditorTune.arrowRadius === 'number' &&
      EditorTune.arrowRadiusX === EDITOR_DEFAULTS.arrowRadiusX &&
      EditorTune.arrowRadiusY === EDITOR_DEFAULTS.arrowRadiusY) {
    EditorTune.arrowRadiusX = EditorTune.arrowRadius;
    EditorTune.arrowRadiusY = EditorTune.arrowRadius;
    delete EditorTune.arrowRadius;
  }

  MapTool.init();

}
