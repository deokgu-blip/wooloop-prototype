<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wooloop Prototype</title>
<style>
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #6db4d6;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  canvas { display: block; }
  #overlay {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #overlay .banner {
    background: rgba(0,0,0,0.55);
    color: #fff;
    padding: 16px 28px;
    border-radius: 14px;
    font-size: 22px;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity .3s;
  }
  #overlay.show .banner { opacity: 1; }

  /* ============= Unity-style Editor ============= */
  /* Editor-only scene overlay: dim the running game and overlay a faint
     grid so the canvas feels like a Unity scene view rather than a paused
     game. pointer-events:none so canvas clicks still reach the gizmo. */
  #editor-scene-overlay {
    position: fixed; inset: 0; z-index: 500;
    pointer-events: none; display: none;
    background-color: rgba(15, 22, 30, 0.22);
    background-image:
      linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  body.editor-mode #editor-scene-overlay { display: block; }
  /* Watermark text top-center */
  body.editor-mode::after {
    content: '에디터 모드 · 게임 정지';
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    z-index: 1001; pointer-events: none;
    background: rgba(20,30,40,0.85);
    color: #82c8ff; font-size: 11px; font-weight: 700;
    letter-spacing: 0.5px;
    padding: 5px 12px; border-radius: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }

  /* Mode dropdown — always visible at top-left */
  #editor-mode-bar {
    position: fixed; top: 8px; left: 8px; z-index: 1001;
    display: flex; gap: 6px; align-items: center;
  }
  #editor-mode-bar select {
    background: rgba(20,30,40,0.92); color: #fff;
    border: 1px solid #4a5560; border-radius: 6px;
    padding: 6px 10px; font-size: 12.5px; font-weight: 700;
    cursor: pointer; min-width: 110px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
  }
  #editor-mode-bar select:focus { outline: 1px solid #4a7ec0; }

  /* Left sidebar — visible only in edit mode */
  #editor-shell { display: none; }
  body.editor-mode #editor-shell { display: block; }
  #editor-shell .left-panel {
    position: fixed; top: 48px; left: 8px; z-index: 1000;
    width: 230px; max-height: calc(100vh - 60px);
    background: rgba(20,30,40,0.96); color: #fff;
    border-radius: 8px; padding: 10px 10px 8px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    display: flex; flex-direction: column; gap: 8px;
    overflow: hidden;
  }
  #editor-shell .left-panel h4 {
    margin: 0; font-size: 11px; color: #82c8ff;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  #asset-list {
    list-style: none; margin: 0; padding: 0;
    overflow-y: auto; max-height: 32vh;
    border: 1px solid #2a3540; border-radius: 5px;
    background: #161c22;
  }
  #asset-list li {
    padding: 7px 10px; font-size: 12px;
    border-bottom: 1px solid #232c36;
    cursor: pointer;
  }
  #asset-list li:last-child { border-bottom: none; }
  #asset-list li:hover { background: #1f2832; }
  #asset-list li.selected {
    background: #2c5d96; color: #fff;
  }
  #asset-list li .tag {
    float: right; font-size: 10px; color: #889;
    background: #2a323a; padding: 1px 5px; border-radius: 8px;
  }
  #asset-list li.selected .tag { background: rgba(255,255,255,0.18); color:#dfe; }

  /* Gizmo mode bar */
  .gizmo-bar {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
  }
  .gizmo-bar.four { grid-template-columns: repeat(4, 1fr); }
  .gizmo-bar button {
    background: #2a323a; color: #ddd; border: 1px solid #3a4a5a;
    border-radius: 5px; padding: 7px 4px; font-size: 11px;
    cursor: pointer;
  }
  .gizmo-bar button.active {
    background: #4a7ec0; color: #fff; border-color: #82c8ff;
  }
  .gizmo-bar button:hover:not(.active) { background: #303a44; }
  .gizmo-bar .kb { color: #aac; font-size: 9px; margin-left: 3px; }

  /* Inspector */
  #inspector {
    border: 1px solid #2a3540; border-radius: 5px;
    background: #161c22; padding: 8px 8px 10px;
    overflow-y: auto; max-height: 38vh; flex: 1;
  }
  #inspector .empty { color: #677; font-size: 11px; text-align: center; padding: 14px 0; }
  #inspector .field-group {
    margin: 8px 0 6px;
  }
  #inspector .field-group:first-child { margin-top: 0; }
  #inspector .field-title {
    font-size: 10px; color: #82c8ff; font-weight: 700;
    margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px;
  }
  #inspector .field-row {
    display: grid; grid-template-columns: 16px 1fr; gap: 5px;
    align-items: center; margin: 3px 0;
  }
  #inspector .field-row .axis {
    text-align: center; font-size: 10.5px; font-weight: 700;
  }
  #inspector .field-row .axis.x { color: #f87a7a; }
  #inspector .field-row .axis.y { color: #7aff8a; }
  #inspector .field-row .axis.z { color: #7aa8ff; }
  #inspector .field-row input[type="number"] {
    width: 100%; background: #20272f; color: #fff;
    border: 1px solid #2a3540; border-radius: 4px;
    padding: 3px 5px; font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  #inspector .field-row input[type="number"]:focus {
    outline: 1px solid #4a7ec0;
  }
  #inspector .field-row input[type="number"].disabled {
    color: #556; background: #181d22;
  }
  #inspector .hint {
    font-size: 10.5px; color: #889; margin-top: 6px; line-height: 1.4;
  }

  /* Bottom actions */
  .editor-actions {
    display: grid; grid-template-columns: 1fr 1fr; gap: 5px;
  }
  .editor-actions button {
    background: #4a7ec0; color: #fff; border: none;
    border-radius: 5px; padding: 8px 6px; font-size: 11.5px;
    cursor: pointer; font-weight: 600;
  }
  .editor-actions button.secondary { background: #404a55; }
  .editor-actions button:hover { filter: brightness(1.15); }
  .editor-actions button.full-width { grid-column: span 2; }

  /* Tool/map panel — right side */
  #tool-shell { display: none; }
  body.editor-mode #tool-shell { display: block; }
  #tool-shell .right-panel {
    position: fixed; top: 48px; right: 8px; z-index: 1000;
    width: 280px; max-height: calc(100vh - 60px);
    background: rgba(20,30,40,0.96); color: #fff;
    border-radius: 8px; padding: 10px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    display: flex; flex-direction: column; gap: 8px;
    overflow-y: auto;
  }
  #tool-shell.collapsed .right-panel { display: none; }
  #tool-shell .tool-tab-bar {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
  }
  #tool-shell .tool-tab-bar button {
    background: #2a323a; color: #ddd; border: 1px solid #3a4a5a;
    border-radius: 5px; padding: 6px 4px; font-size: 11px; cursor: pointer;
  }
  #tool-shell .tool-tab-bar button.active {
    background: #4a7ec0; color: #fff; border-color: #82c8ff;
  }
  #tool-shell .tool-section[hidden] { display: none; }
  #tool-shell h4 {
    margin: 4px 0 4px; font-size: 11px; color: #82c8ff;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  #tool-shell .row {
    display: flex; align-items: center; gap: 6px; margin: 4px 0;
  }
  #tool-shell .row label { flex: 0 0 90px; font-size: 10.5px; color: #bcd; }
  #tool-shell .row input[type="range"] { flex: 1; min-width: 0; }
  #tool-shell .row .val {
    flex: 0 0 40px; font-size: 10.5px; text-align: right; color: #fff;
    font-variant-numeric: tabular-nums;
  }
  #tool-shell button {
    background: #4a7ec0; color: #fff; border: none;
    border-radius: 5px; padding: 7px 10px; font-size: 11.5px;
    cursor: pointer;
  }
  #tool-shell button.secondary { background: #404a55; }

  /* Drop zone (resource upload) */
  #tool-shell .drop-zone {
    border: 2px dashed #4a5560; border-radius: 6px;
    padding: 14px 8px; margin: 6px 0;
    text-align: center; font-size: 11.5px; color: #bcd;
    background: #1f262d; cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  #tool-shell .drop-zone:hover { border-color: #4a7ec0; background: #242c34; }
  #tool-shell .drop-zone.dragover { border-color: #82c8ff; background: #2c3744; color: #fff; }
  #tool-shell .drop-zone .hint { display: block; margin-top: 4px; font-size: 10px; color: #889; }
  #tool-shell select.target-select {
    width: 100%; background: #2a323a; color: #fff;
    border: 1px solid #4a5560; border-radius: 5px;
    padding: 5px 8px; font-size: 11.5px; margin: 4px 0;
  }
  #tool-shell .upload-result {
    font-size: 10.5px; color: #9c9; margin-top: 4px;
    font-family: ui-monospace, monospace;
  }

  /* Map tool */
  #map-canvas {
    display: block; margin: 6px auto;
    cursor: crosshair; background: #0d1116;
    border: 1px solid #2a323a; border-radius: 4px;
    image-rendering: pixelated;
    touch-action: none;
  }
  #map-palette {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
    margin: 6px 0;
  }
  #map-palette button {
    aspect-ratio: 1; padding: 0; background: #2a323a;
    border: 2px solid transparent; border-radius: 4px;
    cursor: pointer; min-height: 28px;
  }
  #map-palette button.selected { border-color: #fff; }
  #map-palette button .swatch {
    display: block; width: 100%; height: 100%; border-radius: 2px;
  }
  #bobbin-preview {
    font-size: 11px; color: #cde;
    display: flex; flex-direction: column; gap: 3px;
    max-height: 140px; overflow-y: auto;
  }
  #bobbin-preview .chip {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 6px; background: #1f262d; border-radius: 4px;
  }
  #bobbin-preview .chip .sw {
    width: 14px; height: 14px; border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.2);
  }
  #bobbin-preview em { color: #889; font-size: 10.5px; }
  #tool-shell .toolbar-actions {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    margin: 8px 0;
  }
  #tool-shell .toolbar-actions button { padding: 7px 8px; font-size: 11.5px; }
  #tool-shell fieldset {
    border: 1px solid #3a4a5a; border-radius: 6px;
    margin: 4px 0; padding: 6px 8px 8px;
  }
  #tool-shell legend {
    padding: 0 5px; color: #82c8ff;
    font-size: 10.5px; font-weight: 700;
  }
</style>

<!-- ===== Mode dropdown (top-left, always visible) ===== -->

  <select id="app-mode-select" title="모드 전환">

<script>
/* =========================================================================
 *  Wooloop Prototype — single HTML, PixiJS r7
 *  Spec: see GAME_SPEC.md
 * ========================================================================= */

/* --- OnMessageFromFlutter buffering stub (CLAUDE.md required) --- */
(function() {
  const buf = [];
  window.OnMessageFromFlutter = function(msg) { buf.push(msg); };
  window.__flutterMsgBuf = buf;
})();

/* --- GameBridge --- */
const GameBridge = {
  init() {
    const handle = (msg) => this.onFlutterMessage(msg);
    if (window.__flutterMsgBuf) window.__flutterMsgBuf.forEach(handle);
    window.OnMessageFromFlutter = handle;
  },
  send(eventName, data) {
    const json = JSON.stringify({ event: eventName, data: data });
    try {
      if (window.FlutterChannel?.postMessage)               window.FlutterChannel.postMessage(json);
      else if (window.webkit?.messageHandlers?.GameReels)   window.webkit.messageHandlers.GameReels.postMessage(json);
      else if (window.AndroidBridge?.postMessage)           window.AndroidBridge.postMessage(json);
      else if (window.ReactNativeWebView?.postMessage)      window.ReactNativeWebView.postMessage(json);
      else if (window.flutter_inappwebview?.callHandler)    window.flutter_inappwebview.callHandler(eventName, data);
      else if (window.parent !== window)                    window.parent.postMessage(json, '*');
      else console.log('[GameBridge]', eventName, data);
    } catch (e) { console.warn('GameBridge send error', e); }
  },
  _postLuna(typeName) {
    try { window.FlutterChannel?.postMessage?.(JSON.stringify({ type: 'luna:' + typeName })); } catch (e) {}
  },
  notifyReady()   { this.send('GameStart', null); this._postLuna('started'); this.send('started', null); },
  notifySuccess() { this._postLuna('success'); this.send('success', null); },
  notifyFail()    { this._postLuna('fail');    this.send('fail', null); },
  lightVibrate()  { this.send('LightVibrate', null); },
  mediumVibrate() { this.send('MediumVibrate', null); },
  onFlutterMessage(msg) {
    try {
      const p = typeof msg === 'string' ? JSON.parse(msg) : msg;
      const key = (p.event ?? p.type ?? p.event_type ?? p.action ?? p.name ?? p.command ?? '').toString().toLowerCase();
      if (key.includes('pause'))   { Game.paused = true; return; }
      if (key.includes('resume') || key.includes('start')) { Game.paused = false; return; }
      if (key.includes('uitoggle') || key.includes('ui'))  { Game.uiVisible = !Game.uiVisible; return; }
      Game.paused = false; // defensive resume
    } catch (e) { Game.paused = false; }
  },
};

/* --- HapticThrottle --- */
const HapticThrottle = {
  lastLight: 0, lastMedium: 0,
  light()  { const n=performance.now(); if(n-this.lastLight<30) return; this.lastLight=n; GameBridge.lightVibrate(); },
  medium() { const n=performance.now(); if(n-this.lastMedium<200) return; this.lastMedium=n; GameBridge.mediumVibrate(); },
};

/* --- Procedural SFX (short, user-gesture unlocked) --- */
const AudioSystem = {
  ctx: null,
  unlocked: false,
  colorFreq: { blue: 520, red: 620, white: 760, black: 340, orange: 450 },
  unlock() {
    if (this.unlocked) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    this.ctx = this.ctx || new Ctx();
    this.ctx.resume?.();
    this.unlocked = true;
  },
  tone(freq, duration = 0.08, type = 'sine', volume = 0.045, slide = 0) {
    if (!this.ctx || this.ctx.state === 'suspended') return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), now + duration);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(gain).connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  },
  pull(color) { this.tone(this.colorFreq[color] || 520, 0.055, 'triangle', 0.035, 80); },
  launch(color) { this.tone((this.colorFreq[color] || 520) * 0.75, 0.11, 'sine', 0.04, 160); },
  slot() { this.tone(420, 0.09, 'triangle', 0.035, -120); },
  pop() { this.tone(880, 0.12, 'sine', 0.04, 220); },
  colorClear(color) { this.tone((this.colorFreq[color] || 520) * 1.25, 0.16, 'triangle', 0.05, 240); },
  win() {
    this.tone(620, 0.12, 'sine', 0.045, 120);
    setTimeout(() => this.tone(820, 0.14, 'sine', 0.045, 180), 80);
    setTimeout(() => this.tone(1040, 0.18, 'sine', 0.05, 220), 165);
  },
};

let EditorTune = (() => {
  const fresh = () => {
    const t = { ...EDITOR_DEFAULTS };
    // Detach the array so user reorders don't mutate the defaults.
    t.layerOrder = EDITOR_DEFAULTS.layerOrder.slice();
    return t;
  };
  // Migration: backfill the legacy queueGap into queueGapX/Y when the saved
  // payload only has queueGap. Must run on the SOURCE data before defaults
  // are merged in, otherwise the default 0.72 wins over the legacy value.
  const migrateSource = (src) => {
    if (src && typeof src.queueGap === 'number') {
      if (typeof src.queueGapX !== 'number') src.queueGapX = src.queueGap;
      if (typeof src.queueGapY !== 'number') src.queueGapY = src.queueGap;
    }
    return src;
  };
  try {
    const saved = localStorage.getItem('wooloop_editor_tune');
    if (saved) {
      const parsed = migrateSource(JSON.parse(saved));
      if (parsed && typeof parsed === 'object') {
        // Merge saved values OVER defaults instead of dropping them on a version
        // mismatch. New keys added in this build get their defaults; existing
        // user edits survive across schema bumps.
        const merged = { ...EDITOR_DEFAULTS, ...parsed, version: EDITOR_DEFAULTS.version };
        merged.layerOrder = Array.isArray(parsed.layerOrder) && parsed.layerOrder.length
          ? parsed.layerOrder.slice()
          : EDITOR_DEFAULTS.layerOrder.slice();
        if (parsed.version !== EDITOR_DEFAULTS.version) {
          merged.trayDumpRotationDeg = EDITOR_DEFAULTS.trayDumpRotationDeg;
          merged.trayIdleScale = EDITOR_DEFAULTS.trayIdleScale;

        return merged;

    }
  } catch (e) {}
  return fresh();
})();

/* Load editor_tune.json (if it ships with the build / repo) and merge it on
 * top of localStorage+defaults. Called once before the first render in boot()
 * so the very first frame uses the committed values. File > localStorage so
 * a `git pull` of new shared values always wins over stale per-machine state. */
async function loadEditorTuneFromFile() {
  // Baked override (from "스테이지 빌드" export) wins over everything else so
  // a built stage HTML always renders deterministically, regardless of
  // localStorage or whether editor_tune.json is reachable.
  if (EDITOR_TUNE_OVERRIDE && typeof EDITOR_TUNE_OVERRIDE === 'object') {
    Object.assign(EditorTune, EDITOR_TUNE_OVERRIDE);
    if (Array.isArray(EDITOR_TUNE_OVERRIDE.layerOrder) && EDITOR_TUNE_OVERRIDE.layerOrder.length) {
      EditorTune.layerOrder = EDITOR_TUNE_OVERRIDE.layerOrder.slice();
    }
    return true;
  }
  try {
    const res = await fetch('editor_tune.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return false;
    const parsed = await res.json();
    if (!parsed || typeof parsed !== 'object') return false;
    // Backfill the legacy queueGap into queueGapX/Y BEFORE Object.assign so
    // the legacy value wins over the defaults already in EditorTune.
    if (typeof parsed.queueGap === 'number') {
      if (typeof parsed.queueGapX !== 'number') parsed.queueGapX = parsed.queueGap;
      if (typeof parsed.queueGapY !== 'number') parsed.queueGapY = parsed.queueGap;
    }
    Object.assign(EditorTune, parsed);
    if (Array.isArray(parsed.layerOrder) && parsed.layerOrder.length) {
      EditorTune.layerOrder = parsed.layerOrder.slice();
    }
    return true;
  } catch (e) {
    // Missing file or fetch unsupported (file:// open) — keep current state.
    return false;
  }
}

/* --- Reference-inspired chicken pattern (28x28, generated as wool pixels) --- */
function createChickenPattern() {
  const width = 28;
  const height = 28;
  const cells = Array.from({ length: height }, () => Array(width).fill('blue'));
  const setCell = (x, y, color) => {
    const cx = Math.round(x);
    const cy = Math.round(y);
    if (cx >= 0 && cx < width && cy >= 0 && cy < height) cells[cy][cx] = color;
  };
  const pointInPoly = (px, py, pts) => {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const xi = pts[i][0], yi = pts[i][1];
      const xj = pts[j][0], yj = pts[j][1];
      const intersects = ((yi > py) !== (yj > py)) &&
        (px < ((xj - xi) * (py - yi)) / ((yj - yi) || 0.0001) + xi);
      if (intersects) inside = !inside;
    }
    return inside;
  };
  const fillPoly = (color, pts) => {
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        if (pointInPoly(x + 0.5, y + 0.5, pts)) cells[y][x] = color;
      }
    }
  };
  const fillEllipse = (color, cx, cy, rx, ry) => {
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const dx = (x + 0.5 - cx) / rx;
        const dy = (y + 0.5 - cy) / ry;
        if (dx * dx + dy * dy <= 1) cells[y][x] = color;
      }
    }
  };
  const strokeLine = (color, x0, y0, x1, y1, radius = 0.5) => {
    const dx = x1 - x0;
    const dy = y1 - y0;
    const len2 = dx * dx + dy * dy || 1;
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const px = x + 0.5;
        const py = y + 0.5;
        const t = Math.max(0, Math.min(1, ((px - x0) * dx + (py - y0) * dy) / len2));
        const qx = x0 + t * dx;
        const qy = y0 + t * dy;
        if ((px - qx) ** 2 + (py - qy) ** 2 <= radius * radius) cells[y][x] = color;
      }
    }
  };

  // Black silhouette first, then colored stitch areas inside it.
  fillPoly('black', [[1,24],[1,20],[3,18],[4,16],[6,15],[7,13],[9,12],[10,10],[14,8],[18,9],[21,12],[23,17],[23,23],[21,25],[10,25],[4,24]]);
  fillPoly('white', [[3,23],[3,20],[5,18],[7,16],[8,14],[10,13],[11,11],[14,10],[17,11],[19,13],[21,17],[21,22],[19,23],[10,23],[5,22]]);
  fillPoly('black', [[14,8],[18,7],[22,9],[23,13],[21,16],[17,16],[16,13],[15,10]]);
  fillPoly('white', [[16,9],[18,9],[21,10],[21,13],[19,15],[17,14],[17,12]]);
  fillPoly('black', [[15,6],[16,4],[18,4],[19,6],[21,6],[24,8],[22,10],[18,10],[16,9],[15,8]]);
  fillPoly('red', [[16,6],[17,5],[18,6],[20,6],[22,8],[21,9],[18,9],[16,8]]);
  fillPoly('red', [[20,10],[22,11],[21,13],[20,13]]);
  fillEllipse('black', 13.7, 18.4, 4.1, 5.2);
  fillEllipse('orange', 13.7, 18.3, 2.9, 4.0);
  fillPoly('black', [[14,22],[16,21],[17,22],[16,23],[14,23]]);
  fillPoly('black', [[19,21],[21,22],[21,24],[20,25],[18,24]]);
  setCell(19, 11, 'black');
  setCell(22, 10, 'black');
  strokeLine('black', 2, 22, 12, 10, 0.45);
  strokeLine('black', 20, 14, 20, 22, 0.45);

  return { width, height, cells };
}

function countPatternCells(cells) {
  const counts = {};
  for (const row of cells) {
    for (const color of row) {
      if (!color) continue;
      counts[color] = (counts[color] || 0) + 1;
    }
  }
  return counts;
}

function createBobbinDeck(cells) {
  const remaining = countPatternCells(cells);
  const order = [
    'blue', 'blue', 'black', 'black', 'blue', 'white',
    'red', 'white', 'orange', 'blue', 'black', 'blue',
    'white', 'orange', 'blue', 'black', 'red', 'blue',
  ];
  const deck = [];
  let guard = 0;
  while (Object.values(remaining).some(v => v > 0) && guard++ < 1000) {
    let progressed = false;
    for (const color of order) {
      if (!remaining[color]) continue;
      const count = Math.min(BOBBIN_MAX_COUNT, remaining[color]);
      deck.push({ color, count });
      remaining[color] -= count;
      progressed = true;
    }
    if (!progressed) break;
  }
  return deck;
}

/* =========================================================================
 *  Layout
 * ========================================================================= */
const Layout = {
  W: 0, H: 0,
  hoop: { cx: 0, cy: 0, outerHalf: 0, innerHalf: 0, rim: 0, cornerRadius: 0 },
  cellSize: 0,
  ringHalf: 0,        // distance from hoop center to bobbin track center
  dump: { x: 0, y: 0 },
  counter: { x: 0, y: 0 },
  slot: { y: 0, size: 0, spacing: 0, startX: 0 },
  queue: { y: 0, size: 0, spacingX: 0, spacingY: 0, startX: 0, rows: 2, cols: 3 },
  bobbinSize: 0,

  compute(W, H) {
    this.W = W; this.H = H;
    const reservedTop = 80;
    const reservedBottom = 380;  // fixed — hoop size depends ONLY on viewport.

    // Slot / queue intrinsic sizes (depend only on W).
    const slotSizePre = Math.min((W - 40) / 5 - 12, EditorTune.slotSize);
    const queueSizePre = slotSizePre * 0.85 * EditorTune.queueBobbinScale;
    // Split X/Y gaps (with legacy queueGap fallback so existing saved values
    // still work even before the migration runs).
    const gapX = (typeof EditorTune.queueGapX === 'number') ? EditorTune.queueGapX
              : (typeof EditorTune.queueGap === 'number') ? EditorTune.queueGap : 0.72;
    const gapY = (typeof EditorTune.queueGapY === 'number') ? EditorTune.queueGapY
              : (typeof EditorTune.queueGap === 'number') ? EditorTune.queueGap : 0.72;
    const queueSpacingX = queueSizePre * (1 + gapX);
    const queueSpacingY = queueSizePre * (1 + gapY);
    const queueRowsPre = Math.max(1, Math.ceil(QUEUE_VISIBLE_MAX / EditorTune.queueCols));

    // Hoop size is independent of slot/queue offsets — moving the slot row
    // never resizes the hoop or shifts the rail / bobbins.
    const hoopOuter = Math.max(120, Math.min(W * 0.92, H - reservedTop - reservedBottom));

    // slotYOffset / queueYOffset are now independent absolute offsets from the
    // hoop bottom — moving one does NOT move the other.
    const effectiveSlotYOffset = EditorTune.slotYOffset;
    const effectiveQueueYOffset = (EditorTune.queueYOffset || 0);

    // Inner-area target: pixel art reaches just shy of the chevron arrow ring.
    // With default arrowRadiusX=0.36 the arrow ring sits at radius
    //   innerHalf + rim*0.36  →  0.359 × hoopOuter
    // Setting the pixel art half-size to ~0.33 × hoopOuter keeps a small gap so
    // the moving arrows + painted chevrons of rail.png stay visible.
    const PIXEL_ART_HALF_FRAC = 0.33;       // pixel art half-size / hoopOuter
    const RAIL_INNER_FRACTION = PIXEL_ART_HALF_FRAC * 2;  // 0.66
    const innerSize = hoopOuter * RAIL_INNER_FRACTION;
    const rim = (hoopOuter - innerSize) / 2;

    this.hoop.outerHalf = hoopOuter / 2;
    this.hoop.innerHalf = innerSize / 2;
    this.hoop.rim = rim;
    this.hoop.cornerRadius = hoopOuter * 0.08;
    this.hoop.cx = W / 2 + (EditorTune.railOffsetX || 0);
    this.hoop.cy = reservedTop + hoopOuter / 2 + (EditorTune.railOffsetY || 0);

    // Compute the bounding box of non-empty pattern cells, then scale + center
    // the grid so the pixel art FILLS the inner area regardless of pattern size.
    let minR = PATTERN.height, maxR = -1, minC = PATTERN.width, maxC = -1;
    for (let r = 0; r < PATTERN.height; r++) {
      for (let c = 0; c < PATTERN.width; c++) {
        if (PATTERN.cells[r][c]) {
          if (r < minR) minR = r;
          if (r > maxR) maxR = r;
          if (c < minC) minC = c;
          if (c > maxC) maxC = c;
        }
      }
    }
    if (maxR < 0) { minR = 0; maxR = PATTERN.height - 1; minC = 0; maxC = PATTERN.width - 1; }
    const bboxRows = maxR - minR + 1;
    const bboxCols = maxC - minC + 1;
    this.pattern = { minR, maxR, minC, maxC, rows: bboxRows, cols: bboxCols };
    // Pixel-art area is innerSize scaled by user knobs (gridScaleX/Y).
    // The bbox is fitted into that area preserving aspect ratio, then shifted.
    const areaW = innerSize * (EditorTune.gridScaleX || 1.0);
    const areaH = innerSize * (EditorTune.gridScaleY || 1.0);
    this.cellSize = Math.min(areaW / bboxCols, areaH / bboxRows);
    const bboxW = bboxCols * this.cellSize;
    const bboxH = bboxRows * this.cellSize;
    // Offset relative to inner area's top-left (hoop.cx-innerHalf, hoop.cy-innerHalf).
    // Centers the bbox, then adds user shift.
    this.gridOffsetX = (innerSize - bboxW) / 2 + (EditorTune.gridShiftX || 0);
    this.gridOffsetY = (innerSize - bboxH) / 2 + (EditorTune.gridShiftY || 0);

    // Bobbin path uses the SAME ring as arrows so they always line up.
    this.ringHalfX = this.hoop.innerHalf + rim * EditorTune.arrowRadiusX;
    this.ringHalfY = this.hoop.innerHalf + rim * EditorTune.arrowRadiusY;
    this.ringHalf = (this.ringHalfX + this.ringHalfY) / 2;  // legacy alias
    // Bobbin visual size is anchored to hoopOuter (not rim) so it stays readable
    // when the rim shrinks for large patterns.
    this.bobbinSize = Math.max(rim * 0.42, hoopOuter * 0.092);

    // Dump position (negative dumpX = left of center)
    this.dump.x = this.hoop.cx + this.hoop.outerHalf * EditorTune.dumpX;
    this.dump.y = this.hoop.cy + this.hoop.outerHalf * EditorTune.dumpY;

    // Counter "X/5" label right of dump
    this.counter.x = this.dump.x + EditorTune.counterOffsetX;
    this.counter.y = this.dump.y + EditorTune.counterOffsetY;

    // Slot row — anchored under the hoop with its own offset.
    const hoopBottom = this.hoop.cy + this.hoop.outerHalf;
    const slotsY = hoopBottom + effectiveSlotYOffset;
    const slotSize = slotSizePre;
    const slotSpacing = slotSize + 12;
    this.slot.y = slotsY;
    this.slot.size = slotSize;
    this.slot.spacing = slotSpacing;
    this.slot.startX = (W - slotSpacing * 5 + (slotSpacing - slotSize)) / 2 + slotSize / 2 + (EditorTune.slotXOffset || 0);

    // Queue — anchored UNDER THE HOOP independently of slot.y. The 400px
    // baseline preserves the original visual default. queueYOffset is now
    // applied verbatim (no clamp) so the user has full control in the
    // editor — overshoots are visible and recoverable by dragging back.
    this.queue.cols = EditorTune.queueCols;
    this.queue.size = queueSizePre;
    this.queue.spacingX = queueSpacingX;
    this.queue.spacingY = queueSpacingY;
    const QUEUE_BASE_FROM_HOOP = 400;
    this.queue.y = hoopBottom + QUEUE_BASE_FROM_HOOP + effectiveQueueYOffset;
    this.queue.startX = W / 2 - this.queue.spacingX * (this.queue.cols - 1) / 2 + (EditorTune.queueXOffset || 0);
  },

  cellCenter(row, col) {
    const x0 = this.hoop.cx - this.hoop.innerHalf + this.gridOffsetX;
    const y0 = this.hoop.cy - this.hoop.innerHalf + this.gridOffsetY;
    return {
      x: x0 + (col - this.pattern.minC + 0.5) * this.cellSize,
      y: y0 + (row - this.pattern.minR + 0.5) * this.cellSize,
    };
  },

  slotPos(i) {
    return {
      x: this.slot.startX + i * this.slot.spacing,
      y: this.slot.y,
    };
  },

  // Position where a bobbin sits on top of slot i. The slot square stays at
  // slotPos(); only the bobbin gets the EditorTune offset.
  slotBobbinPos(i) {
    const p = this.slotPos(i);
    return {
      x: p.x + (EditorTune.slotBobbinOffsetX || 0),
      y: p.y + (EditorTune.slotBobbinOffsetY || 0),
    };
  },

  queuePos(i, row) {
    // Two signatures supported:
    //   queuePos(i)           — legacy, derives col & row from flat index
    //   queuePos(col, row)    — explicit column & row
    let c, r;
    if (row === undefined) {
      r = Math.floor(i / this.queue.cols);
      c = i % this.queue.cols;
    } else {
      c = i;
      r = row;
    }
    return {
      x: this.queue.startX + c * this.queue.spacingX,
      y: this.queue.y + r * this.queue.spacingY,
    };
  },
};

/* =========================================================================
 *  RailPath — COUNTER-clockwise from 7 o'clock (bottom-left corner)
 * ========================================================================= */
const RailPath = {
  segments: [],
  totalLength: 0,
  // Backward-compat signature: init(cx, cy, half, cr) treats X=Y=half.
  // Asymmetric:               init(cx, cy, halfX, halfY, cr)
  init(cx, cy, halfX, halfYOrCr, crMaybe) {
    let halfY, cr;
    if (crMaybe === undefined) {
      halfY = halfX;
      cr = halfYOrCr;
    } else {
      halfY = halfYOrCr;
      cr = crMaybe;
    }
    this.segments = [];
    const N = PATTERN.width;
    const safeCr = Math.min(cr, Math.min(halfX, halfY) * 0.5);
    const segH = 2 * halfX - 2 * safeCr;   // horizontal (top/bottom) length
    const segV = 2 * halfY - 2 * safeCr;   // vertical (left/right) length
    const arcL = Math.PI * safeCr / 2;
    const c = safeCr;

    // 1) Bottom side going RIGHT
    this.segments.push({
      kind: 'straight', length: segH, side: 'bottom',
      x0: cx - halfX + c, y0: cy + halfY,
      x1: cx + halfX - c, y1: cy + halfY,
      dirAngle: 0,
      N: N,
    });
    // 2) BR corner
    this.segments.push({
      kind: 'arc', length: arcL, side: 'corner',
      ccx: cx + halfX - c, ccy: cy + halfY - c, r: c,
      a0: Math.PI / 2, a1: 0,
    });
    // 3) Right side going UP
    this.segments.push({
      kind: 'straight', length: segV, side: 'right',
      x0: cx + halfX, y0: cy + halfY - c,
      x1: cx + halfX, y1: cy - halfY + c,
      dirAngle: -Math.PI / 2,
      N: N,
    });
    // 4) TR corner
    this.segments.push({
      kind: 'arc', length: arcL, side: 'corner',
      ccx: cx + halfX - c, ccy: cy - halfY + c, r: c,
      a0: 0, a1: -Math.PI / 2,
    });
    // 5) Top side going LEFT
    this.segments.push({
      kind: 'straight', length: segH, side: 'top',
      x0: cx + halfX - c, y0: cy - halfY,
      x1: cx - halfX + c, y1: cy - halfY,
      dirAngle: Math.PI,
      N: N,
    });
    // 6) TL corner
    this.segments.push({
      kind: 'arc', length: arcL, side: 'corner',
      ccx: cx - halfX + c, ccy: cy - halfY + c, r: c,
      a0: -Math.PI / 2, a1: -Math.PI,
    });
    // 7) Left side going DOWN
    this.segments.push({
      kind: 'straight', length: segV, side: 'left',
      x0: cx - halfX, y0: cy - halfY + c,
      x1: cx - halfX, y1: cy + halfY - c,
      dirAngle: Math.PI / 2,
      N: N,
    });
    // 8) BL corner
    this.segments.push({
      kind: 'arc', length: arcL, side: 'corner',
      ccx: cx - halfX + c, ccy: cy + halfY - c, r: c,
      a0: Math.PI, a1: Math.PI / 2,
    });

    this.totalLength = 2 * segH + 2 * segV + 4 * arcL;
  },

  position(t) {
    let d = norm(t) * this.totalLength;
    for (const seg of this.segments) {
      if (d < seg.length) {
        const u = d / seg.length;
        if (seg.kind === 'straight') {
          const x = seg.x0 + u * (seg.x1 - seg.x0);
          const y = seg.y0 + u * (seg.y1 - seg.y0);
          const cellIndex = clamp(Math.floor(u * seg.N), 0, seg.N - 1);
          return { x, y, angle: seg.dirAngle, side: seg.side, cellIndex };
        } else {
          const theta = seg.a0 + u * (seg.a1 - seg.a0);
          const x = seg.ccx + seg.r * Math.cos(theta);
          const y = seg.ccy + seg.r * Math.sin(theta);
          // CCW tangent: rotated 90° CW from radius
          return { x, y, angle: theta - Math.PI / 2, side: 'corner', cellIndex: null };
        }
      }
      d -= seg.length;
    }
    return { x: 0, y: 0, angle: 0, side: 'corner', cellIndex: null };
  },
};

/* =========================================================================
 *  WoolGrid — canvas pixels + visual rendering
 * ========================================================================= */
class WoolGrid {
  constructor(layer) {
    this.layer = layer;
    this.grid = PATTERN.cells.map(row => row.slice()); // deep-ish copy
    this.cellSprites = []; // 2D array of cell Graphics
    this.layerCells = new PIXI.Container();
    this.layerFx = new PIXI.Container();
    layer.addChild(this.layerCells);
    layer.addChild(this.layerFx);

    this._build();
  }

  _build() {
    // Empty cells stay transparent — drawGridBg() tiles fabric knots across
    // the ENTIRE inner area beneath the WoolGrid, so we don't need to draw
    // anything here for null cells.
    for (let r = 0; r < PATTERN.height; r++) {
      const row = [];
      for (let c = 0; c < PATTERN.width; c++) {
        const color = this.grid[r][c];
        const pos = Layout.cellCenter(r, c);
        const node = new PIXI.Container();
        node.x = pos.x; node.y = pos.y;
        if (color) {
          // Solid square underlay — fills cellSize exactly so adjacent cells
          // touch with zero gaps regardless of the sprite's alpha falloff.
          const base = new PIXI.Graphics();
          base.beginFill(WOOL[color].fill);
          // 1.02 to hide sub-pixel rounding seams between cells.
          const s = Layout.cellSize * 1.02;
          base.drawRect(-s/2, -s/2, s, s);
          base.endFill();
          node.addChild(base);
          if (Game.tex?.woolKnot) {
            const sp = new PIXI.Sprite(Game.tex.woolKnot);
            sp.anchor.set(0.5);
            sp.width = sp.height = Layout.cellSize * GRID_WOOL_SPRITE_MULT;
            sp.tint = WOOL[color].fill;
            node.addChild(sp);
          } else {
            const g = new PIXI.Graphics();
            this._drawWoolKnot(g, WOOL[color]);
            node.addChild(g);
          }
        }
        this.layerCells.addChild(node);
        row.push(node);
      }
      this.cellSprites.push(row);
    }
  }

  _drawWoolKnot(g, palette) {
    g.clear();
    const s = Layout.cellSize * 0.42;
    const yarn = Math.max(2, s * 0.58);
    g.beginFill(0x000000, 0.20);
    g.drawEllipse(0, s * 0.18, s * 0.86, s * 0.52);
    g.endFill();
    g.lineStyle({ width: yarn * 1.12, color: palette.dark, alpha: 0.45, cap: PIXI.LINE_CAP.ROUND });
    g.moveTo(-s * 0.78, -s * 0.48); g.lineTo(s * 0.78, s * 0.48);
    g.moveTo(s * 0.78, -s * 0.48);  g.lineTo(-s * 0.78, s * 0.48);
    g.lineStyle({ width: yarn, color: palette.fill, alpha: 1, cap: PIXI.LINE_CAP.ROUND });
    g.moveTo(-s * 0.78, -s * 0.48); g.lineTo(s * 0.78, s * 0.48);
    g.moveTo(s * 0.78, -s * 0.48);  g.lineTo(-s * 0.78, s * 0.48);
  }

  get(r, c) { return this.grid[r]?.[c] ?? null; }

  remainingTotal() {
    let n = 0;
    for (let r = 0; r < PATTERN.height; r++)
      for (let c = 0; c < PATTERN.width; c++)
        if (this.grid[r][c]) n++;
    return n;
  }

  remainingByColor(color) {
    let n = 0;
    for (let r = 0; r < PATTERN.height; r++)
      for (let c = 0; c < PATTERN.width; c++)
        if (this.grid[r][c] === color) n++;
    return n;
  }

  /* Pull wool of `color` from row, scanning from `from` end.
   * Rule: the OUTERMOST non-empty cell in that row from the bobbin's side
   *       must match `color`. If a different color blocks, no pull.
   * Returns {row,col} of pulled cell, or null if none. */
  pullFromRow(color, row, from) {
    if (row < 0 || row >= PATTERN.height) return null;
    const w = PATTERN.width;
    const idxs = from === 'left' ? [...Array(w).keys()] : [...Array(w).keys()].reverse();
    for (const c of idxs) {
      const cell = this.grid[row][c];
      if (cell == null) continue;            // empty cell: keep scanning
      if (cell === color) {                  // matches bobbin color → pull
        this._consume(row, c);
        return { row, col: c };
      }
      return null;                           // different color blocks the path
    }
    return null;
  }
  pullFromCol(color, col, from) {
    if (col < 0 || col >= PATTERN.width) return null;
    const h = PATTERN.height;
    const idxs = from === 'top' ? [...Array(h).keys()] : [...Array(h).keys()].reverse();
    for (const r of idxs) {
      const cell = this.grid[r][col];
      if (cell == null) continue;
      if (cell === color) {
        this._consume(r, col);
        return { row: r, col };
      }
      return null;
    }
    return null;
  }

  _consume(r, c) {
    this.grid[r][c] = null;
    const g = this.cellSprites[r][c];
    g.alpha = 1;
    // pop animation handled by FX layer; just hide it after fx finishes
    g.visible = false;
  }

  /* Set of colors currently exposed at any outermost non-empty cell of any row
   * or column — i.e. colors that COULD be pulled if a matching bobbin reaches
   * the rail. Used to weight queue refills toward useful colors. */
  pullableColors() {
    const set = new Set();
    const H = PATTERN.height, W = PATTERN.width;
    // Rows: scan from left and from right; first non-null cell is the exposed one
    for (let r = 0; r < H; r++) {
      for (let c = 0; c < W; c++) {
        const v = this.grid[r][c];
        if (v) { set.add(v); break; }
      }
      for (let c = W - 1; c >= 0; c--) {
        const v = this.grid[r][c];
        if (v) { set.add(v); break; }
      }
    }
    // Columns: scan from top and from bottom
    for (let c = 0; c < W; c++) {
      for (let r = 0; r < H; r++) {
        const v = this.grid[r][c];
        if (v) { set.add(v); break; }
      }
      for (let r = H - 1; r >= 0; r--) {
        const v = this.grid[r][c];
        if (v) { set.add(v); break; }
      }
    }
    return set;
  }
}

/* =========================================================================
 *  Bobbin — visual + state
 * ========================================================================= */
class Bobbin {
  constructor(color, count) {
    this.color = color;
    this.count = count;
    this.initialCount = count;
    this.id = Bobbin._nextId++;

    this.gfx = new PIXI.Container();
    // Ground shadow sits BELOW everything so it never overlaps the puck face.
    this.shadow = new PIXI.Graphics();
    this.spin = new PIXI.Container();   // rotates with bobbin motion

    // Sprite-based bobbin: pre-rendered 3D stages (0..10 wool rings).
    // Two orientations: UPRIGHT (queue/slot) and LYING (rail).
    if (Game.tex?.bobbinStagesUpright) {
      this.orientation = 'upright';  // current orientation
      this.sprite = new PIXI.Sprite(Game.tex.bobbinStagesUpright[0]);
      this.sprite.anchor.set(0.5);
      this.sprite.tint = WOOL[color].fill;
      this.spin.addChild(this.sprite);
    } else if (Game.tex?.bobbinStages) {
      this.orientation = 'lying';
      this.sprite = new PIXI.Sprite(Game.tex.bobbinStages[0]);
      this.sprite.anchor.set(0.5);
      this.sprite.tint = WOOL[color].fill;
      this.spin.addChild(this.sprite);
    } else {
      this.orientation = 'upright';
      this.base = new PIXI.Graphics();
      this.spool = new PIXI.Graphics();
      this.spin.addChild(this.base);
      this.spin.addChild(this.spool);
    }

    // Label: white fill + thick black outline, no badge background.
    // Sits directly on the bobbin's top face (centered) per reference.
    this.badgeGroup = new PIXI.Container();
    this.label = new PIXI.Text(String(count), {
      fontFamily: '"Luckiest Guy", "Arial Black", "Helvetica Neue", sans-serif',
      fontSize: Math.round(Layout.bobbinSize * 0.55),
      fontWeight: '900',
      fill: 0xffffff,
      stroke: 0x000000,
      strokeThickness: Math.max(3, Math.round(Layout.bobbinSize * 0.10)),
      lineJoin: 'round',
      miterLimit: 2,
    });
    this.label.anchor.set(0.5);
    this.badgeGroup.addChild(this.label);

    this.gfx.addChild(this.shadow);
    this.gfx.addChild(this.spin);
    this.gfx.addChild(this.badgeGroup);

    this.gfx.eventMode = 'static';
    this.gfx.cursor = 'pointer';

    this._scale = 1;
    this._pulseT = 0;

    this.updateVisualStyle();
    this.redraw();
  }

  static _nextId = 1;

  _drawShadow(_isWaiting) {
    // Real shadow is now baked into the Three.js pre-render (ShadowMaterial
    // ground plane in buildBobbinGroup), so the PIXI Graphics ellipse is
    // intentionally a no-op. Kept as a stub so any callers stay valid.
    if (this.shadow) this.shadow.clear();
  }

  _updateLabelStyle() {
    // Keep label readable as bobbinSize changes (re-layout / resize).
    const big = this.count >= 10;
    this.label.style.fontSize = big
      ? Math.round(Layout.bobbinSize * 0.48)
      : Math.round(Layout.bobbinSize * 0.56);
    this.label.style.strokeThickness = Math.max(3, Math.round(Layout.bobbinSize * 0.10));
    this.label.style.fill = 0xffffff;
    this.label.style.stroke = 0x000000;
  }

  updateVisualStyle() {
    const isWaiting = this.orientation !== 'lying';
    // Unified: bobbinIdleScale controls both upright (queue/slot) AND lying
    // (rail) bobbins so a single knob in the editor scales everything. The
    // legacy bobbinSpriteScale survives only as a fallback for older saves.
    const scale = EditorTune.bobbinIdleScale ?? EditorTune.bobbinSpriteScale;
    this.spin.rotation = isWaiting ? deg2rad(EditorTune.bobbinIdleRotationDeg || 0) : 0;
    if (this.sprite) {
      this.sprite.width = this.sprite.height = Layout.bobbinSize * scale;
    }
    this._drawShadow(isWaiting);
    this._updateLabelStyle();
    if (isWaiting) {
       // Center the number on the upright bobbin's top flange.
       // Camera tilt + Y rotation place the visible top face slightly above
       // sprite center; offset upward so the number reads as sitting on top.
       this.badgeGroup.x = 0;
       this.badgeGroup.y = -Layout.bobbinSize * scale * 0.20;
    } else {
       // Rail (lying): per reference, the number sits BELOW the bobbin.
       // The lying camera tilts the bobbin so its body fills roughly the
       // top-center of the sprite; the badge lands just under the sprite.
       this.badgeGroup.x = 0;
       this.badgeGroup.y = Layout.bobbinSize * scale * 0.55;
    }
  }

  redraw() {
    if (this.sprite) {
      // Texture stage updated in _updateStage. Just refresh label.
      this._updateStage();
      this.label.text = String(this.count);
      this._updateLabelStyle();
      return;
    }
    // Procedural fallback (kept for safety; reduced detail)
    const r = Layout.bobbinSize * 0.55;
    const pal = WOOL[this.color];
    const b = this.base;
    b.clear();
    b.beginFill(0x000000, 0.26);
    b.drawEllipse(0, r * 0.50, r * 0.92, r * 0.34);
    b.endFill();
    b.beginFill(pal.fill);
    b.drawCircle(0, 0, r * 0.78);
    b.endFill();
    b.beginFill(pal.dark);
    b.drawCircle(0, 0, r * 0.42);
    b.endFill();
    this._drawSpool();
    this.label.text = String(this.count);
    this._updateLabelStyle();
  }

  _updateStage() {
    if (!this.sprite) return;
    const stagesSet = (this.orientation === 'lying' && Game.tex?.bobbinStages)
      ? Game.tex.bobbinStages
      : (Game.tex?.bobbinStagesUpright || Game.tex?.bobbinStages);
    if (!stagesSet) return;
    const consumed = this.initialCount - this.count;
    const ratio = this.initialCount === 0 ? 0 : consumed / this.initialCount;
    const N = stagesSet.length;
    const idx = clamp(1 + Math.floor(ratio * (N - 1)), 0, N - 1);
    this.sprite.texture = stagesSet[idx];
  }

  setOrientation(o) {
    this.orientation = o;
    this.updateVisualStyle();
    this._updateStage();
  }

  _drawSpool() {
    if (!this.spool) return;
    const r = Layout.bobbinSize * 0.55;
    const consumed = this.initialCount - this.count;
    const t = this.initialCount === 0 ? 0 : consumed / this.initialCount;
    const threadR = lerp(r * 0.20, r * 0.48, clamp(t, 0, 1));
    const pal = WOOL[this.color];
    const s = this.spool;
    s.clear();
    s.beginFill(pal.fill);
    s.drawCircle(0, 0, threadR);
    s.endFill();
  }

  pulse() { this._pulseT = GameTune.visual.pullPulseDuration; }

  update(dt) {
    if (this._pulseT > 0) {
      this._pulseT -= dt;
      const u = clamp(this._pulseT / GameTune.visual.pullPulseDuration, 0, 1);
      // ease pop: peaks at 0.5
      const k = Math.sin(u * Math.PI);
      this._scale = 1 + k * 0.12;
    } else {
      this._scale = lerp(this._scale, 1, 0.2);
    }
    this.gfx.scale.set(this._scale);
  }

  decrement(by = 1) {
    this.count = Math.max(0, this.count - by);
    this._updateStage();
    this._drawSpool();
    this.label.text = String(this.count);
    this._updateLabelStyle();
  }
}

/* =========================================================================
 *  Carrier — visual ">" piece, rides on rail
 * ========================================================================= */
function drawReferenceTrayPlate(g, w, h, alpha = 1) {
  g.clear();

  // Deep side shadow / black outline.
  g.beginFill(0x1d2730, alpha * 0.96);
  g.drawRoundedRect(-w * 0.52, -h * 0.52, w * 0.98, h * 1.04, h * 0.13);
  g.endFill();

  // Dark ribbed body.
  g.beginFill(0x344652, alpha);
  g.drawRoundedRect(-w * 0.50, -h * 0.43, w * 0.78, h * 0.86, h * 0.11);
  g.endFill();

  // Subtle lower lip.
  g.beginFill(0x24323d, alpha * 0.92);
  g.drawRoundedRect(-w * 0.50, h * 0.18, w * 0.78, h * 0.25, h * 0.08);
  g.endFill();

  // Rib highlights, matching the reference stack side.
  for (let i = 0; i < 5; i++) {
    const x = -w * 0.43 + i * w * 0.125;
    g.beginFill(0xe9f0ef, alpha * 0.78);
    g.drawRoundedRect(x, -h * 0.36, w * 0.045, h * 0.73, w * 0.018);
    g.endFill();
    g.beginFill(0x91a4ac, alpha * 0.72);
    g.drawRoundedRect(x + w * 0.036, -h * 0.33, w * 0.018, h * 0.67, w * 0.012);
    g.endFill();
  }

  // Front cap: slanted pale gray face.
  const capX = w * 0.16;
  g.beginFill(0x2a3540, alpha);
  g.drawPolygon([
    capX - w * 0.035, -h * 0.47,
    w * 0.47, -h * 0.34,
    w * 0.47,  h * 0.34,
    capX - w * 0.035, h * 0.47,
  ]);
  g.endFill();

  g.beginFill(0xb7c2c5, alpha);
  g.drawPolygon([
    capX, -h * 0.40,
    w * 0.42, -h * 0.29,
    w * 0.42,  h * 0.29,
    capX, h * 0.40,
  ]);
  g.endFill();

  g.beginFill(0xdbe5e5, alpha * 0.42);
  g.drawPolygon([
    capX + w * 0.035, -h * 0.32,
    w * 0.39, -h * 0.23,
    w * 0.39, -h * 0.03,
    capX + w * 0.035, -h * 0.12,
  ]);
  g.endFill();
}

function createReferenceTrayPlate() {
  // Returns a Container holding a Sprite of the upright tray texture
  // (pre-rendered from model_optimized.glb). Falls back to a flat plate
  // graphic when the texture isn't loaded yet.
  // Sized to Layout.bobbinSize — the caller (Carrier.updateVisualStyle)
  // multiplies by EditorTune.trayIdleScale via container.scale.
  const node = new PIXI.Container();
  const tex = Game.tex?.trayUpright || Game.tex?.tray;
  if (tex) {
    const sp = new PIXI.Sprite(tex);
    sp.anchor.set(0.5);
    sp.width = sp.height = Layout.bobbinSize;
    node.addChild(sp);
  } else {
    const g = new PIXI.Graphics();
    const w = Layout.bobbinSize * 1.52;
    const h = Layout.bobbinSize * 0.72;
    drawReferenceTrayPlate(g, w, h, 1);
    node.addChild(g);
  }
  return node;
}

function drawReferenceTrayStack(container, count) {
  if (!EditorTune.trayDumpVisible || count <= 0) return;
  const tex = Game.tex?.trayUpright || Game.tex?.tray;
  const s = Layout.bobbinSize * EditorTune.trayIdleScale;
  const stack = new PIXI.Container();
  stack.rotation = deg2rad(EditorTune.trayDumpRotationDeg || 0);

  // Soft ground shadow under the whole stack.
  const shadow = new PIXI.Graphics();
  shadow.beginFill(0x000000, 0.26);
  shadow.drawEllipse(0, s * 0.55, s * 0.62, s * 0.18);
  shadow.endFill();
  stack.addChild(shadow);

  // Card-stack: backmost (highest i) rendered first so the foreground (i=0)
  // sits on top z-order. The slot at i=0 is anchored at the dump center
  // (which is where the launching tray spawns from), so we render only the
  // BACK `visible` slots — the FRONT slot empties out first when a tray
  // launches, matching "the front tray flies away" behaviour.
  const total = GameTune.carrier.total;
  const visible = Math.max(0, Math.min(total, count));
  const stackSpacing = 0.18 * (EditorTune.trayStackSpacing ?? 1.0);
  const minI = total - visible;       // highest empty slot index above (e.g. 5−4 = 1: i=0 empty)
  for (let i = total - 1; i >= minI; i--) {
    const off = i * s * stackSpacing;
    if (tex) {
      const sp = new PIXI.Sprite(tex);
      sp.anchor.set(0.5);
      sp.width = sp.height = s;
      sp.x = -off * 0.15;
      sp.y = -off;
      stack.addChild(sp);
    } else {
      // Procedural fallback (pre-load or asset failure).
      const w = s * 1.52, h = s * 0.72;
      const plate = new PIXI.Graphics();
      drawReferenceTrayPlate(plate, w, h, 1 - i * 0.055);
      plate.x = -off * 0.15;
      plate.y = -off;
      stack.addChild(plate);
    }
  }

  container.addChild(stack);
}

class Carrier {
  constructor(orientation = 'upright') {
    this.gfx = new PIXI.Container();
    this.orientation = orientation;
    const texU = Game.tex?.trayUpright || Game.tex?.tray;
    const texL = Game.tex?.trayLying || Game.tex?.tray;
    if (texU || texL) {
      this.upright = createReferenceTrayPlate();
      this.lying = new PIXI.Sprite(texL || texU);
      this.lying.anchor.set(0.5);
      // No PIXI tint: model_optimized.glb has its own painted colors.
      this.lying.tint = 0xffffff;
      this.updateVisualStyle();
      this.upright.alpha = orientation === 'upright' ? 1 : 0;
      this.lying.alpha = orientation === 'lying' ? 1 : 0;
      this.gfx.addChild(this.lying);
      this.gfx.addChild(this.upright);
      this.sprite = orientation === 'upright' ? this.upright : this.lying;
    } else {
      this.body = new PIXI.Graphics();
      this.gfx.addChild(this.body);
      this.redraw();
    }
  }
  refreshTextures() {
    if (!this.upright || !this.lying) return;
    if (Game.tex?.trayLying)   this.lying.texture   = Game.tex.trayLying;
    this.lying.tint = COLOR.trayTint;
    this.updateVisualStyle();
  }
  updateVisualStyle() {
    if (!this.upright || !this.lying) return;
    // Unified: trayIdleScale controls both dump (upright) AND rail (lying)
    // trays. Adjusting "트레이 (대기) 크기" or "트레이 (레일) 크기" both edit
    // the same value now. Legacy trayScale only matters when trayIdleScale
    // is missing on very old saves.
    const lyingSize = Layout.bobbinSize * (EditorTune.trayIdleScale ?? EditorTune.trayScale);
    this.upright.scale.set(EditorTune.trayIdleScale);
    this.lying.width = this.lying.height = lyingSize;
    this.upright.rotation = deg2rad(EditorTune.trayDumpRotationDeg || 0);
    this.lying.rotation = 0;
  }
  setOrientation(orientation, instant = false) {
    if (!this.upright || !this.lying) return;
    this.orientation = orientation;
    this.updateVisualStyle();
    if (instant) {
      this.upright.alpha = orientation === 'upright' ? 1 : 0;
      this.lying.alpha   = orientation === 'lying'   ? 1 : 0;
      this.sprite = orientation === 'upright' ? this.upright : this.lying;
    }
  }
  /* Manually drive cross-fade (0 → fully `from`, 1 → fully `to`). */
  applyFade(from, to, u) {
    if (!this.upright || !this.lying) return;
    const upTarget = (to === 'upright') ? u : (1 - u);
    const lyTarget = (to === 'lying')   ? u : (1 - u);
    this.upright.alpha = (from === 'upright') ? (1 - u) + (to === 'upright' ? u : 0) : upTarget;
    this.lying.alpha   = (from === 'lying')   ? (1 - u) + (to === 'lying'   ? u : 0) : lyTarget;
    if (u >= 1) {
      this.orientation = to;
      this.sprite = (to === 'upright') ? this.upright : this.lying;
    }
  }
  redraw() {
    if (this.upright || this.lying) return;
    // Fallback procedural drawing
    const w = Layout.bobbinSize * 1.45;
    const h = Layout.bobbinSize * 0.78;
    const b = this.body;
    b.clear();
    b.beginFill(COLOR.carrier, 0.95);
    b.drawRoundedRect(-w * 0.50, -h * 0.50, w, h, 5);
    b.endFill();
  }
}
