/* =========================================================================
 *  EditorTool — Unity-style gizmo editor.
 *  Replaces the legacy slider-based UI. Drag in the field to translate / scale /
 *  rotate the selected asset; press W / E / R to switch tool. Selection works
 *  via left panel list OR by clicking the asset directly in the canvas.
 * ========================================================================= */
const EditorTool = {
  mode: 'play',           // 'play' | 'edit'
  selectedId: null,
  gizmoMode: 'select',    // 'select' | 'translate' | 'scale' | 'rotate'
  rotAxis: 'z',           // 'x' | 'y' | 'z' (rotate mode only)
  drag: null,
  gizmoGfx: null,
  assets: null,
  needsRedraw: false,

  init() {
    this.assets = buildEditorAssetRegistry();

    // Gizmo overlay layer
    this.gizmoGfx = new PIXI.Graphics();
    Game.app.stage.addChild(this.gizmoGfx);

    // Top-left mode dropdown
    const modeSel = document.getElementById('app-mode-select');
    const lastMode = localStorage.getItem('wooloop_app_mode') || 'play';
    modeSel.value = lastMode;
    modeSel.addEventListener('change', () => {
      this.setMode(modeSel.value);
      // Drop focus so subsequent W/E/R/Q keystrokes go to the document, not the
      // <select> (which would treat them as option-jump shortcuts).
      modeSel.blur();
    });

    // Asset list
    const listEl = document.getElementById('asset-list');
    listEl.innerHTML = '';
    for (const a of this.assets) {
      const li = document.createElement('li');
      li.dataset.assetId = a.id;
      const tag = a.is3D ? '<span class="tag">3D</span>' : '<span class="tag">2D</span>';
      li.innerHTML = `${a.name}${tag}`;
      li.addEventListener('click', (e) => { e.stopPropagation(); this.select(a.id); });
      listEl.appendChild(li);
    }

    // Gizmo mode buttons (W / E / R)
    document.querySelectorAll('.gizmo-bar button[data-gizmo]').forEach(btn => {
      btn.addEventListener('click', () => this.setGizmoMode(btn.dataset.gizmo));
    });

    // Tool tab bar (map | upload)
    document.querySelectorAll('button[data-tool-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('button[data-tool-tab]').forEach(b =>
          b.classList.toggle('active', b === btn));
        document.querySelectorAll('[data-tool-section]').forEach(sec => {
          sec.hidden = (sec.dataset.toolSection !== btn.dataset.toolTab);
        });
        if (btn.dataset.toolTab === 'map') MapTool.onShow();
      });
    });

    // Save / Reset / Export
    document.getElementById('ed-save').addEventListener('click', async () => {
      // Always write to localStorage so the next reload restores values even
      // when the page is opened directly (file://).
      let local = false;
      try {
        localStorage.setItem('wooloop_editor_tune', JSON.stringify(EditorTune));
        local = true;
      } catch (err) { flashEditorMessage('localStorage 저장 실패: ' + err.message); }

      // Also POST to the dev server so editor_tune.json on disk is updated.
      // That file gets committed to the repo, making the values travel with
      // a `git pull` to other machines. Silently no-ops if the server isn't
      // running (e.g. page opened via file://).
      let file = false;
      try {
        const res = await fetch('/save-editor-tune', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(EditorTune),
        });
        file = res.ok;
      } catch (_) { /* no server */ }

      if (file)       flashEditorMessage('저장됨 ✓ (파일 + localStorage)');
      else if (local) flashEditorMessage('저장됨 ✓ (localStorage only)');
    });
    document.getElementById('ed-reset').addEventListener('click', () => {
      if (!confirm('모든 값을 기본값으로 되돌립니다. 진행할까요?')) return;
      localStorage.removeItem('wooloop_editor_tune');
      Object.assign(EditorTune, EDITOR_DEFAULTS);
      // Object.assign copies the array reference; detach so future edits don't
      // mutate EDITOR_DEFAULTS.layerOrder.
      EditorTune.layerOrder = DEFAULT_LAYER_ORDER.slice();
      applyAllEditorChanges();
      this.refreshInspector();
      flashEditorMessage('기본값 복원 ✓');
    });
    document.getElementById('ed-export').addEventListener('click', async () => {
      const json = JSON.stringify(EditorTune, null, 2);
      try {
        await navigator.clipboard.writeText(json);
        flashEditorMessage('JSON 복사됨 ✓');
      } catch (err) { prompt('JSON (복사하세요):', json); }
    });
    document.getElementById('ed-build-stage').addEventListener('click', () =>
      this.buildStageHTML());

    // Keyboard
    window.addEventListener('keydown', (e) => this.onKey(e));

    // Pointer events on canvas — captured at window level so we run before
    // any sprite-level pixi listeners (we cancel default & stopPropagation in
    // edit mode so game clicks like onClickQueue don't fire).
    const view = Game.app.view;
    view.addEventListener('pointerdown', (e) => this.onPointerDown(e), true);
    window.addEventListener('pointermove', (e) => this.onPointerMove(e));
    window.addEventListener('pointerup', (e) => this.onPointerUp(e));

    // Redraw gizmo each frame (assets move with rail bobbins / layout changes).
    Game.app.ticker.add(() => {
      if (this.mode === 'edit') this.drawGizmo();
    });

    // Apply initial mode (also wires body.editor-mode class)
    this.setMode(lastMode);
  },

  setMode(m) {
    this.mode = m;
    document.body.classList.toggle('editor-mode', m === 'edit');
    localStorage.setItem('wooloop_app_mode', m);
    // Disable PIXI sprite interactivity in edit mode so clicks on bobbins/slots
    // don't fire game actions (launch / pick) while the user is trying to
    // select & drag them. Re-enable when returning to play.
    if (Game?.app?.stage) {
      Game.app.stage.eventMode = m === 'edit' ? 'none' : 'auto';
    }
    if (m === 'play') {
      this.gizmoGfx.clear();
      this._removePreviewRail();
      // Resume the game when leaving the editor.
      if (Game) Game.paused = false;
    } else {
      // Auto-pause + drop a preview bobbin/tray on the rail so the user can
      // tune rail-state values (trayScale, bobbinSpriteScale, rotations, ...)
      // without having to actually launch.
      if (Game) Game.paused = true;
      this._ensurePreviewRail();
      this.refreshInspector();
    }
  },

  _ensurePreviewRail() {
    if (!Game?.rail || Game.rail.length > 0) return;       // already have a real rider
    if (typeof Bobbin === 'undefined' || typeof Carrier === 'undefined') return;
    if (typeof spawnRailEntry !== 'function') return;
    try {
      const bb = new Bobbin('blue', 40);
      Game.layers.bobbin.addChild(bb.gfx);
      const cr = new Carrier('lying');
      Game.layers.carrier.addChild(cr.gfx);
      spawnRailEntry(cr, bb, 0.25);                        // bottom-right of rail
      const entry = Game.rail[Game.rail.length - 1];
      if (entry) entry.preview = true;
    } catch (err) { /* preview is best-effort */ }
  },

  _removePreviewRail() {
    if (!Game?.rail) return;
    for (let i = Game.rail.length - 1; i >= 0; i--) {
      const e = Game.rail[i];
      if (!e?.preview) continue;
      if (e.bobbin?.gfx?.parent)  e.bobbin.gfx.parent.removeChild(e.bobbin.gfx);
      if (e.carrier?.gfx?.parent) e.carrier.gfx.parent.removeChild(e.carrier.gfx);
      Game.rail.splice(i, 1);
    }
  },

  togglePause() {
    if (!Game) return;
    Game.paused = !Game.paused;
    flashEditorMessage?.(Game.paused ? '⏸  일시정지' : '▶  재생');
  },

  setGizmoMode(m) {
    this.gizmoMode = m;
    document.querySelectorAll('.gizmo-bar button[data-gizmo]').forEach(b =>
      b.classList.toggle('active', b.dataset.gizmo === m));
    this.refreshInspector();
  },

  select(id) {
    this.selectedId = id;
    document.querySelectorAll('#asset-list li').forEach(li =>
      li.classList.toggle('selected', li.dataset.assetId === id));
    this.refreshInspector();
  },

  getAsset(id) { return this.assets.find(a => a.id === id); },

  onKey(e) {
    const tagAny = e.target?.tagName;
    if (tagAny === 'INPUT' || tagAny === 'TEXTAREA') return;
    // Pause shortcut works in BOTH modes so the user can freeze a play
    // session for inspection without first entering the editor.
    if (e.code === 'Space') { this.togglePause(); e.preventDefault(); return; }
    if (this.mode !== 'edit') return;
    const tag = e.target?.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    // Use e.code (physical key) so the shortcuts still fire under 한글 IME
    // where e.key would be 'ㅂ' / 'ㅈ' / 'ㄷ' / 'ㄱ'.
    switch (e.code) {
      case 'KeyQ': this.setGizmoMode('select'); e.preventDefault(); break;
      case 'KeyW': this.setGizmoMode('translate'); e.preventDefault(); break;
      case 'KeyE': this.setGizmoMode('scale'); e.preventDefault(); break;
      case 'KeyR': this.setGizmoMode('rotate'); e.preventDefault(); break;
      case 'Escape': this.select(null); break;
    }
  },

  hitTest(x, y) {
    // Prefer the smaller asset when multiple bounds overlap (foreground wins).
    let bestId = null;
    let bestArea = Infinity;
    for (const a of this.assets) {
      let b;
      try { b = a.bounds(); } catch (e) { continue; }
      if (!b || !isFinite(b.x)) continue;
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
        const area = b.w * b.h;
        if (area < bestArea) { bestArea = area; bestId = a.id; }
      }
    }
    return bestId;
  },

  // Hit-test the directional arrow handles drawn in translate-mode gizmo.
  // Returns 'x' if the red horizontal arrow was grabbed, 'y' for green vertical, or null.
  hitGizmoHandle(x, y) {
    if (this.mode !== 'edit' || this.gizmoMode !== 'translate' || !this.selectedId) return null;
    const a = this.getAsset(this.selectedId);
    if (!a || !a.bindings.pos) return null;
    let b; try { b = a.bounds(); } catch (_) { return null; }
    if (!b) return null;
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    const PAD = 9;
    // Red X arrow: cx..cx+50 horizontal
    if (a.bindings.pos.xKey &&
        x >= cx - 4 && x <= cx + 55 &&
        y >= cy - PAD && y <= cy + PAD) return 'x';
    // Green Y arrow: cy..cy-50 vertical
    if (a.bindings.pos.yKey &&
        x >= cx - PAD && x <= cx + PAD &&
        y >= cy - 55 && y <= cy + 4) return 'y';
    return null;
  },

  // Hit-test the Unity-style rotation rings (red X / green Y / blue Z).
  // Returns the axis whose ring outline is closest to the pointer (within tol).
  hitRotRing(x, y) {
    if (this.mode !== 'edit' || this.gizmoMode !== 'rotate' || !this.selectedId) return null;
    const a = this.getAsset(this.selectedId);
    if (!a || !a.bindings.rot) return null;
    let b; try { b = a.bounds(); } catch (_) { return null; }
    if (!b) return null;
    const { cx, cy, r } = this.rotRingGeom(b);
    const dx = x - cx, dy = y - cy;
    const TOL = 10;
    // Distance from point to ellipse outline (approximate, scaled by min radius).
    const distEll = (rx, ry) => {
      if (rx <= 0 || ry <= 0) return Infinity;
      const v = Math.sqrt((dx / rx) ** 2 + (dy / ry) ** 2);
      return Math.abs(v - 1) * Math.min(rx, ry);
    };
    const rThin = r * 0.28;
    const dX = distEll(rThin, r);   // vertical thin ellipse  → X axis
    const dY = distEll(r, rThin);   // horizontal thin ellipse → Y axis
    const dZ = distEll(r, r);       // full circle             → Z axis
    let best = null, bestD = TOL;
    if (a.bindings.rot.xKey && dX < bestD) { bestD = dX; best = 'x'; }
    if (a.bindings.rot.yKey && dY < bestD) { bestD = dY; best = 'y'; }
    if (a.bindings.rot.zKey && dZ < bestD) { bestD = dZ; best = 'z'; }
    return best;
  },

  rotRingGeom(b) {
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    const r = Math.max(60, Math.min(b.w, b.h) * 0.72);
    return { cx, cy, r };
  },

  toCanvasCoords(clientX, clientY) {
    const rect = Game.app.view.getBoundingClientRect();
    return { x: clientX - rect.left, y: clientY - rect.top };
  },

  onPointerDown(e) {
    if (this.mode !== 'edit') return;
    // Ignore clicks that originated in editor UI panels.
    if (e.target.closest && e.target.closest('#editor-shell, #tool-shell, #editor-mode-bar')) return;
    e.preventDefault();
    e.stopPropagation();
    const { x, y } = this.toCanvasCoords(e.clientX, e.clientY);

    // SELECT mode (Q): click changes selection, no drag.
    if (this.gizmoMode === 'select') {
      const hitId = this.hitTest(x, y);
      this.select(hitId);  // null hit = deselect
      return;
    }

    // W/E/R: drag the currently-selected asset. Clicking another object does
    // NOT change selection (the user must press Q to re-pick).
    // Translate-mode arrow handles and rotate-mode rings hijack the drag to
    // lock to a specific axis (Unity-style).
    const handleAxis = this.hitGizmoHandle(x, y);
    const ringAxis = this.hitRotRing(x, y);
    if (ringAxis) {
      this.rotAxis = ringAxis;
      this.refreshInspector();  // reflect the active axis in the inspector buttons
    }
    if (!this.selectedId) return;

    const a = this.getAsset(this.selectedId);
    if (!a) return;
    const b = (() => { try { return a.bounds(); } catch (_) { return null; } })();
    const cx = b ? b.x + b.w / 2 : x;
    const cy = b ? b.y + b.h / 2 : y;
    const snap = {};
    const collect = (binding) => {
      if (!binding) return;
      for (const k of ['xKey','yKey','uKey','zKey']) {
        const key = binding[k];
        if (key && key in EditorTune) snap[key] = EditorTune[key];
      }
    };
    collect(a.bindings.pos);
    collect(a.bindings.scale);
    collect(a.bindings.rot);

    this.drag = {
      asset: a,
      mode: this.gizmoMode,
      axis: this.rotAxis,
      shiftAtStart: e.shiftKey,
      // For translate mode: axisLock locks movement to one axis.
      //   - 'x' or 'y' if the user grabbed a directional arrow handle
      //   - resolved on first move if shiftAtStart === true (dominant-axis lock)
      axisLock: handleAxis,
      axisLockPending: !handleAxis && e.shiftKey,
      startX: x, startY: y,
      centerX: cx, centerY: cy,
      startRadius: Math.max(8, Math.hypot(x - cx, y - cy)),
      startAngle: Math.atan2(y - cy, x - cx),
      snap,
    };
  },

  onPointerMove(e) {
    if (!this.drag) return;
    e.preventDefault();
    const { x, y } = this.toCanvasCoords(e.clientX, e.clientY);
    const d = this.drag;
    const a = d.asset;
    const dx = x - d.startX, dy = y - d.startY;

    if (d.mode === 'translate' && a.bindings.pos) {
      const p = a.bindings.pos;
      // Resolve a pending shift-lock as soon as the user moves meaningfully.
      if (d.axisLockPending && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
        d.axisLock = Math.abs(dx) >= Math.abs(dy) ? 'x' : 'y';
        d.axisLockPending = false;
      }
      const canX = (!d.axisLock || d.axisLock === 'x') && p.xKey != null;
      const canY = (!d.axisLock || d.axisLock === 'y') && p.yKey != null;
      if (canX) {
        const sx = typeof p.xScale === 'function' ? p.xScale() : (p.xScale || 1);
        this.setKey(p.xKey, d.snap[p.xKey] + dx * sx);
      }
      if (canY) {
        const sy = typeof p.yScale === 'function' ? p.yScale() : (p.yScale || 1);
        this.setKey(p.yKey, d.snap[p.yKey] + dy * sy);
      }
    } else if (d.mode === 'scale' && a.bindings.scale) {
      const s = a.bindings.scale;
      const uniform = e.shiftKey || (!s.xKey && !s.yKey && s.uKey);
      // Linear pixel-based scaling. Drag right or up = grow, left or down = shrink.
      // 200px of drag in a direction = factor 2 (= +100% of initial value).
      const PER_PX = 0.005;
      const uniformDelta = (dx - dy) * PER_PX;  // right + up = positive
      const factorU = Math.max(0.05, 1 + uniformDelta);
      const factorX = Math.max(0.05, 1 + dx * PER_PX);
      const factorY = Math.max(0.05, 1 - dy * PER_PX);  // up = grow
      if (uniform) {
        if (s.uKey) this.setKey(s.uKey, this.clampScale(s.uKey, d.snap[s.uKey] * factorU));
        else {
          if (s.xKey) this.setKey(s.xKey, this.clampScale(s.xKey, d.snap[s.xKey] * factorU));
          if (s.yKey) this.setKey(s.yKey, this.clampScale(s.yKey, d.snap[s.yKey] * factorU));
        }
      } else {
        if (s.xKey) this.setKey(s.xKey, this.clampScale(s.xKey, d.snap[s.xKey] * factorX));
        if (s.yKey) this.setKey(s.yKey, this.clampScale(s.yKey, d.snap[s.yKey] * factorY));
        if (s.uKey && !s.xKey && !s.yKey) {
          this.setKey(s.uKey, this.clampScale(s.uKey, d.snap[s.uKey] * factorU));
        }
      }
    } else if (d.mode === 'rotate' && a.bindings.rot) {
      const r = a.bindings.rot;
      const axis = this.rotAxis;
      const tgt = axis === 'x' ? r.xKey : axis === 'y' ? r.yKey : r.zKey;
      if (!tgt) return;
      let newDeg;
      if (axis === 'z') {
        const cur = Math.atan2(y - d.centerY, x - d.centerX);
        const dAng = cur - d.startAngle;
        newDeg = d.snap[tgt] + dAng * 180 / Math.PI;
      } else {
        const delta = axis === 'x' ? -dy : dx;
        newDeg = d.snap[tgt] + delta * 0.6; // 0.6° per pixel
      }
      while (newDeg > 180) newDeg -= 360;
      while (newDeg < -180) newDeg += 360;
      // Apply live for all axes; 3D re-renders are throttled by the pending
      // queue inside reRenderBobbinsY / reRenderTrayY, so dragging stays smooth.
      this.setKey(tgt, newDeg);
    }
  },

  onPointerUp() {
    if (!this.drag) return;
    this.drag = null;
    this.refreshInspector();
  },

  setKey(key, value, opt = {}) {
    EditorTune[key] = value;
    // Live-update inspector input if not currently being typed in.
    const input = document.querySelector(`#inspector input[data-key="${key}"]`);
    if (input && document.activeElement !== input) {
      input.value = this.formatValueRaw(key, value);
    }
    if (opt.defer3D) return;
    applyEditorChange(key);
    if (this.is3DRotKey(key)) {
      const a = this.getAsset(this.selectedId);
      this.apply3DReRender(a);
    }
  },

  is3DRotKey(key) {
    return ['bobbinXRotationDeg','bobbinYRotationDeg','bobbinIdleXRotationDeg','bobbinIdleYRotationDeg',
            'trayYRotationDeg','trayIdleYRotationDeg','trayTiltDeg','trayIdleXRotationDeg',
            'trayThickness','trayIdleZRotationDeg3D',
            'bobbinBarrelR','bobbinFlangeTopH','bobbinFlangeBottomH',
            'bobbinRailBarrelR','bobbinRailFlangeTopH','bobbinRailFlangeBottomH'].includes(key);
  },

  apply3DReRender(asset) {
    if (!asset) return;
    if (asset.id === 'bobbinIdle' || asset.id === 'bobbinRail') {
      reRenderBobbinsY(EditorTune.bobbinYRotationDeg, EditorTune.bobbinIdleYRotationDeg);
    } else if (asset.id === 'trayIdle' || asset.id === 'trayRail') {
      reRenderTrayY(EditorTune.trayYRotationDeg, EditorTune.trayTiltDeg, EditorTune.trayIdleYRotationDeg);
    }
  },

  clampScale(key, v) {
    if (key === 'arrowCount') return Math.max(8, Math.min(48, Math.round(v)));
    if (key === 'queueCols') return Math.max(2, Math.min(6, Math.round(v)));
    if (key === 'slotSize') return Math.max(40, Math.min(140, v));
    if (key === 'counterFontSize') return Math.max(14, Math.min(48, v));
    if (key === 'queueGap') return Math.max(0, Math.min(2, v));
    if (key === 'arrowSize') return Math.max(0.05, Math.min(0.8, v));
    if (key === 'arrowSecPerLap') return Math.max(0.5, v);
    if (key === 'arrowHideStart' || key === 'arrowHideEnd') return Math.max(0, Math.min(1, v));
    if (key === 'trayDumpVisible') return v >= 0.5 ? 1 : 0;
    // Color: 24-bit int 0..0xFFFFFF.
    if (key === 'gridBgColor' || key === 'gridFabricColor') return Math.max(0, Math.min(0xFFFFFF, Math.round(v)));
    if (key === 'gridBgAlpha' || key === 'gridFabricAlpha') return Math.max(0, Math.min(1, v));
    // Free-form offsets and angles: no lower clamp.
    if (/Offset[XY]?$|RotationDeg$|TiltDeg$|^dump[XY]$|^gridShift/.test(key)) return v;
    return Math.max(0.05, v);
  },

  formatValueRaw(key, v) {
    if (key === 'arrowCount' || key === 'queueCols' || key === 'trayDumpVisible') return String(Math.round(v));
    if (key.endsWith('Deg')) return v.toFixed(1);
    if (typeof v === 'number') return v.toFixed(3);
    return String(v);
  },

  /* Bake the current EditorTune + PATTERN into the HTML and download.
   * Mirrors MapTool.buildHTML's approach: fetch the live page source, rewrite
   * the EDITOR_TUNE_OVERRIDE and PATTERN_OVERRIDE constant declarations, and
   * trigger a Blob download. Anyone opening the resulting file gets the
   * exact stage the editor is showing now — no localStorage / json needed. */
  async buildStageHTML() {
    try {
      const src = await fetch(location.href, { cache: 'no-store' }).then(r => r.text());

      // Editor values
      const tuneJson = JSON.stringify(EditorTune, null, 2);
      const tuneLine = `const EDITOR_TUNE_OVERRIDE = ${tuneJson};`;
      let next = src.replace(/const EDITOR_TUNE_OVERRIDE\s*=\s*[^;]+;/, tuneLine);
      if (next === src) {
        flashEditorMessage('소스에서 EDITOR_TUNE_OVERRIDE 위치 못 찾음');
        return;
      }

      // Current pattern (so the stage layout matches what's on screen)
      const patternJson = JSON.stringify({
        width: PATTERN.width,
        height: PATTERN.height,
        cells: PATTERN.cells,
      });
      const patternLine = `const PATTERN_OVERRIDE = ${patternJson};`;
      next = next.replace(/const PATTERN_OVERRIDE\s*=\s*[^;]+;/, patternLine);

      const blob = new Blob([next], { type: 'text/html' });
      const a = document.createElement('a');
      const ts = new Date().toISOString().replace(/[-:T.Z]/g, '').slice(0, 14);
      a.href = URL.createObjectURL(blob);
      a.download = `wooloop_stage_${PATTERN.width}x${PATTERN.height}_${ts}.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      flashEditorMessage(`스테이지 HTML 다운로드됨 ✓  (${a.download})`);
    } catch (err) {
      flashEditorMessage('빌드 실패: ' + err.message);
    }
  },

  // ===== Inspector =====
  refreshInspector() {
    const ins = document.getElementById('inspector');
    if (!ins) return;
    const a = this.getAsset(this.selectedId);
    if (!a) {
      ins.innerHTML = '<div class="empty">에셋을 선택하세요</div>';
      return;
    }
    const sections = [];
    sections.push(`<div class="field-title">${a.name} ${a.is3D ? '· 3D' : '· 2D'}</div>`);
    // Prefab-style assets: one template controls every instance at runtime.
    const PREFAB_HINT = {
      bobbinIdle: '대기 중인 모든 보빈(큐 + 슬롯)이 이 한 개의 프리펩 값을 공유합니다.',
      bobbinRail: '레일 위의 모든 보빈이 이 한 개의 프리펩 값을 공유합니다.',
      trayIdle:   '덤프에 쌓인 모든 트레이가 이 한 개의 프리펩 값을 공유합니다.',
      trayRail:   '레일 위의 모든 트레이가 이 한 개의 프리펩 값을 공유합니다.',
      slot:       '5개 슬롯이 같은 크기/Y 오프셋 값을 공유합니다.',
      queue:      '큐의 모든 보빈 셀이 같은 배율 / Y 오프셋을 공유합니다.',
    };
    if (PREFAB_HINT[a.id]) {
      sections.push(`<div class="hint" style="background:#1c2530;padding:6px 8px;border-radius:5px;color:#aac">📦 ${PREFAB_HINT[a.id]}</div>`);
    }

    const renderGroup = (title, binding, axes) => {
      if (!binding) return;
      const rows = axes.map(ax => {
        const key = binding[ax.bindingKey];
        const enabled = !!key;
        const axisClass = ax.axisName.toLowerCase();
        const v = enabled ? this.formatValueRaw(key, EditorTune[key]) : '–';
        return `<div class="field-row">
          <span class="axis ${axisClass}">${ax.axisName}</span>
          <input type="number" step="${ax.step}" data-key="${key || ''}" value="${v}" ${enabled ? '' : 'disabled'} class="${enabled ? '' : 'disabled'}">
        </div>`;
      }).join('');
      sections.push(`<div class="field-group"><div class="field-title">${title}</div>${rows}</div>`);
    };

    renderGroup('이동 (W)', a.bindings.pos, [
      { axisName: 'X', bindingKey: 'xKey', step: 1 },
      { axisName: 'Y', bindingKey: 'yKey', step: 1 },
    ]);
    if (a.bindings.pos) {
      sections.push(`<div class="field-group" style="margin-top:-2px"><button data-reset-pos="1" style="background:#404a55;color:#fff;border:0;border-radius:4px;padding:5px 9px;font-size:10.5px;cursor:pointer">↺ 위치 리셋</button></div>`);
    }
    if (a.bindings.scale) {
      const s = a.bindings.scale;
      const axes = s.uKey && !s.xKey && !s.yKey
        ? [{ axisName: 'U', bindingKey: 'uKey', step: 0.05 }]
        : [
            { axisName: 'X', bindingKey: 'xKey', step: 0.05 },
            { axisName: 'Y', bindingKey: 'yKey', step: 0.05 },
          ];
      renderGroup('크기 (E)', s, axes);
    }
    if (a.bindings.rot) {
      renderGroup('회전 (R) · °', a.bindings.rot, [
        { axisName: 'X', bindingKey: 'xKey', step: 1 },
        { axisName: 'Y', bindingKey: 'yKey', step: 1 },
        { axisName: 'Z', bindingKey: 'zKey', step: 1 },
      ]);
      // Rotation axis selector
      sections.push(`<div class="field-group">
        <div class="field-title">회전축 선택</div>
        <div class="gizmo-bar">
          <button data-rot-axis="x" class="${this.rotAxis === 'x' ? 'active' : ''}">X</button>
          <button data-rot-axis="y" class="${this.rotAxis === 'y' ? 'active' : ''}">Y</button>
          <button data-rot-axis="z" class="${this.rotAxis === 'z' ? 'active' : ''}">Z</button>
        </div>
      </div>`);
    }
    // Extra / miscellaneous properties for this asset (arrowSize, queueCols, ...)
    if (a.bindings.extra && a.bindings.extra.length) {
      const rows = a.bindings.extra.map(ext => {
        const v = EditorTune[ext.key];
        // Color picker: render <input type="color"> with the value as #RRGGBB.
        if (ext.type === 'color') {
          const intVal = (typeof v === 'number') ? (v | 0) : 0x000000;
          const hex = '#' + intVal.toString(16).padStart(6, '0');
          return `<div class="field-row" style="grid-template-columns: 1fr 80px">
            <label style="font-size:10.5px;color:#bcd">${ext.label}</label>
            <input type="color" data-key="${ext.key}" data-extra="1" value="${hex}" style="height:24px;padding:0;border:1px solid #3a4a5a;background:#1f262d">
          </div>`;
        }
        const step = ext.step ?? 0.05;
        const min = ext.min != null ? ` min="${ext.min}"` : '';
        const max = ext.max != null ? ` max="${ext.max}"` : '';
        const display = ext.int ? Math.round(v) : (typeof v === 'number' ? v.toFixed(3).replace(/\.?0+$/, '') : v);
        return `<div class="field-row" style="grid-template-columns: 1fr 80px">
          <label style="font-size:10.5px;color:#bcd">${ext.label}</label>
          <input type="number" step="${step}"${min}${max} data-key="${ext.key}" data-extra="1" value="${display}">
        </div>`;
      }).join('');
      sections.push(`<div class="field-group"><div class="field-title">기타 속성</div>${rows}</div>`);
    }

    // Layer priority — reorders the Game.layers this asset lives in.
    const layerKey = ASSET_LAYER_OF[a.id];
    if (layerKey) {
      const order = Array.isArray(EditorTune.layerOrder) && EditorTune.layerOrder.length
        ? EditorTune.layerOrder
        : DEFAULT_LAYER_ORDER;
      const pos = order.indexOf(layerKey);
      const layerName = LAYER_NAMES_KO[layerKey] || layerKey;
      const total = order.length;
      // Higher index = on top. "위로" promotes the layer (toward foreground).
      const upDisabled = pos < 0 || pos >= total - 1;
      const downDisabled = pos <= 0;
      const sharedHint = (a.id === 'arrows' || a.id === 'bobbinIdle' || a.id === 'bobbinRail' ||
                         a.id === 'queue' || a.id === 'counter' || a.id === 'trayIdle')
        ? `<div class="hint" style="margin-top:4px;font-size:10px;color:#889">같은 레이어(${layerName})의 다른 객체도 함께 이동합니다.</div>`
        : '';
      sections.push(`<div class="field-group">
        <div class="field-title">레이어 우선순위</div>
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
          <span style="flex:1;font-size:11px;color:#dfe">${layerName}
            <span style="color:#8a9">· ${pos + 1}/${total} (위가 앞)</span>
          </span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px">
          <button data-layer-step="-1" ${downDisabled ? 'disabled' : ''}
            style="background:#404a55;color:#fff;border:0;border-radius:4px;padding:6px;font-size:11.5px;cursor:${downDisabled ? 'not-allowed' : 'pointer'};opacity:${downDisabled ? 0.45 : 1}">▼ 아래로</button>
          <button data-layer-step="1" ${upDisabled ? 'disabled' : ''}
            style="background:#404a55;color:#fff;border:0;border-radius:4px;padding:6px;font-size:11.5px;cursor:${upDisabled ? 'not-allowed' : 'pointer'};opacity:${upDisabled ? 0.45 : 1}">▲ 위로</button>
        </div>${sharedHint}
      </div>`);
    }

    // Help hint
    const hints = [];
    if (this.gizmoMode === 'select') hints.push('객체 클릭으로 선택 (Q 모드). W·E·R로 도구 전환');
    else if (this.gizmoMode === 'translate' && a.bindings.pos) hints.push('드래그: 이동 · 화살표 핸들 또는 Shift+드래그: 한 방향 고정');
    else if (this.gizmoMode === 'scale' && a.bindings.scale) hints.push('드래그: 크기 · Shift+드래그: 비율 고정');
    else if (this.gizmoMode === 'rotate' && a.bindings.rot) hints.push('빨강(X) · 초록(Y) · 파랑(Z) 링을 잡아 드래그 (또는 X/Y/Z 버튼으로 축 선택)');
    else hints.push('이 도구는 이 에셋에 사용할 수 없습니다 (W/E/R 중 다른 도구로 전환)');
    sections.push(`<div class="hint">${hints.join(' · ')}</div>`);

    ins.innerHTML = sections.join('');

    // Hook number + color inputs.
    //
    // Both event types apply changes live so the user sees the effect
    // immediately while typing or sliding a color picker — no blur, Enter,
    // or refresh required.
    //   • 'input'  fires on every keystroke (numbers) or every drag pixel
    //              (color). We commit to EditorTune + applyEditorChange so
    //              the visual updates in real time.
    //   • 'change' fires on blur / Enter / spin button. We still listen so
    //              clamping (e.g. min/max) re-renders the input field, and
    //              so the final committed value matches what the user sees.
    // Skipping the 'input' path for numbers (the old behaviour) made many
    // knobs feel like they only applied "on refresh", which is the bug
    // we're fixing here.
    const parseInputValue = (inp) => {
      if (inp.type === 'color') {
        return parseInt(inp.value.replace('#', ''), 16);
      }
      // Allow partial values like "-" or "0." mid-typing without crashing
      // — parseFloat returns NaN which we skip below.
      return parseFloat(inp.value);
    };
    const commitInput = (inp, key, source) => {
      const raw = parseInputValue(inp);
      if (!Number.isFinite(raw)) return;
      EditorTune[key] = this.clampScale(key, raw);
      applyEditorChange(key);
      if (this.is3DRotKey(key)) this.apply3DReRender(this.getAsset(this.selectedId));
      // On 'change' the field may have been clamped, but the visible input
      // still shows the raw user-typed value. Sync it back so the user sees
      // the clamped result (and isn't surprised when re-opening the inspector).
      if (source === 'change' && inp.type !== 'color' && document.activeElement !== inp) {
        inp.value = this.formatValueRaw(key, EditorTune[key]);
      }
    };
    ins.querySelectorAll('input[data-key]').forEach(inp => {
      const key = inp.dataset.key;
      if (!key) return;
      inp.addEventListener('input',  () => commitInput(inp, key, 'input'));
      inp.addEventListener('change', () => commitInput(inp, key, 'change'));
    });
    // Axis buttons
    ins.querySelectorAll('button[data-rot-axis]').forEach(btn => {
      btn.addEventListener('click', () => {
        this.rotAxis = btn.dataset.rotAxis;
        this.refreshInspector();
      });
    });
    // Position reset
    ins.querySelectorAll('button[data-reset-pos]').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = a.bindings.pos;
        if (!p) return;
        for (const k of ['xKey','yKey']) {
          const key = p[k];
          if (key && key in EDITOR_DEFAULTS) {
            EditorTune[key] = EDITOR_DEFAULTS[key];
            applyEditorChange(key);
          }
        }
        this.refreshInspector();
        flashEditorMessage(`${a.name} 위치 기본값 복원`);
      });
    });
    // Layer up/down — swap the asset's layer with its neighbour in EditorTune.
    ins.querySelectorAll('button[data-layer-step]').forEach(btn => {
      btn.addEventListener('click', () => {
        const lk = ASSET_LAYER_OF[a.id];
        if (!lk) return;
        const step = parseInt(btn.dataset.layerStep, 10);  // +1 = up (toward top)
        const order = (Array.isArray(EditorTune.layerOrder) && EditorTune.layerOrder.length
          ? EditorTune.layerOrder
          : DEFAULT_LAYER_ORDER).slice();
        const i = order.indexOf(lk);
        const j = i + step;
        if (i < 0 || j < 0 || j >= order.length) return;
        [order[i], order[j]] = [order[j], order[i]];
        EditorTune.layerOrder = order;
        applyLayerOrder();
        this.refreshInspector();
        const dir = step > 0 ? '위로' : '아래로';
        flashEditorMessage(`${LAYER_NAMES_KO[lk] || lk} 레이어 ${dir} 이동`);
      });
    });
  },

  // ===== Gizmo overlay =====
  drawGizmo() {
    const g = this.gizmoGfx;
    g.clear();
    // Faint outlines on ALL editable assets so the user can see what's
    // pickable in the scene (Unity-style).
    for (const asset of this.assets) {
      if (asset.id === this.selectedId) continue;
      let r; try { r = asset.bounds(); } catch (_) { continue; }
      if (!r || !isFinite(r.x)) continue;
      g.lineStyle(1, 0xffffff, 0.22);
      g.drawRect(r.x, r.y, r.w, r.h);
    }
    if (!this.selectedId) return;
    const a = this.getAsset(this.selectedId);
    if (!a) return;
    let b;
    try { b = a.bounds(); } catch (_) { return; }
    if (!b) return;
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    // Bounding rect
    g.lineStyle(2, 0x82c8ff, 0.9);
    g.drawRect(b.x, b.y, b.w, b.h);
    // Center dot
    g.beginFill(0x82c8ff, 0.9);
    g.drawCircle(cx, cy, 3.5);
    g.endFill();
    // Mode-specific
    if (this.gizmoMode === 'select') {
      // Just the bounding rect + center dot is enough for select mode.
    } else if (this.gizmoMode === 'translate') {
      // Highlight the locked axis (during a single-axis drag).
      const lock = this.drag?.axisLock;
      const xActive = !lock || lock === 'x';
      const yActive = !lock || lock === 'y';
      const xAlpha = xActive ? 1 : 0.18;
      const yAlpha = yActive ? 1 : 0.18;
      // X axis arrow (red)
      g.lineStyle(3, 0xf87a7a, xAlpha);
      g.moveTo(cx, cy); g.lineTo(cx + 38, cy);
      g.lineStyle(0); g.beginFill(0xf87a7a, xAlpha);
      g.drawPolygon([cx+38,cy-6, cx+50,cy, cx+38,cy+6]); g.endFill();
      // Y axis arrow (green)
      g.lineStyle(3, 0x7aff8a, yAlpha);
      g.moveTo(cx, cy); g.lineTo(cx, cy - 38);
      g.lineStyle(0); g.beginFill(0x7aff8a, yAlpha);
      g.drawPolygon([cx-6,cy-38, cx,cy-50, cx+6,cy-38]); g.endFill();
    } else if (this.gizmoMode === 'scale') {
      // Corner & edge scale handles
      g.lineStyle(2, 0x82c8ff, 1);
      g.beginFill(0x82c8ff, 1);
      const r = 5;
      g.drawRect(b.x - r, b.y - r, r*2, r*2);
      g.drawRect(b.x + b.w - r, b.y - r, r*2, r*2);
      g.drawRect(b.x - r, b.y + b.h - r, r*2, r*2);
      g.drawRect(b.x + b.w - r, b.y + b.h - r, r*2, r*2);
      g.endFill();
    } else if (this.gizmoMode === 'rotate') {
      // Unity-style 3-ring rotation gizmo. Each ring is drawn for the axes
      // this asset supports (3D assets get all three; 2D ones get only Z).
      const { r } = this.rotRingGeom(b);
      const rThin = r * 0.28;
      const rot = a.bindings.rot;
      const drawRing = (rx, ry, color, axis) => {
        const has = (axis === 'x' ? rot.xKey : axis === 'y' ? rot.yKey : rot.zKey);
        if (!has) return;
        const active = this.rotAxis === axis;
        g.lineStyle(active ? 3.5 : 2, color, active ? 1 : 0.55);
        g.drawEllipse(cx, cy, rx, ry);
      };
      drawRing(r, r, 0x7aa8ff, 'z');           // blue, full circle  → Z axis
      drawRing(rThin, r, 0xf87a7a, 'x');       // red, vertical thin → X axis
      drawRing(r, rThin, 0x7aff8a, 'y');       // green, horizontal  → Y axis
    }
  },
};

function buildEditorAssetRegistry() {
  const oh = () => Math.max(1, Layout.hoop.outerHalf);
  return [
    {
      id: 'hoop', name: '후프 프레임 (image 232)', is3D: false,
      bounds: () => ({
        x: Layout.hoop.cx - Layout.hoop.outerHalf,
        y: Layout.hoop.cy - Layout.hoop.outerHalf,
        w: Layout.hoop.outerHalf * 2,
        h: Layout.hoop.outerHalf * 2,
      }),
      bindings: { pos: { xKey: 'railOffsetX', yKey: 'railOffsetY' } },
    },
    {
      id: 'brush', name: '브러시 (image 231)', is3D: false,
      bounds: () => {
        const L = Layout.hoop;
        const hoopTex = Game.tex?.railHoop;
        const brushTex = Game.tex?.railBrush;
        // Fall back to a placeholder square if textures aren't loaded yet.
        if (!hoopTex || !brushTex) {
          const s = Math.max(40, L.outerHalf * 0.45);
          const cx = L.cx + L.outerHalf * (EditorTune.brushOffsetX ?? -0.78);
          const cy = L.cy + L.outerHalf * (EditorTune.brushOffsetY ?? 0.75);
          return { x: cx - s/2, y: cy - s/2, w: s, h: s };
        }
        const baseScale = (L.outerHalf * 2) / hoopTex.width;
        const scale = baseScale * (EditorTune.brushScale ?? 1);
        const w = brushTex.width * scale;
        const h = brushTex.height * scale;
        const cx = L.cx + L.outerHalf * (EditorTune.brushOffsetX ?? -0.78);
        const cy = L.cy + L.outerHalf * (EditorTune.brushOffsetY ?? 0.75);
        return { x: cx - w/2, y: cy - h/2, w, h };
      },
      bindings: {
        pos:   { xKey: 'brushOffsetX', yKey: 'brushOffsetY',

      id: 'slot', name: '슬롯', is3D: false,
      bounds: () => {
        const s = Layout.slot;
        return {
          x: s.startX - s.size/2,
          y: s.y - s.size/2,
          w: (s.spacing * 4) + s.size,
          h: s.size,
        };
      },
      bindings: {
        pos:   { xKey: 'slotXOffset', yKey: 'slotYOffset' },
        scale: { uKey: 'slotSize', uScale: 0.5 },
      },
    },
    {
      id: 'queue', name: '큐 (대기 보빈 그리드)', is3D: false,
      bounds: () => {
        const q = Layout.queue;
        const cols = q.cols;
        const rows = Math.max(1, Math.ceil(QUEUE_VISIBLE_MAX / cols));
        return {
          x: q.startX - q.size/2,
          y: q.y - q.size/2,
          w: (cols - 1) * q.spacingX + q.size,
          h: (rows - 1) * q.spacingY + q.size,
        };
      },
      bindings: {
        pos:   { xKey: 'queueXOffset', yKey: 'queueYOffset' },
        scale: { uKey: 'queueBobbinScale' },
        extra: [
          { key: 'queueCols',  label: '큐 열 수',     step: 1,    min: 2, max: 6, int: true },
          { key: 'queueGapX',  label: '가로 간격',    step: 0.05, min: 0, max: 3 },
          { key: 'queueGapY',  label: '세로 간격',    step: 0.05, min: 0, max: 3 },
        ],
      },
    },
    {
      id: 'slotBobbin', name: '슬롯 보빈 위치', is3D: false,
      bounds: () => {
        // Tight box around the first slot bobbin's expected center.
        const p = Layout.slotBobbinPos(0);
        const s = Math.max(40, Layout.bobbinSize * (EditorTune.bobbinIdleScale || 1) * 1.0);
        return { x: p.x - s/2, y: p.y - s/2, w: s, h: s };
      },
      bindings: {
        pos: { xKey: 'slotBobbinOffsetX', yKey: 'slotBobbinOffsetY' },
      },
    },
    {
      id: 'counter', name: '카운터 (X/5)', is3D: false,
      bounds: () => {
        const c = Layout.counter;
        const fs = EditorTune.counterFontSize;
        return { x: c.x - fs * 0.4, y: c.y - fs * 0.5, w: fs * 1.7, h: fs * 1.1 };
      },
      bindings: {
        pos:   { xKey: 'counterOffsetX', yKey: 'counterOffsetY' },
        scale: { uKey: 'counterFontSize', uScale: 0.2 },
      },
    },
  ];
}

/* =========================================================================
 *  Map Tool — paint a pattern, paste image, test, build to HTML
 * ========================================================================= */
const MapTool = {
  cols: 28,
  rows: 28,
  cells: null,                   // [row][col] = colorKey | null
  selectedColor: 'blue',
  canvas: null, ctx: null,
  drawing: false, drawMode: 'paint',
  pasteListenerInstalled: false,

  init() {
    this.canvas = document.getElementById('map-canvas');
    if (!this.canvas) return;
    this.ctx = this.canvas.getContext('2d');
    this.cells = Array.from({ length: this.rows }, () => Array(this.cols).fill(null));
    this._buildPalette();
    this._sizeCanvas();
    this._attachCanvasEvents();
    this._attachControlEvents();
    this._installPasteListener();
    this.render();
    this.updateBobbinPreview();
  },

  onShow() {
    // Sync slider displays whenever the map tab becomes active
    const cs = document.getElementById('map-cols');
    const rs = document.getElementById('map-rows');
    if (cs) { cs.value = this.cols; cs.parentElement.querySelector('.val').textContent = this.cols; }
    if (rs) { rs.value = this.rows; rs.parentElement.querySelector('.val').textContent = this.rows; }
  },

  _buildPalette() {
    const wrap = document.getElementById('map-palette');
    if (!wrap) return;
    wrap.innerHTML = '';
    // Eraser button first
    const eraseBtn = document.createElement('button');
    eraseBtn.title = '지우개';
    eraseBtn.dataset.color = '';
    eraseBtn.innerHTML = '<span class="swatch" style="background:repeating-linear-gradient(45deg,#444,#444 4px,#222 4px,#222 8px)"></span>';
    wrap.appendChild(eraseBtn);
    // Wool colors
    for (const [key, def] of Object.entries(WOOL)) {
      const b = document.createElement('button');
      b.title = key;
      b.dataset.color = key;
      const hex = '#' + def.fill.toString(16).padStart(6, '0');
      b.innerHTML = `<span class="swatch" style="background:${hex}"></span>`;
      wrap.appendChild(b);
    }
    wrap.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      this.selectedColor = btn.dataset.color || null;  // empty → eraser
      wrap.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
    // Default selection
    wrap.querySelector(`button[data-color="${this.selectedColor}"]`)?.classList.add('selected');
  },

  _sizeCanvas() {
    // Render the grid at consistent on-screen size — about 280px wide.
    const SIZE = 280;
    const cellPx = Math.max(4, Math.floor(SIZE / Math.max(this.cols, this.rows)));
    this.canvas.width  = cellPx * this.cols;
    this.canvas.height = cellPx * this.rows;
    this._cellPx = cellPx;
  },

  _attachCanvasEvents() {
    const cv = this.canvas;
    const paintAt = (ev) => {
      const rect = cv.getBoundingClientRect();
      const cx = (ev.clientX - rect.left) * (cv.width  / rect.width);
      const cy = (ev.clientY - rect.top)  * (cv.height / rect.height);
      const col = Math.floor(cx / this._cellPx);
      const row = Math.floor(cy / this._cellPx);
      if (row < 0 || row >= this.rows || col < 0 || col >= this.cols) return;
      const v = (this.drawMode === 'erase' || !this.selectedColor) ? null : this.selectedColor;
      if (this.cells[row][col] === v) return;
      this.cells[row][col] = v;
      this.render();
      this.updateBobbinPreview();
    };
    cv.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      this.drawing = true;
      this.drawMode = (e.button === 2) ? 'erase' : 'paint';
      cv.setPointerCapture(e.pointerId);
      paintAt(e);
    });
    cv.addEventListener('pointermove', (e) => { if (this.drawing) paintAt(e); });
    cv.addEventListener('pointerup', (e) => {
      this.drawing = false;
      try { cv.releasePointerCapture(e.pointerId); } catch {}
    });
    cv.addEventListener('contextmenu', (e) => e.preventDefault());
  },

  _attachControlEvents() {
    document.getElementById('map-cols')?.addEventListener('input', (e) => {
      const v = parseInt(e.target.value, 10);
      e.target.parentElement.querySelector('.val').textContent = v;
      this.resize(v, this.rows);
    });
    document.getElementById('map-rows')?.addEventListener('input', (e) => {
      const v = parseInt(e.target.value, 10);
      e.target.parentElement.querySelector('.val').textContent = v;
      this.resize(this.cols, v);
    });
    document.getElementById('map-paste')?.addEventListener('click', () => this._pasteFromClipboard());
    document.getElementById('map-clear')?.addEventListener('click', () => this.clear());
    document.getElementById('map-auto-trim')?.addEventListener('click', () => this.autoTrim());
    document.getElementById('map-load-cur')?.addEventListener('click', () => this.loadCurrentPattern());
    document.getElementById('map-test')?.addEventListener('click', () => this.applyAndReload());
    document.getElementById('map-build')?.addEventListener('click', () => this.buildHTML());
  },

  _installPasteListener() {
    if (this.pasteListenerInstalled) return;
    this.pasteListenerInstalled = true;
    window.addEventListener('paste', async (e) => {
      // Only handle paste while map tool is the visible section AND we're in edit mode.
      const mapSec = document.querySelector('[data-tool-section="map"]');
      if (!mapSec || mapSec.hidden) return;
      if (!document.body.classList.contains('editor-mode')) return;
      const items = e.clipboardData?.items || [];
      for (const item of items) {
        if (item.type?.startsWith('image/')) {
          e.preventDefault();
          const file = item.getAsFile();
          if (file) await this.applyImage(file);
          return;
        }
      }
    });
  },

  async _pasteFromClipboard() {
    // Try the navigator.clipboard API (modern, requires permission)
    try {
      if (navigator.clipboard?.read) {
        const items = await navigator.clipboard.read();
        for (const it of items) {
          for (const t of it.types) {
            if (t.startsWith('image/')) {
              const blob = await it.getType(t);
              await this.applyImage(blob);
              return;
            }
          }
        }
        flashEditorMessage('클립보드에 이미지가 없습니다');
      } else {
        flashEditorMessage('Ctrl+V로 직접 붙여넣으세요');
      }
    } catch (err) {
      flashEditorMessage('붙여넣기 실패: ' + err.message);
    }
  },

  async applyImage(blob) {
    const url = URL.createObjectURL(blob);
    try {
      const img = await new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => res(i);
        i.onerror = rej;
        i.src = url;
      });
      // Pick a grid size that preserves the image's native resolution as closely as possible.
      // - If image fits in [MIN_GRID, MAX_GRID]^2 → use native dimensions 1:1
      // - If larger → scale down preserving aspect ratio, longest side = MAX_GRID
      // - If smaller in one dimension → bump that side up to MIN_GRID
      const MIN_GRID = 16, MAX_GRID = 64;
      let cols, rows;
      const longest = Math.max(img.width, img.height);
      if (longest > MAX_GRID) {
        const k = MAX_GRID / longest;
        cols = Math.max(MIN_GRID, Math.round(img.width  * k));
        rows = Math.max(MIN_GRID, Math.round(img.height * k));
      } else {
        cols = Math.max(MIN_GRID, img.width);
        rows = Math.max(MIN_GRID, img.height);
      }
      // Apply the new grid size
      this.cols = cols; this.rows = rows;
      this.cells = Array.from({ length: rows }, () => Array(cols).fill(null));
      // Update sliders
      const csEl = document.getElementById('map-cols');
      const rsEl = document.getElementById('map-rows');
      if (csEl) { csEl.value = cols; csEl.parentElement.querySelector('.val').textContent = cols; }
      if (rsEl) { rsEl.value = rows; rsEl.parentElement.querySelector('.val').textContent = rows; }
      this._sizeCanvas();

      // Draw image into temp canvas at cols×rows. Use 1:1 if it fits exactly, else fit-to-shortest.
      const cv = document.createElement('canvas');
      cv.width = cols; cv.height = rows;
      const ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.imageSmoothingEnabled = (img.width !== cols || img.height !== rows);
      const fit = Math.min(cols / img.width, rows / img.height);
      const dw = img.width  * fit;
      const dh = img.height * fit;
      const dx = (cols - dw) / 2;
      const dy = (rows - dh) / 2;
      ctx.clearRect(0, 0, cols, rows);
      ctx.drawImage(img, dx, dy, dw, dh);

      const data = ctx.getImageData(0, 0, cols, rows).data;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const i = (r * cols + c) * 4;
          const a = data[i + 3];
          if (a < 64) { this.cells[r][c] = null; continue; }
          this.cells[r][c] = quantizeToWool(data[i], data[i+1], data[i+2]);
        }
      }
      this.render();
      this.updateBobbinPreview();
      const nativeStr = (img.width === cols && img.height === rows) ? ' (원본 해상도)' : ` (${img.width}×${img.height} → ${cols}×${rows})`;
      flashEditorMessage(`이미지 적용 ✓${nativeStr}`);
    } finally {
      URL.revokeObjectURL(url);
    }
  },

  loadCurrentPattern() {
    this.resize(PATTERN.width, PATTERN.height);
    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        this.cells[r][c] = PATTERN.cells[r]?.[c] || null;
      }
    }
    this.render();
    this.updateBobbinPreview();
    flashEditorMessage('현재 패턴 불러왔습니다 ✓');
  },

  resize(cols, rows) {
    const old = this.cells;
    const oldC = this.cols, oldR = this.rows;
    this.cols = cols;
    this.rows = rows;
    const next = Array.from({ length: rows }, () => Array(cols).fill(null));
    // Copy what we can (top-left aligned)
    for (let r = 0; r < Math.min(rows, oldR); r++) {
      for (let c = 0; c < Math.min(cols, oldC); c++) {
        next[r][c] = old[r][c];
      }
    }
    this.cells = next;
    this._sizeCanvas();
    this.render();
    this.updateBobbinPreview();
  },

  clear() {
    for (let r = 0; r < this.rows; r++)
      for (let c = 0; c < this.cols; c++)
        this.cells[r][c] = null;
    this.render();
    this.updateBobbinPreview();
  },

  autoTrim() {
    let minR = this.rows, maxR = -1, minC = this.cols, maxC = -1;
    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        if (this.cells[r][c]) {
          if (r < minR) minR = r;
          if (r > maxR) maxR = r;
          if (c < minC) minC = c;
          if (c > maxC) maxC = c;
        }
      }
    }
    if (maxR < 0) { flashEditorMessage('그리드가 비어있습니다'); return; }
    const newR = maxR - minR + 1;
    const newC = maxC - minC + 1;
    const next = Array.from({ length: newR }, () => Array(newC).fill(null));
    for (let r = 0; r < newR; r++)
      for (let c = 0; c < newC; c++)
        next[r][c] = this.cells[minR + r][minC + c];
    this.cols = newC;
    this.rows = newR;
    this.cells = next;
    const cs = document.getElementById('map-cols');
    const rs = document.getElementById('map-rows');
    if (cs) { cs.value = newC; cs.parentElement.querySelector('.val').textContent = newC; }
    if (rs) { rs.value = newR; rs.parentElement.querySelector('.val').textContent = newR; }
    this._sizeCanvas();
    this.render();
    this.updateBobbinPreview();
    flashEditorMessage(`잘라냄: ${newC}×${newR}`);
  },

  render() {
    const { ctx, _cellPx: cp, cols, rows, cells } = this;
    if (!ctx) return;
    ctx.fillStyle = '#0d1116';
    ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const k = cells[r][c];
        if (!k) continue;
        ctx.fillStyle = '#' + WOOL[k].fill.toString(16).padStart(6, '0');
        ctx.fillRect(c * cp, r * cp, cp, cp);
      }
    }
    // Subtle grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= cols; i++) {
      ctx.moveTo(i * cp + 0.5, 0); ctx.lineTo(i * cp + 0.5, rows * cp);
    }
    for (let i = 0; i <= rows; i++) {
      ctx.moveTo(0, i * cp + 0.5); ctx.lineTo(cols * cp, i * cp + 0.5);
    }
    ctx.stroke();
  },

  updateBobbinPreview() {
    const counts = {};
    for (const row of this.cells) {
      for (const c of row) {
        if (c) counts[c] = (counts[c] || 0) + 1;
      }
    }
    const el = document.getElementById('bobbin-preview');
    if (!el) return;
    const entries = Object.entries(counts);
    if (!entries.length) { el.innerHTML = '<em>비어있음</em>'; return; }
    el.innerHTML = entries
      .sort((a, b) => b[1] - a[1])
      .map(([color, n]) => {
        const hex = '#' + WOOL[color].fill.toString(16).padStart(6, '0');
        const bobbins = Math.ceil(n / BOBBIN_MAX_COUNT);
        return `<div class="chip"><span class="sw" style="background:${hex}"></span> ${color}: ${n}개 (${bobbins} 보빈)</div>`;
      }).join('');
  },

  exportPattern() {
    return {
      width: this.cols,
      height: this.rows,
      cells: this.cells.map(row => row.slice()),
    };
  },

  applyAndReload() {
    const pattern = this.exportPattern();
    let nonEmpty = 0;
    for (const r of pattern.cells) for (const c of r) if (c) nonEmpty++;
    if (!nonEmpty) { flashEditorMessage('빈 그리드는 테스트할 수 없습니다'); return; }
    try {
      sessionStorage.setItem('wooloop_test_pattern', JSON.stringify(pattern));
    } catch (err) {
      flashEditorMessage('테스트 저장 실패: ' + err.message);
      return;
    }
    flashEditorMessage('적용 후 리로드…');
    setTimeout(() => location.reload(), 300);
  },

  async buildHTML() {
    const pattern = this.exportPattern();
    let nonEmpty = 0;
    for (const r of pattern.cells) for (const c of r) if (c) nonEmpty++;
    if (!nonEmpty) { flashEditorMessage('빈 그리드는 빌드할 수 없습니다'); return; }
    try {
      const src = await fetch(location.href).then(r => r.text());
      const json = JSON.stringify(pattern);
      const overrideLine = `const PATTERN_OVERRIDE = ${json};`;
      const next = src.replace(/const PATTERN_OVERRIDE\s*=\s*[^;]+;/, overrideLine);
      if (next === src) { flashEditorMessage('소스에 PATTERN_OVERRIDE 위치를 찾지 못함'); return; }
      const blob = new Blob([next], { type: 'text/html' });
      const a = document.createElement('a');
      const ts = new Date().toISOString().replace(/[-:T.Z]/g, '').slice(0, 14);
      a.href = URL.createObjectURL(blob);
      a.download = `wooloop_${pattern.width}x${pattern.height}_${ts}.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      flashEditorMessage('HTML 다운로드됨 ✓');
    } catch (err) {
      flashEditorMessage('빌드 실패: ' + err.message);
    }
  },
};

function quantizeToWool(r, g, b) {
  let best = null, bestDist = Infinity;
  for (const [key, def] of Object.entries(WOOL)) {
    const wr = (def.fill >> 16) & 0xff;
    const wg = (def.fill >> 8)  & 0xff;
    const wb =  def.fill        & 0xff;
    const dr = r - wr, dg = g - wg, db = b - wb;
    const d = dr*dr + dg*dg + db*db;
    if (d < bestDist) { bestDist = d; best = key; }
  }
  return best;
}

/* =========================================================================
 *  Resource Upload (drag&drop + file picker) + Auto-trim
 * ========================================================================= */
function initResourceUpload() {
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');
  const targetSel = document.getElementById('upload-target');
  const resultEl = document.getElementById('upload-result');
  const trimBtn = document.getElementById('btn-auto-trim');
  if (!dropZone || !fileInput || !targetSel) return;

  const handle = async (file) => {
    if (!file) return;
    try {
      const target = targetSel.value;
      const ext = (file.name.split('.').pop() || '').toLowerCase();
      const isGLB = ext === 'glb' || ext === 'gltf';
      const isPNG = ext === 'png';
      if (target.endsWith('GLB') && !isGLB) {
        flashEditorMessage('이 항목엔 GLB/GLTF 파일이 필요합니다'); return;
      }
      if (!target.endsWith('GLB') && !isPNG) {
        flashEditorMessage('이 항목엔 PNG 파일이 필요합니다'); return;
      }
      if (isPNG) {
        await replacePngTexture(target, file);
      } else {
        await replaceGLBAsset(target, file);
      }
      if (resultEl) resultEl.textContent = `✓ ${target} ← ${file.name} (${(file.size/1024).toFixed(1)}KB)`;
      flashEditorMessage('업로드 적용됨 ✓');
    } catch (err) {
      flashEditorMessage('업로드 실패: ' + err.message);
      console.warn('upload error', err);
    }
  };

  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => { handle(e.target.files[0]); fileInput.value = ''; });
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    handle(e.dataTransfer.files[0]);
  });

  if (trimBtn) {
    trimBtn.addEventListener('click', async () => {
      const target = targetSel.value;
      if (target.endsWith('GLB')) { flashEditorMessage('PNG 자산에만 적용됩니다'); return; }
      try {
        await autoTrimTexture(target);
        flashEditorMessage('잉여 공간 제거 ✓');
      } catch (err) {
        flashEditorMessage('실패: ' + err.message);
      }
    });
  }
}

async function replacePngTexture(targetKey, file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = (e) => rej(new Error('이미지 로드 실패'));
      i.src = url;
    });
    const cv = document.createElement('canvas');
    cv.width = img.width; cv.height = img.height;
    cv.getContext('2d').drawImage(img, 0, 0);
    const newTex = PIXI.Texture.from(cv);
    await rebindTexture(targetKey, newTex);
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function replaceGLBAsset(targetKey, file) {
  if (!window.Three3D) { throw new Error('Three.js 보조 초기화 안 됨'); }
  const buf = await file.arrayBuffer();
  const loader = new THREE.GLTFLoader();
  const parsed = await new Promise((res, rej) => {
    loader.parse(buf, '', res, rej);
  });
  if (targetKey === 'trayGLB') {
    Three3D.trayGLB = parsed;
    // Re-render upright + lying tray textures using current Y rotation
    const newLying = await Three3D.renderTrayAt(EditorTune.trayYRotationDeg, EditorTune.trayTiltDeg, 'lying');
    const newUpright = await Three3D.renderTrayAt(EditorTune.trayIdleYRotationDeg, 0, 'upright');
    Game.tex.tray = newLying;
    Game.tex.trayLying = newLying;
    Game.tex.trayUpright = newUpright;
    for (const e of Game.rail) {
      e.carrier?.refreshTextures?.();
      e.carrier?.setOrientation?.('lying', true);
    }
    for (const f of Game.inFlightCarriers) f.carrier?.refreshTextures?.();
    redrawDump();
  } else if (targetKey === 'bobbinGLB') {
    Three3D.bobbinGLB = parsed;
    const newLying   = await Three3D.renderBobbinStagesAt(EditorTune.bobbinYRotationDeg, 'lying');
    const newUpright = await Three3D.renderBobbinStagesAt(EditorTune.bobbinIdleYRotationDeg, 'upright');
    Game.tex.bobbinStages = newLying;
    Game.tex.bobbinStagesUpright = newUpright;
    const all = [];
    for (const e of Game.queue) all.push(e.bobbin);
    for (const s of Game.slots) if (s) all.push(s.bobbin);
    for (const e of Game.rail) all.push(e.bobbin);
    for (const b of all) b._updateStage?.();
  }
}

async function rebindTexture(key, tex) {
  Game.tex[key] = tex;
  // Trigger re-draw of affected systems
  if (key === 'rail') {
    // Re-build the hoop sprite with the new rail texture
    if (Game.hoopGfx?.parent) Game.hoopGfx.parent.removeChild(Game.hoopGfx);
    Game.hoopGfx = null;
    drawHoop();
  } else if (key === 'railArrow') {
    setupRailArrows();
  } else if (key === 'woolKnot') {
    // Rebuild wool grid in place
    if (Game.woolGrid) {
      Game.layers.wool.removeChildren();
      Game.woolGrid = new WoolGrid(Game.layers.wool);
    }
  } else if (key === 'threadRope') {
    // Active pull strings use this texture in their rope mode; only new pulls
    // pick up the change. No immediate rebuild.
  }
}

async function autoTrimTexture(key) {
  const tex = Game.tex[key];
  if (!tex) throw new Error('해당 자산이 없습니다');
  const src = tex.baseTexture.resource?.source || tex.baseTexture.resource?.bitmap;
  if (!src) throw new Error('비트맵 소스를 읽을 수 없습니다');
  const cv = document.createElement('canvas');
  cv.width = src.width; cv.height = src.height;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(src, 0, 0);
  const data = ctx.getImageData(0, 0, src.width, src.height).data;
  let minX = src.width, maxX = -1, minY = src.height, maxY = -1;
  for (let y = 0; y < src.height; y++) {
    for (let x = 0; x < src.width; x++) {
      if (data[(y * src.width + x) * 4 + 3] > 8) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) throw new Error('투명 픽셀만 있음');
  const cw = maxX - minX + 1;
  const ch = maxY - minY + 1;
  const out = document.createElement('canvas');
  out.width = cw; out.height = ch;
  out.getContext('2d').drawImage(cv, minX, minY, cw, ch, 0, 0, cw, ch);
  const newTex = PIXI.Texture.from(out);
  await rebindTexture(key, newTex);
}

function flashEditorMessage(msg) {
  let el = document.getElementById('editor-flash');
  if (!el) {
    el = document.createElement('div');
    el.id = 'editor-flash';
    el.style.cssText = 'position:fixed;top:60px;right:18px;z-index:1001;background:rgba(0,160,80,0.92);color:#fff;padding:8px 14px;border-radius:6px;font-size:12px;transition:opacity 0.4s';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.style.opacity = '0'; }, 1400);
}

// Per-key change dispatcher. Most params apply live by being read each frame.
// Some require a structural rebuild or 3D re-render.
function applyEditorChange(key) {
  switch (key) {
    case 'arrowRadiusX':
    case 'arrowRadiusY':
      // Arrow ring shape changed → both arrows AND bobbin path need updating
      Layout.ringHalfX = Layout.hoop.innerHalf + Layout.hoop.rim * EditorTune.arrowRadiusX;
      Layout.ringHalfY = Layout.hoop.innerHalf + Layout.hoop.rim * EditorTune.arrowRadiusY;
      Layout.ringHalf = (Layout.ringHalfX + Layout.ringHalfY) / 2;
      RailPath.init(Layout.hoop.cx, Layout.hoop.cy, Layout.ringHalfX, Layout.ringHalfY, Layout.hoop.cornerRadius);
      setupRailArrows();
      break;
    case 'arrowSize':
    case 'arrowCount':
      setupRailArrows();
      break;
    case 'arrowOffsetX':
    case 'arrowOffsetY':
      // Live read in arrowPathPosition each frame — nothing to rebuild
      break;
    case 'brushOffsetX':
    case 'brushOffsetY':
    case 'brushScale':
      // Reposition / rescale the brush sprite without rebuilding the hoop.
      if (Game.brushGfx && Game.tex?.railHoop) {
        const L = Layout.hoop;
        const baseScale = (L.outerHalf * 2) / Game.tex.railHoop.width;
        Game.brushGfx.scale.set(baseScale * (EditorTune.brushScale ?? 1));
        Game.brushGfx.x = L.cx + L.outerHalf * (EditorTune.brushOffsetX ?? -0.78);
        Game.brushGfx.y = L.cy + L.outerHalf * (EditorTune.brushOffsetY ?? 0.75);
      }
      break;
    case 'bobbinIdleScale':
    case 'bobbinIdleRotationDeg':
    case 'bobbinSpriteScale': {
      const all = [];
      for (const e of Game.queue) all.push(e.bobbin);
      for (const s of Game.slots) if (s) all.push(s.bobbin);
      for (const e of Game.rail) all.push(e.bobbin);
      for (const b of all) {
        if (b.updateVisualStyle) b.updateVisualStyle();
      }
      break;
    }
    case 'dumpX':
    case 'dumpY':
      Layout.dump.x = Layout.hoop.cx + Layout.hoop.outerHalf * EditorTune.dumpX;
      Layout.dump.y = Layout.hoop.cy + Layout.hoop.outerHalf * EditorTune.dumpY;
      Layout.counter.x = Layout.dump.x + EditorTune.counterOffsetX;
      Layout.counter.y = Layout.dump.y + EditorTune.counterOffsetY;
      if (Game.dumpGfx) { Game.dumpGfx.x = Layout.dump.x; Game.dumpGfx.y = Layout.dump.y; }
      if (Game.counterContainer) {
        Game.counterContainer.x = Layout.counter.x;
        Game.counterContainer.y = Layout.counter.y;
      }
      redrawDump();
      break;
    case 'trayDumpRotationDeg':
    case 'trayIdleScale':
    case 'trayScale':
    case 'trayDumpVisible':
      redrawDump();
      for (const e of Game.rail) e.carrier?.updateVisualStyle?.();
      for (const f of Game.inFlightCarriers) f.carrier?.updateVisualStyle?.();
      break;
    case 'trayIdleYRotationDeg':
    case 'trayIdleXRotationDeg':
    case 'trayYRotationDeg':
    case 'trayTiltDeg':
    case 'trayThickness':
    case 'trayIdleZRotationDeg3D':
    case 'trayRailFlat':
      // trayRailFlat also requires a re-render: the lying-tray sprite bakes
      // in the X tilt, so flipping the override has to redraw the texture
      // (not just change a live-read value).
      reRenderTrayY(EditorTune.trayYRotationDeg, EditorTune.trayTiltDeg, EditorTune.trayIdleYRotationDeg);
      break;
    case 'gridBgColor':
    case 'gridBgAlpha':
    case 'gridBgPad':
    case 'gridBgPadX':
    case 'gridBgPadY':
    case 'gridBgCornerRadius':
      drawGridBg();
      break;
    case 'gridFabricColor':
    case 'gridFabricAlpha':
      // Fabric lives in drawGridBg's tile grid — just redraw that.
      drawGridBg();
      break;
    case 'trayStackSpacing':
      // Just the dump visual — the rail trays aren't stacked.
      redrawDump();
      break;
    case 'bobbinBarrelR':
    case 'bobbinFlangeTopH':
    case 'bobbinFlangeBottomH':
    case 'bobbinRailBarrelR':
    case 'bobbinRailFlangeTopH':
    case 'bobbinRailFlangeBottomH':
    case 'bobbinShadowIdleOpacity':
    case 'bobbinShadowIdleAngle':
    case 'bobbinShadowIdleSize':
    case 'bobbinShadowIdleOffsetX':
    case 'bobbinShadowIdleOffsetY':
    case 'bobbinShadowRailOpacity':
    case 'bobbinShadowRailAngle':
    case 'bobbinShadowRailSize':
    case 'bobbinShadowRailOffsetX':
    case 'bobbinShadowRailOffsetY':
      // Procedural shell + shadow setup are baked into the pre-rendered
      // bobbin textures, so any of these requires re-rendering. Idle keys
      // re-render upright stages, rail keys re-render lying stages —
      // reRenderBobbinsY does both.
      reRenderBobbinsY(EditorTune.bobbinYRotationDeg, EditorTune.bobbinIdleYRotationDeg);
      break;
    case 'bobbinIdleYRotationDeg':
    case 'bobbinIdleXRotationDeg':
    case 'bobbinYRotationDeg':
    case 'bobbinXRotationDeg':
      reRenderBobbinsY(EditorTune.bobbinYRotationDeg, EditorTune.bobbinIdleYRotationDeg);
      break;
    case 'bobbinRailRotationDeg':
    case 'trayLaunchedRotationDeg':
    case 'arrowSecPerLap':
    case 'arrowHideStart':
    case 'arrowHideEnd':
    case 'launchEndT':
    case 'bobbinOnTrayOffsetY':
    case 'trayRailZRotationDeg3D':
      // Picked up live each frame (or on next launch for launchEndT) —
      // nothing to rebuild. Listed explicitly so future audits can tell
      // a deliberate "live read" from a missing case.
      break;
    case 'railOffsetX':
    case 'railOffsetY':
    case 'gridScaleX':
    case 'gridScaleY':
    case 'gridShiftX':
    case 'gridShiftY':
    case 'queueCols':
    case 'queueGap':
    case 'queueGapX':
    case 'queueGapY':
    case 'queueBobbinScale':
    case 'queueXOffset':
    case 'queueYOffset':
    case 'slotBobbinOffsetX':
    case 'slotBobbinOffsetY':
    case 'slotSize':
    case 'slotXOffset':
    case 'slotYOffset':
    case 'counterOffsetX':
    case 'counterOffsetY':
    case 'counterFontSize':
      Layout.compute(window.innerWidth, window.innerHeight);
      if (Game.counterContainer) {
        Game.counterContainer.x = Layout.counter.x;
        Game.counterContainer.y = Layout.counter.y;
      }
      if (Game.counterText) {
        Game.counterText.x = 0;
        Game.counterText.y = 0;
        Game.counterText.style.fontSize = EditorTune.counterFontSize;
      }
      // Slot row: rebuild graphics if the slot SIZE changed (the rect art is
      // baked, scaling the container would also distort radii). Otherwise just
      // reposition the existing graphics.
      if (key === 'slotSize' && Game.slotGfxs?.length) {
        for (const g of Game.slotGfxs) g.parent?.removeChild(g);
        Game.slotGfxs.length = 0;
        // Preserve current bobbin references so the row state isn't lost.
        const preserved = Game.slots.slice();
        Game.slots.length = 0;
        drawSlots();  // rebuilds slotGfxs + pushes new nulls to Game.slots
        for (let i = 0; i < preserved.length; i++) {
          Game.slots[i] = preserved[i];
          if (preserved[i]?.bobbin) {
            const p = Layout.slotBobbinPos(i);
            preserved[i].bobbin.gfx.x = p.x;
            preserved[i].bobbin.gfx.y = p.y;
          }
        }
      } else if (Game.slotGfxs?.length) {
        for (let i = 0; i < Game.slotGfxs.length; i++) {
          const g = Game.slotGfxs[i];
          const p = Layout.slotPos(i);
          g.x = p.x; g.y = p.y;
        }
      }
      // Reposition bobbins currently sitting on slots so slotBobbinOffsetX/Y,
      // slotXOffset, and slotYOffset all take effect live.
      for (let i = 0; i < Game.slots.length; i++) {
        const s = Game.slots[i];
        if (s?.bobbin?.gfx) {
          const p = Layout.slotBobbinPos(i);
          s.bobbin.gfx.x = p.x;
          s.bobbin.gfx.y = p.y;
        }
      }
      // Re-layout queue bobbins
      if (Game.queue) {
        const allRows = {};
        for (const e of Game.queue) {
          allRows[e.col] = (allRows[e.col] || 0);
          const pos = Layout.queuePos(e.col, allRows[e.col]);
          e.bobbin.gfx.x = pos.x;
          e.bobbin.gfx.y = pos.y;
          e.bobbin.updateVisualStyle?.();
          allRows[e.col]++;
        }
      }
      for (const s of Game.slots) s?.bobbin?.updateVisualStyle?.();
      for (const e of Game.rail) {
        e.bobbin?.updateVisualStyle?.();
        e.carrier?.updateVisualStyle?.();
      }
      for (const f of Game.inFlightCarriers) {
        f.bobbin?.updateVisualStyle?.();
        f.carrier?.updateVisualStyle?.();
      }
      redrawDump();
      // Rail moved? Reposition rail sprite + dump + rail path + chevron arrows.
      if (key === 'railOffsetX' || key === 'railOffsetY') {
        if (Game.hoopGfx?.parent) Game.hoopGfx.parent.removeChild(Game.hoopGfx);
        Game.hoopGfx = null;
        drawHoop();
        RailPath.init(Layout.hoop.cx, Layout.hoop.cy, Layout.ringHalfX, Layout.ringHalfY, Layout.hoop.cornerRadius);
        if (Game.dumpGfx) {
          Game.dumpGfx.x = Layout.dump.x;
          Game.dumpGfx.y = Layout.dump.y;
        }
      }
      // Grid area changed → rebuild wool grid with new cellSize / offsets.
      if (key === 'gridScaleX' || key === 'gridScaleY' ||
          key === 'gridShiftX' || key === 'gridShiftY' ||
          key === 'railOffsetX' || key === 'railOffsetY') {
        if (Game.woolGrid) {
          Game.layers.wool.removeChildren();
          Game.woolGrid = new WoolGrid(Game.layers.wool);
        }
      }
      break;
    // bobbinRailRotationDeg + trayLaunchedRotationDeg + arrowSecPerLap = picked up live
    default:
      // Catch-all so a brand-new editor knob never silently no-ops while
      // waiting on its own case. Best effort: refresh visual styles on
      // bobbins / carriers and recompute layout. Cheap enough to run on
      // any input event; not a substitute for a real case but keeps the
      // "applies after refresh only" footgun from regressing.
      try {
        for (const s of Game.slots || []) s?.bobbin?.updateVisualStyle?.();
        for (const e of Game.queue || []) e?.bobbin?.updateVisualStyle?.();
        for (const e of Game.rail || []) {
          e?.bobbin?.updateVisualStyle?.();
          e?.carrier?.updateVisualStyle?.();
        }
        for (const f of Game.inFlightCarriers || []) {
          f?.bobbin?.updateVisualStyle?.();
          f?.carrier?.updateVisualStyle?.();
        }
      } catch (e) { /* tolerate any stage that hasn't booted yet */ }
      break;
  }
}

// Throttle 3D re-renders so rapid slider drags don't pile up.
let _reRenderTrayPending = null;
function reRenderTrayY(yDeg, tiltDeg, idleYDeg = EditorTune.trayIdleYRotationDeg) {
  if (!window.Three3D) return;
  _reRenderTrayPending = { yDeg, tiltDeg, idleYDeg };
  if (reRenderTrayY._running) return;
  reRenderTrayY._running = true;
  (async () => {
    while (_reRenderTrayPending !== null) {
      const target = _reRenderTrayPending;
      _reRenderTrayPending = null;
      const newLying = await Three3D.renderTrayAt(target.yDeg, target.tiltDeg, 'lying');
      const newUpright = await Three3D.renderTrayAt(target.idleYDeg, 0, 'upright');
      Game.tex.tray = newLying;
      Game.tex.trayLying = newLying;
      Game.tex.trayUpright = newUpright;
      for (const e of Game.rail) {
        if (e.carrier?.refreshTextures) e.carrier.refreshTextures();
        if (e.carrier?.setOrientation) e.carrier.setOrientation('lying', true);
      }
      for (const f of Game.inFlightCarriers) {
        if (f.carrier?.refreshTextures) f.carrier.refreshTextures();
      }
      redrawDump();
    }
    reRenderTrayY._running = false;
  })();
}

let _reRenderBobbinPending = null;
function reRenderBobbinsY(yDeg, idleYDeg = EditorTune.bobbinIdleYRotationDeg) {
  if (!window.Three3D) return;
  _reRenderBobbinPending = { yDeg, idleYDeg };
  if (reRenderBobbinsY._running) return;
  reRenderBobbinsY._running = true;
  (async () => {
    while (_reRenderBobbinPending !== null) {
      const target = _reRenderBobbinPending;
      _reRenderBobbinPending = null;
      const newLying = await Three3D.renderBobbinStagesAt(target.yDeg, 'lying');
      const newUpright = await Three3D.renderBobbinStagesAt(target.idleYDeg, 'upright');
      Game.tex.bobbinStages = newLying;
      Game.tex.bobbinStagesUpright = newUpright;
      // Update all bobbin sprites' current stage texture
      const all = [];
      for (const e of Game.queue) all.push(e.bobbin);
      for (const s of Game.slots) if (s) all.push(s.bobbin);
      for (const e of Game.rail) all.push(e.bobbin);
      for (const b of all) {
        if (b._updateStage) b._updateStage();
      }
    }
    reRenderBobbinsY._running = false;
  })();
}

function applyAllEditorChanges() {
  // Trigger all the structural / re-render cases. Order doesn't matter — each
  // case in applyEditorChange is idempotent.
  applyEditorChange('arrowRadiusX');
  applyEditorChange('arrowSize');
  applyEditorChange('arrowCount');
  applyEditorChange('bobbinIdleScale');
  applyEditorChange('dumpX');
  applyEditorChange('trayIdleScale');
  applyEditorChange('railOffsetX');
  applyEditorChange('trayIdleYRotationDeg');
  applyEditorChange('bobbinIdleYRotationDeg');
  applyLayerOrder();
}

/* =========================================================================
 *  Main tick
 * ========================================================================= */
function tick(deltaFrames) {
  if (!Game.ready) return;
  // PIXI's deltaFrames is fraction of 1/60s
  const dt = deltaFrames / 60;
  if (Game.paused) return;
  // Editor mode freezes all game simulation so the user can edit a static scene.
  if (window.EditorTool && EditorTool.mode === 'edit') return;

  if (Game.clickCooldownT > 0) Game.clickCooldownT -= dt;
  if (!Game.boostTriggered && isBoostActive()) {
    Game.boostTriggered = true;
    spawnBoostPulse();
    HapticThrottle.medium();
  }

  try { tickInFlight(dt); }    catch (e) { console.warn('tickInFlight err', e); }
  try { tickRail(dt); }        catch (e) { console.warn('tickRail err', e); }
  try { tickPullFx(dt); }      catch (e) { console.warn('tickPullFx err', e); }
  try { tickAnims(dt); }       catch (e) { console.warn('tickAnims err', e); }
  try { tickRailArrows(dt); }  catch (e) { console.warn('tickRailArrows err', e); }
}

/* =========================================================================
 *  Init
 * ========================================================================= */
window.addEventListener('load', () => {
  boot().catch(err => {
    console.error('boot error', err);
  });
});
</script>
